body:
  text: 卷三腫脹總論秦子曰腫症在表者多脹症在表者少腫症腫於遍身現於皮膚在外不在內脹症脹於心腹即內經所謂心腹滿旦食不能暮食也是以其症當分其治當別然經絡同者症形治法亦無不同例如外感之腫與外感之脹二者固自各異至內傷五臟之腫與內傷五臟之脹則形症治法大抵相似今分列前後以備互相參考外感腫症風寒身腫風寒身腫之症惡寒身熱身首皆腫風勝多汗寒勝無汗此外感風寒即金匱風水皮水從太陽經主治之症也風寒身腫之因表氣素虛肺氣素熱表氣虛則外邪易入肺氣熱則皮毛易開寒襲於肌表鬱而不散則發熱身腫之症作矣風寒身腫之脈多見浮大或見浮數或見浮緊浮緩為風浮緊為寒浮數為熱風寒身腫之治浮緩散風浮緊散寒仲景防己黃耆湯治風者也甘草麻黃湯杏子湯散寒者也越婢湯桂枝芍藥湯和榮衛者也大腹皮散木香丸等和裡氣者也若風入肺經兼喘咳瀉白散加防風寒入肺經而發熱喘咳者瀉白散加麻黃防己黃耆湯防己黃耆甘草白朮上用七錢加薑棗煎服以綿被圍腰微汗為度潔古用此湯調五苓散金匱甘草麻黃湯甘草麻黃金匱杏子湯麻黃杏子甘草越婢湯麻黃石膏生薑大棗甘草桂枝芍藥湯桂枝白芍藥甘草大腹皮散青皮桑皮檳榔川芎羌活大腹皮防己木香丸木香五錢檳榔五錢二味同研水為丸硃砂五分為衣瀉白散桑白散地骨皮甘草風加防風寒加羌活麻黃寒濕身腫寒濕身腫之症身重身痛足脛冷胸滿悶遍身腫此寒濕腫之症也寒濕身腫之因或時令陰雨天氣寒冷或居處陰濕陰寒之氣襲於肌表或因汗出遇水水寒所傷則寒濕腫之症成矣寒濕身腫之脈脈多沉小或見沉遲或見沉濡寒濕身腫之治惡寒身痛先宜溫經散濕冬月麻黃桂枝湯余月羌獨敗毒散濕氣壅滯者勝濕湯肺經傷濕喘咳水腫導水茯苓湯麻黃桂枝湯麻黃桂枝白芍藥甘草羌獨敗毒散見後濕熱痿羌活勝濕湯見後濕熱腫導水茯苓湯原文治遍身腫喘滿倚息不能轉身飲食不下小便溺出如割而少如黑豆汁麥冬澤瀉白朮紫蘇陳皮赤茯苓柴胡檳榔木瓜砂仁木香桑白皮大腹皮濕熱身腫濕熱身腫之症身熱目黃小便赤澀胸腹脹悶四肢黃腫口渴心煩此濕熱作腫即陽水腫之症也濕熱身腫之因或濕熱行令襲人肌表或先傷於濕濕氣久留鬱而成熱則濕熱腫症作矣濕熱身腫之脈脈多洪數或見沉滑或見促結或見實大濕熱太甚脈反沉伏濕熱身腫之治宜清金利水金清則小便利而濕熱除清肺飲合四苓散二便俱閉八正散下部腫二妙丸濕熱在表者羌活勝濕湯清肺飲骨皮桔梗甘草黃芩桑白皮四苓散即五苓散去桂枝八正散見後濕熱腹脹二妙丸見後濕熱痿羌活勝濕湯治濕熱在表宜汗之症防風羌活柴胡白芷川芎蒼朮黃芩燥火身腫燥火身腫之症喘促氣急兩脅刺痛身面浮腫煩躁不得臥唇口乾燥小便赤澀即河間燥傷肺氣節齊先喘後腫之症也燥火身腫之因時值燥令燥火刑金絶水之源肺氣焦滿清化不行小水不利氣道閉塞而燥火腫症作矣燥火身腫之脈或見浮數燥傷於表或見沉數燥傷於裡或見躁疾燥傷於血或見洪數燥傷於氣燥火身腫之治若時令秋燥竹葉白虎湯燥傷於血清涼飲子有咳嗽石膏瀉白散竹葉石膏湯竹葉石膏桔梗木通薄荷甘草咳嗽加桑白皮地骨皮清涼飲子黃芩黃連薄荷玄參當歸芍藥甘草山梔牡丹皮石膏瀉白散石膏知母桔梗甘草桑白皮地骨皮黃汗身腫黃汗身腫之症身熱胸滿四肢黃腫而渴狀如風水汗出沾衣色如柏汁久不愈必致癰膿又有不惡風小便利若上焦寒口多涎身冷腫痛狀如周痹腦中窒不能食又有兩脛不冷反發熱名歷節食已汗出常見盜汗汗出不涼反發熱久久必甲錯生惡瘡身瞤瞤胸中痛劇者不能食身疼重煩躁小便不利皆黃汗腫症也黃汗身腫之因以汗出入水水邪內侵或汗出當風汗與水皆寒濕之氣內結郁久則成熱成黃而黃汗腫之症作矣黃汗身腫之脈其脈自沉或多沉遲陽症陰脈故用桂枝黃汗身腫之治金匱以身腫發熱汗出而渴狀如風水者用黃耆芍藥桂酒湯兩脛不冷反發熱名歷節食已汗出暮盜汗汗出反發熱者用桂枝加黃耆湯黃耆芍藥桂酒湯黃耆桂枝白芍藥上三味以苦酒煮如怕煩心以美酒易苦酒桂枝加黃耆湯桂枝芍藥生薑黃耆大棗生甘草楨按金匱治黃汗症一曰身體痛發熱汗出而渴汗出色如柏汁脈自沉者黃耆芍藥桂酒湯一曰黃汗之症兩脛自冷假令反發熱此風寒歷於肢節而痛名曰歷節又食已胃火勞動而汗出暮夜則營分有虛熱而盜汗然既汗出則宜身涼今因水邪內結不散故反發熱熱久汗多則皮膚之陰血為熱所灼為汗所耗久久必甲錯若再熱營氣熱胕必生惡瘡若身重汗出輒輕旋又復重則汗雖出發熱不減身重不除久久內氣必虛肌肉瞤瞤而動內虛中氣不得運則胸中痛元氣上下不貫則腰上有汗下無汗腰臗弛痛如有物在皮膚中而不和順劇者不能食疼痛煩躁小便不利桂枝加黃耆湯按前一症以汗出不固水邪入營鬱而發熱熱甚則發黃而渴故以桂枝和營以苦酒引入血分散其水寒則熱自退脈不沉矣但衛虛不宜多汗故用黃耆之力實衛耳後一症即桂枝原方加生薑大棗甘草又飲熱粥以助胃得汗其加黃耆實表固衛者何故蓋治脈浮發熱汗多熱不退之症不得不用桂枝以其多汗盜汗又不得不用黃耆此症因水寒之邪盤結不散汗雖出而熱不減正所云汗出而邪不出者故仲景於桂枝散表方中重加黃耆佐以大棗甘草生薑和其胃氣同功衛外使其邪出而汗不出也仲景以黃汗列之水氣門不入黃疸症中宇泰又以黃汗為黃疸之首而水腫門略注一條此亦互相發明之意然又有分別汗出染衣遍身無腫乃黃疸中之黃汗即準繩所云黃汗也黃汗染衣發熱脛冷即仲景黃耆芍藥桂酒湯所治之黃汗也黃汗染衣若脛不冷反發熱即仲景桂枝加黃耆湯所治之歷節也二症有腫不腫之分故有水腫黃疸之別水寒之邪內結脈沉當同傷寒例太陽發熱多汗之桂枝症用辛溫解肌使其邪散身涼不可同熱病門熱邪伏內汗出熱不退之症用清裡退熱者比內傷腫症肺虛身腫肺虛身腫之症瀉利喘咳面色慘白或腫或退小便清利或氣化不及小便時閉大便時溏即金匱脈沉自喘之正水此肺虛腫症也肺虛身腫之因勞役過度肺氣久虛清肅之令不行下降之權失職衛氣壅遏營氣不從則腫症作矣肺虛身腫之脈寸口細數肺液干少右關虛軟土不生金尺脈細數腎水不足肺虛身腫之治肺燥者生脈散土不能生金者四君子加杏仁貝母腎水不足人參固本丸肺氣不能收攝都氣丸生肺散人參揀麥冬北五味氣逆加橘紅有痰加貝母嗽多喘滿加桑白皮小便不利加杏仁四君子湯治肺氣不足人參白朮白茯苓甘草氣逆加橘紅人參固本丸生地熟地天冬麥冬人參痰加貝母都氣丸即六味地黃丸加五味子凡治虛證當明陰陽如陰虛當養陰陽虛當養陽如面色慘白二便清利氣怯神離肺之真陽虛也當用四君子湯若喘咳骨蒸痰火上逆痰中帶血此肺之真陰虛也又當用固本丸肺熱身腫肺熱身腫之症喘咳煩滿不得仰臥喘息倚肩身首皆腫小便赤澀此即內經諸氣膹郁肺熱成腫之症也肺熱身腫之因肺熱葉焦肺氣怫鬱升降之令不行治節之官失職則經絡壅閉營衛不諧而遍身頭面皆腫矣肺熱身腫之脈右寸洪數肺熱之診關脈實大胃火刑金尺脈數大腎火上炎左關弦數木火侮金左寸洪數心火剋金肺熱身腫之治宜清肺者家祕瀉白散兼風者加防風燥者二冬二母湯心火剋金瀉心湯肝火刑金瀉青丸龍膽瀉肝湯腎火刑金涼八味丸陽明多火肺受熏蒸葛根石膏湯水飲射肺面浮喘逆不得臥者葶藶清肺飲家祕瀉白散川連黃芩石膏甘草桑白皮地骨皮二冬二母湯天冬麥冬知母貝母瀉心湯黃連半夏甘草瀉青丸當歸川芎梔子龍膽草川大黃羌活防風甘草大便滑者去大黃身無痛不發熱去羌活防風有寒熱加柴胡舌赤加黃連小便赤加木通龍膽瀉肝湯膽草柴胡黃芩甘草山梔知母天冬麥冬黃連人參涼八味丸即六味丸加黃柏知母乾葛石膏湯乾葛石膏知母葶藶清肺飲葶藶子桑白皮地骨皮甘草大腹皮馬兜鈴脾虛身腫脾虛身腫之症小便清利大便溏泄面色萎黃語言懶怯常腫常退此脾虛腫之症也脾虛身腫之因大病後久瀉後脾土之真陰受傷轉輸之官失職不能運化水穀則諸經凝窒而腫症作矣脾虛身腫之脈或見濡軟或見弦數或見浮大或見細澀土敗雙弦乃為木賊脾虛身腫之治宜溫中健脾用理中湯實脾利水用白朮散或脾腎虛寒當溫補天真金匱腎氣丸脾虛痰凝者六君子湯脾陰虛損脾火自旺加味歸脾湯理中湯人參炮姜白朮炙甘草白朮散白朮豬苓澤瀉山藥蓮肉白茯苓人參金匱腎氣丸即六味地黃丸加桂附車前子六君子湯人參白朮茯苓甘草廣皮熟半夏加味歸脾湯即歸脾湯加丹皮山梔秦子曰脾虛亦有陰陽之分脾陰虛者脾血消耗脾火內炎脾雖虛而仍熱服溫補則火愈甚陰愈消必得滋補脾陰則陽退而無偏勝矣脾熱身腫脾熱身腫之症面腫目黃煩躁不臥皮膚常熱小便赤大便時泄時結常腫不退此脾熱腫之證也脾熱身腫之因膏粱厚味日積月纍熱聚脾中則脾熱腫之症作矣脾熱身腫之脈右關弦數熱積中州左關弦數肝熱乘脾右關沉滑痰飲在胸脾熱身腫之治加味瀉黃散梔連枳殼湯兼肝火者龍膽瀉肝湯胸前滿悶梔連平胃二陳湯或倍加川連枳實以消痞或加升麻乾葛以宣揚二便閉八正散白芍藥同川連大清脾經之火家祕戊己湯加川連清脾熱兼清肝火加味瀉黃散藿香山梔石膏甘草防風大黃白芍藥梔連枳殼湯枳殼厚朴廣皮甘草山梔川黃連龍膽瀉肝湯見前肺熱腫門梔連平胃散即平胃散加梔子連翹梔連二陳湯即二陳湯加川連山梔八正散見濕熱腫門戊己湯家祕清肝脾血分之火白芍藥甘草川黃連肝腎虛腫肝腎虛腫之症腹冷足冷小水不利或小腹腫腰間痛漸至腫及遍身面色黑黃此肝腎經真陽虛即內經石水症也若水虧火旺喘咳腹脹內熱便澀此肝腎真陰虛腫即內經腎水症也肝腎虛腫之因肝主施泄腎主閉藏肝腎之真陽不足不能司其開闔則小水不利若陰精素虛色欲太過肝腎之真陰不足虛火灼金小水亦不利內經所云關門不利聚水而生病也肝腎虛腫之脈左脈遲弦肝腎真陽不足左脈細數肝腎真陰不足左脈沉緊緊則為寒沉則為水左脈沉數沉則為里數則陰竭肝腎虛腫之治腎陽不足金匱腎氣丸河車丸腎陰不足人參固本丸家祕肝腎丸金匱腎氣丸見前脾虛腫河車丸治先天不足氣血兩虧人胞一具煎爛入白茯苓山藥打為丸人參固本丸見前肺虛腫家祕肝腎丸治腎水不足虛火上炎知母二兩黃柏二兩當歸三兩白芍藥三兩上為細末另以天冬地黃各六兩熬膏為丸楨按肝腎不足宜分陰虛陽虛例如治虛火要分氣分血分氣分虛火用補中益氣湯加黃柏知母血分虛火四物湯加黃柏知母故治肝腎陰虛火旺者用家祕肝腎丸以養真陰陽虛火衰者用八味丸以養真陽外感腹脹傷寒腹脹傷寒腹脹之症惡寒發熱自汗口渴小便不利小腹脹滿此熱結膀胱腹脹之症若裡熱不惡寒自汗不大便煩滿燥實此陽明胃實腹脹之症若腹脹硬痛小便自利大便或黑此蓄血腹脹之症也傷寒腹脹之因表邪不解內傳太陽之本則熱結膀胱小便不利而腹脹若表已解腸胃有實熱大便閉結則腹亦脹若血蓄下焦結硬小腹則腹亦脹凡此皆傷寒門腹脹也傷寒腹脹之脈左尺沉數膀胱結熱右脈沉實腸胃實熱兩尺沉牢乃是蓄血血結在陰脈反芤澀傷寒腹脹之治熱邪入里腹脹滿脈沉數大便結承氣湯選用腹脹宜下若寒熱者大柴胡湯若熱結膀胱腹脹小便不利者仲景用五苓散家祕用羌活木通湯調六一散若腹脹小便利大便黑桃仁承氣湯承氣湯大柴胡湯上二方見傷寒羌活木通湯見後不得臥五苓散白朮茯苓豬苓澤瀉肉桂桃仁承氣湯見後血鼓脹風濕腹脹風濕腹脹之症發熱身重不能轉側一身盡痛心腹脹滿外連頭面此風濕腹脹之症也風濕腹脹之因或居處卑濕或冒濕衝風脾胃受傷中州痞塞而腹脹之症作矣風濕腹脹之脈脈多浮濡或見浮緩或見弦長或見浮澀風濕腹脹之治胸前飽悶防風平胃散身熱惡風羌獨敗毒散荊芥湯下身重滯五苓散內外皆熱用防風木通湯此上下分消法也防風平胃散蒼朮厚朴廣皮甘草加防風下部脹加防己羌活敗毒散見後濕痿荊芥湯見後濕熱腹脹五苓散即四苓散加桂身發熱加防風防風木通湯治風濕神效防風木通濕熱腹脹濕熱腹脹之症面目黃腫小便赤澀大便或結或泄黃糜或日晡潮熱煩渴口苦口甘口淡腹脹脅痛此濕熱腹脹之症也濕熱腹脹之因濕熱之邪感入腸胃不得外泄濕淫太過痞塞不通則腹脹之症作矣濕熱腹脹之脈脈浮而濡趺陽反數或見浮大或見沉滑或見促結甚則反伏濕熱腹脹之治面黃目黃脅痛口苦肝膽有火龍膽瀉肝湯小便赤澀木通六一散二便皆澀八正散大便黃糜家祕瀉黃散日晡潮熱大柴胡湯煩渴口淡乾葛石膏湯口苦清膽火口甘清脾火口淡清胃火口齒清腎火身熱脈浮應汗者宜辛涼散表荊芥湯汗之龍膽瀉肝湯見前脾熱腫六一散木通湯沖服八正散瞿麥萹蓄滑石甘草山梔車前子木通大黃家祕瀉黃散蒼朮厚朴廣皮甘草枳殼川黃連酒客加乾葛腹痛加大黃小水赤加木通滑石陽明熱加乾葛寒熱加柴胡虛加人參大柴胡湯即小柴胡去人參加大黃乾葛石膏湯乾葛知母石膏甘草腹皮熱加地骨皮川黃連荊芥湯治表有濕熱腹脹身大荊芥防風薄荷地膚子寒濕腹脹寒濕腹脹之症身重不溫手足厥冷腹脹無汗此寒濕腹脹之症也寒濕腹脹之因春時應溫而反寒夏時應熱而反涼兼之天冷陰雨或坐臥卑濕寒濕襲於腠理壅閉脈絡而腹為之脹矣寒濕腹脹之脈寸脈沉遲沉則為水遲則為寒若見弦緊弦則善脹緊則惡寒寒濕腹脹之治身重身冷無汗甘草麻桂湯麻桂術甘湯下身重多汗防己茯苓湯寒濕內伏朮附湯中氣弱理中湯溫中氣而散寒濕甘草麻桂湯甘草麻黃桂枝麻桂術甘湯麻黃桂枝白朮甘草家祕白朮易蒼朮防己茯苓湯治里水腰下重防己黃耆桂枝茯苓甘草朮附湯溫經散濕此方獨勝白朮熟附子理中湯見前脾虛腫內傷腹脹氣結腹脹氣結腹脹之症胸腹凝結作脹脹而不休或胸前飽悶或小腹脹急此氣結作脹之症也氣結腹脹之因或因惱怒傷肝肝氣怫鬱或因思慮傷脾脾氣鬱結鬱怒思慮則氣血凝結而腹脹之症作矣氣結腹脹之脈多見沉澀或見沉弦或見沉伏脈經云下手脈沉便知是氣氣結腹脹之治攻衝刺痛四七湯寒凝結脹厚朴湯胸前飽悶枳桔平胃散小腹脹急青皮散小便澀滯木通飲四七湯治七情氣結半夏蘇葉厚朴白茯苓加生薑紅棗厚朴湯厚朴陳皮甘草乾薑白茯苓枳桔平胃散枳殼桔梗蒼朮廣皮甘草厚朴青皮散青皮大腹皮二味同煎木通飲治脅肋刺痛臌脹木通陳皮蘇梗甘草加生薑紅棗氣散腹脹氣散腹脹之症時脹時退氣怯言微目慢神清靜則稍減動作脹急此氣散腹脹之症也氣散腹脹之因或勞動太過中氣受傷或久病纏綿元氣受損肺不能通調脾不能轉輸腎不能閉藏則真氣散而腹脹之症作矣氣散腹脹之脈六脈無力虛大無根浮緩散慢神離反疾氣散腹脹之治氣怯言微生脈散動作脹急靜則稍減戊己湯加斂氣之藥氣不歸原都氣丸納氣丸氣虛極以四君子湯參橘煎送下生脈散生津液充血脈助元斂神人參麥冬北五味戊己湯伐肝扶脾調斂中州故名戊己白芍藥甘草都氣丸即六味地黃丸加北五味納氣丸即六味地黃丸加益智仁四君子湯見後脾虛脹參橘煎見喘症條肺虛腹脹肺虛腹脹之症面色慘白氣弱不振時脹時退二便清利此肺經陽虛之症若肌肉消瘦咳嗽面紅多汗骨蒸此肺經陰虛之症二者皆名肺虛腹脹症也肺虛腹脹之因肺陽不足治節無權肺陰虧損清肅不行肺為相傳主宰一身肺氣若虛諸經皆結而腹脹之症作矣肺虛腹脹之脈寸口脈微或見濡軟或見沉細或見沉澀甚則沉結肺虛腹脹之治肺陽不足脈緩濡軟四君子湯補中益氣湯肺陰不足脈虛細數人參固本丸生脈散肺虛氣壅難用補劑人參平肺散四君子湯保肺益氣補土生金人參白朮茯苓甘草補中益氣湯見前人參固本丸見前肺虛腫門生脈散見前氣散腹脹人參平肺散見後肺痹肺熱腹脹肺熱腹脹之症喘息倚肩不得仰臥煩悶咳逆腹脹胸痛常脹不退此肺熱腹脹之症也肺熱腹脹之因或肺素有熱又因膏粱厚味酒濕辛辣之積熱上蒸清道肺熱焦滿而腹脹之症作矣肺熱腹脹之脈右寸洪大肺經有熱右關上溢胃火熏蒸左寸洪數心火刑金左關弦數木中火發肺熱腹脹之治喘息倚肩不得仰臥煩悶咳逆葶藶瀉肺湯合瀉白散胃火熏蒸腹脹作痛大便結者枳桔大黃湯心火刑金瀉心各半湯木中火發瀉青各半湯以上三方家祕法也葶藶瀉肺湯葶藶子大棗瀉白散桑白皮地骨皮甘草枳桔大黃湯家祕治腸熱腸結諸腹脹大枳實桔梗大黃大腹皮桑白皮廣皮甘草瀉心各半湯家祕治心火刑金川黃連甘草桑白皮地骨皮瀉青各半湯家祕治肝火刑金膽草黃芩青黛甘草桑白皮地骨皮脾虛腹脹脾虛腹脹之症食少身倦脾虛不運二便清利言語輕微心腹時脹時退朝寬暮急此脾虛腹脹之症也脾虛腹脹之因脾氣素虛飲食難化強食過飽凝積腸胃榮衛稽留則脾虛腹脹之症作矣脾虛腹脹之脈或見虛軟或見空大或見細微或見弦急兩手雙弦木乘土位脾虛腹脹之治脾氣不實者參苓白朮散言語輕微者四君子湯心腹時脹飲食難消者加減枳朮湯參苓白朮散人參白朮廣皮白茯苓白扁豆甘草澤瀉蓮肉四君子湯人參白朮茯苓炙甘草加減枳朮湯白朮枳實人參廣皮甘草熟砂仁白茯苓脾實腹脹脾實腹脹之症眼目黃腫夜不得臥肚腹時熱小便赤色大便或結或瀉或時作痛瀉下黃沫肛門熱痛此脾實腹脹之症也脾實腹脹之因膏粱積熱濕熱之氣聚於脾中而不散濕熱傷脾不得轉輸傳道之令不行中州之官失職諸經凝窒而脾實腹脹之症成矣脾實腹脹之脈右脈滑大或見洪數或見沉實或見洪長或見沉急脾實腹脹之治眼目黃腫龍膽瀉肝湯肚腹時熱川連戊己湯川連枳殼湯小便赤色導赤各半湯瀉下黃沫家祕瀉黃散肛門熱川連枳殼湯加黃柏槐米胸前滿悶梔連二陳湯梔連平胃散加枳實以消痞滿龍膽瀉肝湯見前肺熱腫川連戊己湯白芍藥甘草川黃連川連枳殼湯川連枳殼木通甘草大腹皮地骨皮導赤各半湯黃芩黃連甘草犀角麥冬滑石梔子茯神知母人參家祕瀉黃散川連枳殼蒼朮厚朴廣皮甘草梔連二陳湯即二陳湯加山梔黃連梔連平胃散即平胃散加山梔黃連肝火腹脹肝火腹脹之症目睛黃兩脅痛小腹脹急或攻刺作痛或左邊脹甚小便赤夜不得寐此肝火腹脹之症也肝火腹脹之因或惱怒傷肝肝氣怫鬱或浩飲酒傷熱聚於膽木火乘脾則膈塞不利而腹脹之症作矣肝火腹脹之脈左關弦數或見沉弦或見沉數或見促止或見模糊沉細弦數肝家之火浮大弦數膽經之熱肝火腹脹之治輕者清肝飲未應瀉肝湯或左金丸清肝飲柴胡黃芩山梔連翹桔梗川芎甘草龍膽瀉肝湯膽草柴胡黃芩山梔連翹知母麥冬川連人參甘草左金丸川黃連吳茱萸二味同浸炒去吳茱萸用川連丸服肝腎虛脹肝腎虛脹之症腰軟作痛痛連季脅小便常澀氣怯消瘦小腹脹冷內經所云石水此肝腎經虛脹之症也肝腎虛脹之因真元不足斷削太過若腎之真陽虛則開闔之關不利腎之真陰虛則封閉之司失權若肝經虛損則施泄之令不行是以二便不得分曉而腹脹之症作矣肝腎虛脹之脈左關細小肝經不足左尺細小腎經不足若見沉遲真陽不足若見細數真陰不足肝腎虛脹之治腰軟常痛大造丸主之溶化龜鹿二仙膠為丸小便常澀小腹脹冷金匱腎氣丸主之若真陰虛脈數內熱者家祕肝腎丸大造丸懷熟地甘枸杞菟絲子厚杜仲山藥白茯苓紫河車金匱腎氣丸即熱八味丸加車前子川牛膝家祕肝腎丸見前肝腎虛腫食積腹脹食積腹脹之症肚腹脹急按之實痛或一條扛起或見纍纍小塊或痛而欲利利後稍減此食積腹脹之症也食積腹脹之因嗜食不謹胃強能納脾弱不消停滯脾胃之間則食積腹脹之症作矣食積腹脹之脈右關多滑或見沉實或見滑動或見弦急食積腹脹之治肚腹脹急按之實痛枳實散一條扛起痛而欲利利後稍減者枳朴大黃湯枳實散陳枳實萊蔔子麥芽山楂肉枳朴大黃湯陳枳實厚朴廣皮甘草大黃蟲積腹脹蟲積腹脹之症肚大青筋腹皮脹急反能飲食或面見白癍黑點或喜食一物或腹起塊扛大便偶見長蟲此蟲積腹脹之症也蟲積腹脹之因脾氣不足強食傷脾不能磨化停積於中濕熱生蟲而腹脹之症作矣蟲積腹脹之脈乍大乍小乍數乍遲或見沉滑或見沉實或見弦急或見沉弦蟲積腹脹之治追蟲丸萬應丸使君子丸有塊扛起下蟲積而愈追蟲丸黑醜檳榔雷丸南木香萬應丸黑醜大黃檳榔雷丸南木香沉香使君子丸使君子蕪荑鶴蝨檳榔百部苦楝根皮痰飲腹脹痰飲腹脹之症胸腹滿悶怔忡喘急短息倚肩嘔惡痰涎或腹中漉漉有聲此痰飲腹脹之症也痰飲腹脹之因胃強脾弱多食難化停滯為痰轉輸失職則腹脹之症作矣痰飲腹脹之脈脈多見弦或見沉滑或見沉弦或見沉伏或見偏弦痰飲腹脹之治胸悶怔忡痰飲也小半夏湯二陳湯喘息倚肩支飲也葶藶瀉肺湯嘔惡痰涎平胃二陳湯腹中漉漉有聲導痰湯下之小半夏湯熟半夏生薑二陳湯熟半夏白茯苓廣皮甘草葶藶瀉肺湯甜葶藶大棗肉平胃二陳湯蒼朮厚朴廣皮甘草半夏白茯苓導痰湯治痰涎壅盛胸膈痞塞熟半夏枳實橘紅南星茯苓甘草血臌腹脹血臌腹脹之症腹脹不減肚大紫筋腿足或見血縷小便反利大便或黑血在上則漱水多忘血在下則小腹悶痛此血臌腹脹之症也血臌腹脹之因或因驚恐跌撲或因惱怒悲哀或因過食辛辣血熱妄行不歸故道停積於中則血臌腹脹之症作矣血臌腹脹之脈脈多見芤或時見澀或見沉數或見細微或見沉伏或見牢實血臌腹脹之治腹脹不減紫筋血縷在上者紅花桃仁湯在下者桃仁承氣湯小腹硬痛者兩方合用紅花桃仁湯治上焦蓄血紅花桃仁當歸紅曲楂肉丹皮赤芍藥澤蘭胸痛加鬱金甚加韭汁脅痛加青皮甚加枳殼桃仁承氣湯治下焦蓄血桃仁桂枝芒硝甘草大黃臟寒腹脹臟寒腹脹之症四肢常冷小腹脹急冷硬如冰小便清利大便時瀉不思飲食唇口色白言語輕微內經所云正水即臟寒生滿病之症也臟寒腹脹之因真陽素虛臟氣不足又因口食冷物身得寒氣則身中之天地不交陰寒痞塞而臟寒腹脹之症作矣臟寒腹脹之脈六脈沉遲微細無力左脈沉遲肝腎虛寒右脈沉遲脾肺虛寒臟寒腹脹之治肝腎虛寒腹冷如冰大便不實八味丸小便不利金匱腎氣丸脾肺虛不思飲食言語輕微理中湯手足厥冷四逆湯八味丸即六味地黃丸加肉桂附子金匱腎氣丸即熱八味地黃丸加車前子牛膝理中湯見前脾虛腫四逆湯乾薑甘草附子六腑腹脹六腑腹脹之症胸前脹滿妨於飲食胃脹也腸鳴而痛濯濯有聲大腸脹也小便時赤小腹脹滿小腸脹也氣癃溺澀少腹脹急膀胱脹也氣滿膚中空空然響三焦脹也脅肋作痛口苦太息膽脹也此六腑腹脹之症也六腑腹脹之因飲食不節失飢傷飽每成胃脹中州停滯成痰成積肺氣不清下遺大腸則腹乃脹心胃有熱下遺小腸則腹亦脹肺氣怫鬱不能下輸膀胱則小腹脹三焦主人身之氣大氣周流則無障礙三焦壅滯腹脹乃作肝膽主木最喜條達不得疏通膽脹乃成此六腑腹脹之因也六腑腹脹之治胃脹者平胃散加減治之大腸脹者枳殼化滯湯導痰湯小腸脹者木通飲膀胱脹者五苓散三焦脹者枳殼青皮飲膽脹者柴胡清肝飲平胃散蒼朮厚朴廣皮甘草胃熱者加中梔連胃寒者加薑桂枳殼化滯湯枳殼厚朴神麯廣皮萊蔔子麥芽砂仁熱者加川連便硬加大黃導痰湯南星半夏枳殼橘紅甘草木通飲木通陳皮蘇梗甘草加生薑紅棗熱者加川連五苓散豬苓澤瀉白朮白茯苓肉桂熱結膀胱車前木通湯調下氣化不及州都參橘煎調下枳殼青皮飲枳殼青皮大腹皮三味等分上焦脹加桔梗中焦脹加蘇梗下焦脹加木通柴胡清肝飲柴胡山梔丹皮青皮蘇梗白芍藥鉤藤肝膽熱加龍膽草青黛家祕消脹散治腸胃停滯諸腹脹大半夏厚朴枳實香附麥芽楂肉蒼朮檳榔廣皮乾葛神麯萊蔔子共為細末木通大腹皮各三錢煎湯調服黃疸論秦子曰黃疸者身目皆黃色如橘皮濕氣勝則黃而晦熱氣勝則黃而明故爪甲皮膚悉見黃色即是黃疸若汗出染衣色如柏汁名曰黃汗身腫者入腫症門身不腫者入疸症門其間治法大同而從腫從疸則各異也外感黃疸黃汗黃汗之症眼白黃麵皮黃汗出染衣如黃柏汁發熱而渴狀如風水身疼煩重小便不利此黃汗之症也黃汗之因脾胃素熱汗出逢風或汗出入水水漬汗孔濕熱內蒸熱氣外現而成黃汗之症矣黃汗之脈洪大者愈易細澀者瘥難黃汗之治金匱於水腫門則立黃耆芍藥桂酒湯以治身重發熱兩脛自冷脈自沉之症又立桂枝加黃耆湯以治身發熱足脛熱盜汗汗出反發熱之症又於黃疸門亦立桂枝加黃耆湯以治諸黃家脈浮當汗之症詳見水腫門黃汗中黃耆芍藥桂酒湯治身重發熱汗出而渴黃汗染衣脈自沉黃耆芍藥桂枝桂枝加黃耆湯桂枝芍藥甘草生薑黃耆大棗正黃疸正黃疸之症食已即飢遍身俱黃小便或赤或不利憎寒壯熱身體如腫此黃疸之症也正黃疸之因臟腑積熱並於脾胃之間外因風濕相搏閉郁腠理濕熱熏蒸盒西而成黃則諸黃疸之症乃作正黃疸之脈寸脈浮緩緩則傷風趺陽緊數數則為熱緊則傷脾尺脈本沉浮則腎傷陽明脈遲遲則忌下正黃疸之治假令脈浮當以汗解桂枝黃耆湯若寒熱胸滿煩嘔小柴胡湯惡寒身痛表不解者麻黃醇酒湯若腹滿小便不利而赤自汗出此表解裡實熱宜下大黃硝石湯茵陳湯小便不利加減五苓散胸滿嘔吐小半夏湯黃結上焦者權用瓜蒂散吐之然不若吹鼻出黃水桂枝加黃耆湯治黃疸脈浮宜汗者若腹滿欲嘔吐懊憹宜吐不宜汗桂枝白芍生薑黃耆甘草大棗上水煮溫服須臾飲熱稀粥以助藥力取微汗小柴胡湯見後痠軟麻黃醇酒湯用麻黃冬月酒煮春月水煮大黃硝石湯大黃黃柏硝石梔子茵陳大黃湯茵陳大黃梔子小半夏湯半夏廣皮加姜煎茵陳五苓散即五苓散加茵陳內傷黃疸谷疸谷疸之症食谷頭眩心中怫鬱胃中苦濁小便不通遍身俱黃此谷疸之症也谷疸之因脾胃有傷不能運化水穀穀氣不消胃中苦濁濁氣下流小便不利濕熱內甚則身體發黃而谷疸成矣谷疸之脈趺陽緊數數則為熱緊即為寒陽明脈遲食難用飽滑大者易治弦緊者難痊谷疸之治脈遲者不可下茵陳湯治之胃熱血燥者用豬膏發煎潤燥下利能泄陽明之陰以泄穀氣之實今推廣茵陳平胃散泄陽明之陽以泄穀氣之實茵陳湯茵陳蒿梔子大黃上三味去滓溫作三服小便利如皂角汁色黃從小便出也豬膏發煎泄陽明之陰豬膏亂髮雞子大三塊上二味煎至發消藥成膏病從小便出以上金匱治法茵陳平胃散泄陽明之陽熟蒼朮厚朴廣皮山梔茵陳淡豆豉酒疸酒疸之症身目俱黃心熱足熱懊憹時時欲吐小便赤腹滿鼻燥胸中熱痛下之久久為黑疸目青面黑心中如啖蒜狀大便黑皮膚不仁此皆酒疸之症酒疸之因其人以酒為事或飢時浩飲大醉當風入水兼以膏粱積熱互相蒸釀則酒疸之症成矣酒疸之脈其脈浮弱或見洪大或見浮數或見沉數酒疸之治心中熱欲嘔者吐之或無熱神清腹滿欲吐先吐之脈沉者先下之酒疸心懊憹或熱痛金匱梔子大黃湯今推廣身發熱口渴者葛根湯治之作嘔合平胃散小便澀加減五苓散金匱梔子大黃湯治酒疸心中懊憹發熱梔子大黃枳實豆豉推廣乾葛湯乾葛山梔豆豉枳實甘草平胃散見前加減五苓散豬苓澤瀉白茯苓白朮茵陳女勞疸女勞疸之症發熱惡寒膀胱急小腹滿身黃額黑足心熱大便或黑或溏腹脹如水此女勞疸之症女勞疸之因其人必數醉入房熱氣聚於脾中不得散腎氣日衰夫醉飽入內脾腎交傷陰精耗而陽火亢則女勞疸之症作矣女勞疸之脈尺脈沉澀陰精內竭右關弦數熱聚脾中尺弱關實脾腎交傷女勞疸之治腹脹如水狀大便黑血不行也仲景硝礬散主之愈後以菟絲子丸調理硝礬散硝石即芒硝礬石二味等分為散小菟絲子丸菟絲子煮打為丸石蓮肉白茯苓山藥陰黃陰黃之症身無熱手足冷大便滑小便清白黃不鮮明飲食不進口不煩渴此陰黃之症也陰黃之因或熱病後過用寒涼或真陽素虛太陰陰寒凝結脾腎交傷則陰黃之症成矣陰