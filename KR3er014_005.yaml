皆主於大熱肺熱者色白毛敗心熱者色赤脈溢肝熱者色蒼爪枯脾熱者色黃而肉動腎熱者色黑齒槁又總結上文治痿之法曰獨取陽明陽明者五臟六腑之海主潤宗筋主束骨而利機關明明言陽明廣納水穀飲食熱物必先受之五臟六腑皆稟氣於胃若腸胃有積熱則陽明受熱肺受火刑而成痿矣原病式云手足痿軟非外中於風乃內熱而生因肺熱而血液乾燥不能榮養百骸故也子和云痿因肺熱相乘於四臟若作寒治是殺之也丹溪云治痿而得經旨者千古來惟河間一人劉宗厚云痿症內經所論至詳奈後代方書概多差謬皆因手足癱痿有似中風足躄難行又似風痹於是誤以中風諸痹治之遺禍至今楨按諸公之論極為正當但尚未發明內經論痿以陽明積熱相傳於肺治宜獨取陽明以澄其源則不消爍血液而主潤宗筋能束骨利機關故下文核明曰陰陽總宗筋之會會於氣衝而陽明為之長屬於帶脈而絡於督脈陽明病則宗筋熱而縱帶脈不引而足痿矣此言膏粱積熱內傷成痿之症必當獨取陽明而為治痿下手真訣夫內經治病獨詳於針灸而針法則曰虛者當補實者當取今言獨取陽明者以痿症乃陽明實熱致病耳然亦不特專務用藥即針取陽明是亦一法也再考生氣通天論云因於濕濕熱不攘大筋軟短小筋弛張此言痿攣之症不獨內傷亦有外感於濕若攘奪而去之則濕久變熱熱久變燥燥傷血液亦成痿攣申明濕熱未變燥熱可用祛濕清熱之法若已成痿攣亦宜清熱潤燥主潤宗筋若誤投燥濕則違悖主潤宗筋之經旨內經又云膏粱之變足生大疔又有能食而渴則發腦疽又云土太過令人四肢不舉此真膏粱積熱非肝腎經虛細按諸條皆五臟生熱發毒手足不舉足躄痿攣皆因膏粱積熱而起須要清腸胃之積熱然論禁忌燥熱之藥即專用滋陰降火亦非肝腎經虛而不對病者也但清腸胃積熱不比他經他經之熱易清膏粱積熱隨清隨起若縱肆口腹則飲酒焉酒熱上熏於肺矣厚味焉膏粱積熱矣即鹽從火化鹹味太多亦能發渴發熱駱龍吉云藥中肯綮若不淡薄滋味雖日進清熱而積熱日生一寒十暴吾知其不能萬全也夫膏粱積熱乃油膩葷腥之濕熱若見濕熱下瀉則不生疔發毒若濕熱不得下泄則壅腫而發毒矣若日久變燥二便阻澀則為土太過手足不舉矣故清除積熱則二便如常脾胃清和輸化水穀生精養血主潤宗筋而利機關痹證論秦子曰痹者閉也經絡閉塞麻痹不仁或攻注作疼或凝結關節或重著難移手足偏廢故名曰痹今列外感四條內傷八條外感痹症風痹風痹之症走注疼痛上下左右行而不定故名行痹此風邪為痹之症也風痹之因或元氣不充或病後體虛或飢餓勞役風邪乘之則風痹之症作矣風痹之脈或見浮緩外受風邪或見浮數乃是風熱或見浮緊風寒之別浮濡而澀乃是風濕風痹之治風寒攻痛防風湯表裡有邪者防風通聖散和血散痛湯大秦艽湯風熱痛者四物二妙丸風濕之邪蒼防二妙湯防風湯防風當歸赤茯苓杏仁秦艽葛根羌活桂枝甘草防風通聖散防風川芎當歸白芍藥大黃薄荷麻黃連翹芒硝石膏黃芩桔梗滑石甘草荊芥白朮山梔生薑和血散痛湯羌活升麻麻黃桃仁柴胡紅花當歸防風甘草獨活豬苓黃柏防己知母黃連大秦艽湯治風濕攻走作痛羌活升麻獨活蒼朮防風威靈仙茯苓當歸澤瀉秦艽四物二妙丸治風熱攻走作痛蒼朮黃柏羌活白芍藥威靈仙陳皮蒼防二妙湯治風濕攻走作痛蒼朮防風同煎服寒痹寒痹之症疼痛苦楚手足拘緊得熱稍減得寒愈甚名曰痛痹此寒邪成痹之症也寒痹之因營氣不足衛外之陽不固皮毛空疏腠理不充或沖寒冒雨露臥當風則寒邪襲之而寒痹作矣寒痹之脈脈多浮緊或見浮弦或見沉遲脈若見數寒鬱成熱寒痹之治寒傷太陽在營分無汗麻黃續命湯傷衛有汗桂枝續命湯寒傷陽明乾葛續命湯在少陽柴胡續命湯今家祕立十味羌活湯通治之麻黃續命湯即本方倍加麻黃桂枝續命湯即本方倍加桂枝乾葛續命湯即本方倍加乾葛柴胡續命湯即本方倍加柴胡家祕羌活湯通治風寒濕三氣痛痹羌活防風秦艽柴胡葛根獨活川芎蘇梗木通鉤藤濕痹濕痹之症或一處麻痹不仁或四肢手足不舉或半身不能轉側或濕變為熱熱變為燥收引拘攣作痛蜷縮難伸名曰著痹此濕痹之症也濕痹之因或身居卑濕濕氣襲人或衝風冒雨濕留肌肉內傳經脈或雨濕之年起居不慎而濕痹之症作矣濕痹之脈脈見浮濡乃是風濕脈見浮緊乃是寒濕脈洪而數濕熱之診濕痹之治發汗羌活除濕湯胸滿悶茯苓湯風濕蒼防二妙湯寒濕朮附湯濕熱蒼柏二妙丸羌活除濕湯通治風寒濕熱四氣成痹羌活防風柴胡獨活蒼朮茯苓澤瀉豬苓甘草陳皮黃連黃柏川芎升麻茯苓湯即枳桔二陳湯易赤茯苓蒼防二妙湯治風濕成痹蒼朮防風二味等分同煎朮附湯治寒濕成痹蒼朮熟附子蒼柏二妙丸見前濕熱痿熱痹熱痹之症肌肉熱極唇口乾燥筋骨痛不可按體上如鼠走狀此內經所云陽氣多陰氣少陽獨盛故為熱痹之症內經原有熱痹方書止列三條誤也熱痹之因陰血不足陽氣偏旺偶因熱極見寒風寒外束內經云靈氣相薄則脈滿而痛此熱痹所由生也熱痹之脈浮大而數熱在經絡沉大而數熱已深入大數屬氣細數者血寸脈數大熱在於上尺熱數大熱在於下熱痹之治熱在經絡者四味舒筋湯熱已深入潛行散氣分有熱者蒼柏二妙丸熱在血分者虎潛丸四味舒筋湯治腿足腫痛腳筋攣縮獨活當歸黃柏蒼朮四味等分同煎潛行散滋陰補腎壯骨健行此方獨勝黃柏一味炒研水丸服蒼柏二妙丸治濕熱傷氣分者蒼朮黃柏二味同研水丸虎潛丸治濕熱入血分者龜板膠四兩黃柏四兩炒知母四兩川牛膝二兩熟地黃四兩白芍藥四兩當歸四兩虎骨骱一兩炙上為細末玄武膠溶化為丸內傷痹症肺痹肺痹之症即皮痹也煩滿喘嘔逆氣上衝右脅刺痛牽引缺盆右臂不舉痛引腋下此肺痹之症也肺痹之因或形寒飲冷或形熱飲熱肺為華蓋惡熱惡寒或悲哀動中肺氣受損而肺痹之症作矣肺痹之脈寸口脈澀責之在肺或見遲弦寒飲所傷或見洪數乃是傷熱浮遲肺寒沉數里熱肺痹之治火熱傷肺者家祕瀉白散肺氣受損肺虛液少生脈散加二冬二母氣虛上逆參橘煎人參平肺散家祕瀉白散桑白皮地骨皮甘草黃芩石膏川連生脈散人參麥門冬北五味三味同煎參橘煎人參橘紅二味同煎人參平肺散人參桑白皮地骨皮肥知母天門冬橘紅甘草心痹心痹之症即脈痹也脈閉不通心下鼓暴嗌乾善噫厥氣上則恐心下痛夜臥不安此心痹之症也心痹之因或焦思勞心心氣受傷或心火妄動心血虧損而心痹之症作矣心痹之脈左寸沉數沉為心痛數為心熱或散而大散則失志大則失血心痹之治心火盛者導赤各半湯心神失守者安神丸虛弱人歸痺湯虛火旺者天王補心丹導赤各半湯川黃連甘草生地木通山梔麥冬犀角硃砂安神丸硃砂川連生地當歸天王補心丹人參玄參丹參桔梗遠志肉酸棗仁柏子仁天冬麥冬五味當歸生地茯神川連肝痹肝痹之症即筋痹也夜臥則驚多飲數小便腹大如懷物左脅凝結作痛此肝痹之症也肝痹之因逆春氣則肝氣怫鬱惱怒傷肝則肝氣逆亂驚動魂魄則肝氣不寧皆成肝痹之症也肝痹之脈左關弦數肝家有熱或見沉滯肝家鬱結或見虛弦肝家少血肝痹之治左關弦數者瀉青丸或瀉肝湯左關沉滯者柴胡疏肝散左關虛弦逍遙散或補肝散瀉青丸當歸龍膽草川芎梔子大黃羌活防風龍膽瀉肝湯見前肝火脹柴胡疏肝散柴胡陳皮川芎芍藥枳殼香附甘草逍遙散白朮白芍藥當歸甘草柴胡陳皮補肝散山茱萸當歸北五味山藥黃耆棗仁川芎木瓜熟地白朮獨活腎痹腎痹之症即骨痹也善脹腰痛遺精小便時時變色足攣不能伸骨痿不能起此腎痹之症也腎痹之因內經云或遠行勞倦逢大熱而渴水不勝火則骨枯而髓虛或不慎房勞精竭血燥則筋骨失養腰痛不舉而腎痹之症作矣腎痹之脈兩尺細數或見浮大腎脈本沉今反躁疾水衰火動腎痹之脈腎痹之治遠行勞倦者坎離丸房勞精竭者河車封髓丹腎火上炎者家祕滋腎丸真陽不足者八味丸料溶鹿龜二膠為丸真陰不足者家祕天地煎坎離既濟丸見前腎痿河車封髓丹天門冬熟地黃人參河車一具家祕滋腎丸黃柏二兩知母二兩肉桂二錢共為細末玄武膠為丸八味丸即六味丸加肉桂附子家祕天地煎天門冬懷地黃知母黃柏四味同煎三次去渣沖玄武膠收膏服脾痹脾痹之症即肌痹也四肢怠惰中州痞塞隱隱而痛大便時瀉面黃足腫不能飲食肌肉痹而不仁此脾痹之症也脾痹之因脾為胃行津液權主磨化若飲食過多飢飽失節則脾氣受損失其健運而脾痹之症作矣脾痹之脈脈見弦滑脾虛停滯若見空大脾胃損傷若見虛細脾弱多痢脾痹之治脾虛不能磨化枳朮消痞丸脾有停滯者保和丸脾虛失健運之機四君子湯大便不實異功散參苓白朮散枳朮丸白朮陳枳實保和丸山楂神麯半夏白茯苓萊蔔子陳皮連翹四君子湯見前腹脹異功散即四君子湯加陳皮六君子湯即異功散加半夏腸痹腸痹之症數飲而小便不出氣窒小腹中氣喘爭時發飧泄此腸痹之症也腸痹之因或飲水太過或飲食有傷中氣乖張壅塞閉逆不得下順返而上衝則喘爭小便不利水穀混於大腸則飧泄此腸痹之因也腸痹之脈六脈多弦寸口脈弦病在於肺尺脈弦數下部有熱左關沉弦小腹氣結右關沉弦病在中焦寸沉尺浮大腸飧泄六脈沉遲真陽內竭腸痹之治數飲病在上當清肺知母石膏湯小便不出五苓散氣窒小腹病在下青皮飲中氣喘爭枳殼湯若有飧泄當分利陰陽四苓車前散飧泄脈遲異功散合八味腎氣丸知母石膏湯治上焦消渴知母石膏麥冬竹葉桑白皮甘草五苓散見裡熱不得臥青皮飲青皮大腹皮木通枳殼陳皮白芍藥甘草枳殼湯枳殼蘇梗桔梗陳皮甘草四苓散即五苓散去肉桂八味腎氣丸即金匱腎氣丸胞痹胞痹之症即膀胱痹也小腹脹閉按之內痛若沃以湯清涕上出小便下澀膀胱脹急此胞痹之症也胞痹之因膀胱者州都之官津液藏焉氣化則能出矣其人若上傷肺氣清化之令不及州都下傷腎氣開闔之關不利而胞痹之症作矣胞痹之脈或見沉數胞中熱結或見沉澀虛中之熱或見細澀氣化不及或見沉遲陽虛陰結胞痹之治脈沉而數者八正散去大黃脈虛而數清心蓮子飲津液干竭生脈散氣化不及補中益氣湯脈沉遲者金匱腎氣丸八正散見濕熱腫清心蓮子飲黃芩麥冬地骨皮車前子石蓮肉人參黃耆白茯苓甘草生脈散見前精虛消補中益氣湯見虛煩不得臥金匱腎氣丸見前肝腎腫脹胸痹胸痹之症即胃痹也胸前滿悶凝結不行食入即痛不得下咽或時作嘔此胸痹之症也胸痹之因飲食不節飢飽損傷痰凝血滯中焦混濁則閉食悶痛之症作矣胸痹之脈金匱云陽微陰弦又云寸口脈沉而遲乃言陽微也關上小緊數乃陰弦也胸痹之治金匱以喘息咳唾胸背痛短氣栝蔞薤白白酒湯主之加以不得臥心痹徹背者栝蔞薤白半夏湯主之若心中痛留氣結在胸胸滿兼以脅下逆搶心枳實薤白桂枝湯後以人參湯補氣若甚而胸中氣塞加以短氣茯苓杏仁甘草湯後以橘枳生薑湯胸痹肢節之筋有緩有急米仁附子湯心中痛痞逆桂枝生薑枳實湯以上金匱以寒因主治之法若熱因諸胸痹則梔連二陳湯小陷胸湯川連枳橘湯加味二陳湯可以選用也栝蔞薤白白酒湯栝蔞實薤白白酒栝蔞薤白半夏湯栝蔞實薤白半夏白酒枳實薤白桂枝湯枳實薤白桂枝厚朴栝蔞人參湯人參白朮乾薑炙甘草茯苓杏仁甘草湯茯苓杏仁甘草橘枳生薑湯橘皮枳實生薑薏苡附子湯薏苡仁熟附子上二味為末白湯調服五分桂枝生薑枳實湯桂枝生薑枳實以上八方金匱治寒因痹梔連二陳湯即二陳湯加山梔黃連小陷胸湯栝蔞實半夏川黃連川連枳桔湯即枳桔湯加川連橘皮名川連枳橘湯加味二陳湯陶氏治痰結胸痛熟半夏白茯苓陳皮甘草枳實桔梗川黃連栝蔞仁杏仁以上四方家祕增補以治熱因之痹胸痹與胃痛有別胃痛不因飲食亦痛胸痹不飲無恙飲食則痛而不能下若論病因同是痰飲死血酒食損傷憂思鬱結究其輕重則胸痹為重以胃痛實症居多實者易平胸痹起於日久損傷難治耳痠軟論秦子曰酸主乎火軟主乎濕內經云疼酸驚駭皆屬於火又云大筋軟短皆因於濕詳考何經致病則陽明主多故治痿獨取陽明以其主潤宗筋束骨而利機關也謹按陽明經外感有風濕有濕溫則令人遍身痠軟陽明經內傷有痰飲有濕火亦令人遍身痠軟其病發作如瘧疾之有定期或一日或間日而發若發於寅卯時乃是肝膽經火若發於辰巳時又是太陽經病二者皆陽明之兼病也外感痠軟風濕痠軟風濕痠軟之症頭痛額痛一身盡痛不能轉側四肢痠軟骨節煩疼日晡發熱劇者風濕痠軟之症也風濕痠軟之因或流衍之紀風雨連綿或衝風冒雨陰雨襲人或乘風露臥陰濕之邪傳入經絡則遍身痠軟之症作矣風濕痠軟之脈左脈浮大或反沉伏太陽風濕右脈浮大或反沉伏陽明風濕六脈弦大少陽風濕風濕痠軟之治頭痛身痛不能轉側症兼陽明者羌活勝濕湯倍加防風乾葛額痛目痛鼻乾不眠日晡劇者陽明經症也乾葛湯加蒼朮防風發汗已多汗加秦艽木瓜若時寒時熱少陽見症者小柴胡湯加防風蒼朮久不愈者聖惠方用柴胡以治肝膽之痠軟重用秦艽而得捷效以痠軟無有不兼陽明者也羌活勝濕湯治太陽少陽濕溫羌活防風柴胡蒼朮川芎茯苓豬苓澤瀉黃柏甘草乾葛湯治陽明經症乾葛升麻白芍藥甘草小柴胡湯見內傷痠軟聖惠方治少陽陽明痠軟神效柴胡一兩秦艽一兩甘草三錢原方家祕治濕勝加蒼朮有熱加黃柏有風加防風通加木瓜以引經奇驗濕溫痠軟濕溫痠軟之症頭痛項強骨節煩疼發熱多汗兩脛逆冷遍身痠軟煩悶引飲胸滿嘔吐此濕溫痠軟之症也濕溫痠軟之因地之濕氣上升天之熱氣下降濕溫之氣充塞兩間人為濕熱所傷則痠軟之症作矣濕溫痠軟之脈左脈浮數太陽濕溫右關脈數陽明濕溫六脈弦數少陽濕溫濕溫痠軟之治頭痛項強骨節煩疼兩脛逆冷太陽表症也羌活防風湯有汗者合神術湯發熱多汗煩躁煩渴陽明經症也葛根湯合神術湯寒熱往來胸滿嘔吐少陽經症也小柴胡合神術湯陽明少陽合病者聖惠方絶妙羌活防風湯羌活防風甘草陳皮神術湯通治濕溫蒼朮石膏乾葛湯見前條小柴胡湯見後痰飲痠軟條聖惠方見前條家祕治痠軟要方內傷痠軟痰飲痠軟痰飲痠軟之症胸次不寬噁心飽悶時或四肢重滯不能舉動或背心一片冰冷如石時或間日而發作如瘧此痰飲痠軟之症也痰飲痠軟之因飲食過飽停積中焦熱氣勝則成頑痰結痰水氣勝則成留飲伏飲聚於胃中攻注手足肩背則痠軟等症作矣痰飲痠軟之脈右關脈滑胃家有痰左關弦滑肝膽留涎脈滑不數留飲伏飲脈滑而數結痰熱痰痰飲痠軟之治右關脈滑噁心飽悶者桔梗湯平胃二陳湯背心一片如冰者水煮金花丸四肢不能舉動便實者指迷丸間日發作者平胃二陳湯左關弦數脅下作脹者膽星湯有寒熱合小柴胡湯桔梗湯枳殼桔梗半夏陳皮平胃二陳湯半夏陳皮蒼朮厚朴甘草白茯苓水煮金花丸半夏膽星天麻雄黃上為細末白麵為丸指迷丸半夏茯苓陳皮甘草枳殼玄明粉膽星湯家祕治膽火成痰四肢痠軟陳膽星柴胡黃芩陳皮甘草青黛海石小柴胡湯柴胡黃芩陳皮甘草人參積熱痠軟積熱痠軟之症四肢煩疼時或重滯手足心時冷時熱或發熱如瘧時或清爽時或倦怠時或身重如負重物小便黃赤大便乍難乍易此積熱痠軟之症也積熱痠軟之因或膏粱積熱濕熱甚於腸胃之中或飲酒使內熱氣聚於脾中而不散或多飲茶湯水濕久積於內則成積熱痠軟之症矣積熱痠軟之脈多見弦數弦主脾病數主脾熱右關弦數腸胃積熱左脈弦數肝膽之熱積熱痠軟之治膏粱積熱梔連二陳湯清胃湯熱氣聚於脾中者梔連戊己湯木火乘脾者龍膽瀉肝湯梔連二陳湯山梔川黃連陳皮甘草半夏白茯苓家祕用此方清胃家痰火胸前飽悶加蒼朴清胃湯治胃中有火無痰升麻川黃連山梔甘草丹皮口乾渴加乾葛唇焦消水加石膏梔連戊己湯山梔川黃連白芍藥甘草家祕用此方清脾火兼清肝火龍膽瀉肝湯治肝膽實火龍膽草黃芩山梔知母天門冬麥門冬柴胡人參甘草川黃連痠軟痿攣病在筋脈方書以為肝經所主然細詳病情實陽明經主病者多以陽明為宗筋之會主束骨而利機關且陽明為水穀之海濕熱本於此濕熱在經未變燥熱濕主乎柔則發酸軟濕熱變燥則燥主乎剛燥傷血脈筋徑脈強二症起病相同傳變各別故治法各異治痿攣用清潤宗筋治痠軟主清燥宗筋家祕平胃散蒼獨三妙丸合聖惠方治痠軟之大法也
