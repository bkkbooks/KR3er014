body:
  text: 卷首論醫宗必讀症因差誤治法不合李士材先生醫宗必讀書廣為流布也先生大意多得之王宇泰準繩而立論則宗薛氏十六種其論中風一症則辨別真類泄瀉之治立法昭明心胃之痛詳加注別咳嗽腰痛皆分外感內傷腫脹之症分別虛實寒熱俱無遺儀者矣但其中尚有未純之處前此相沿成弊如首論傷寒傳至三陰之條誤引直中陰經之方混一立治夫先起三陽以後傳至三陰乃是傳經之陽證經雖屬陰邪則陽邪故傷寒經云先發熱後發厥此乃是傳經之邪非直中陰經寒證是熱深厥深之謂也今先生反用直中陰經陰證之方而曰輕則理中湯重則四逆湯後於直中陰經條下又云初起不發熱便是寒證者名為直中陰經之寒症亦以此二湯主之夫傳至三陰陽症也直中陰經陰症也一寒一熱二症天壤而以一法混治豈理也哉至論虛勞一症於吐血條下首列蘇子降氣湯一方極為不可丹溪先生曰口鼻出血皆是陽盛陰虛法當補陰抑陽又曰犀角之性能升散一切有餘之火若陰虛者用之寧免飛揚之患乎夫犀角清涼辛散尚為陰虛者所戒而蘇子前胡半夏沉香辛溫升散之味豈為虛勞吐血之所宜乎此乃外感吐血之方不應列入虛勞吐血條內先生因見準繩書失於分別是以輾轉相誤後張三錫先生集治法匯獨刪去此方良有苦心也至痢疾一症有四時寒熱之不同今先生混引衛生寶鑑所引經文脾泄腎泄內傷痢症之説而歸重於脾腎二經立論不知脾傳腎腎傳脾乃論五臟相承內傷痢非所論夏秋熱痢之條今先生論中既曰痢起夏秋濕蒸鬱熱亦論夏秋之痢矣即當從秋令燥金陽明司令立論而歸重於腸胃二經不宜牽入脾腎去夏秋之先水泄後膿血先膿血後水泄乃是手足陽明腸胃之濕熱症非脾腎相傳之微邪賊邪內傷症也古人云大腸受病則氣凝注而成白痢小腸受病則血凝注而成赤痢大小腸均受其病則赤白相雜而下胃之濕熱下淫於大小腸者亦如此即按經文曰腸澼下血曰腸澼下白沫曰腸澼下膿血諸條之論皆以腸字立言不曰脾澼腎澼而曰腸澼則知痢症當以腸字為主矣今先生論中脫卻腸字本題而獨重於脾腎二臟則夏秋之痢先生欲補此兩臟乎抑欲溫此兩臟也夫脾泄腎泄藏氣不足內傷之虛症藏症也夏秋之痢腸胃受邪外感之實症腑症也內傷不足外感有餘二者天壤即有少陰下痢膿血一症乃是手少陰心主為患非足少陰脾傳腎之一症故保命集以少陰痢曰小腸泄以心與小腸為表裡心移熱於小腸小腸移熱於大腸則下痢膿血以手少陰心經主血故也經雖屬陰症則陽邪如傷寒陽症傳陰經之比也夫夏秋之痢先要究其致病之根當五六月巳午丙丁行權而庚金大腸受克於夏令之時預傷其金水至秋燥金行令金被火刑熏爍下溜赤屬火之本來白屬金之本色而赤白相雜之痢作矣即或純白無紅雖非心火所乘亦為素秋燥火太旺傷其金位本身故白色溶化而下此為乘令而得病者也今先生言言牽帶脾腎妄存溫補固澀橫格胸中致令癡人説夢便有初起之痢腸胃壅滯熱鬱於內反見外寒兼化之象誤認虛寒竟以古人辛溫發表方中妄加補澀之藥混活濕熱燥熱之痢不知古人辛溫散表乃治寒濕之痢也症重者為害匪輕症輕者遷延變重即有用溫補能愈此疾者非前醫大用祛積積氣已清即寒涼直進失加嚮導抑遏中州偶遇辛溫開通鬱結實處得辛溫散結之功非得溫補之力也夫濕鬱一痢從時令寒濕之加臨外郁表邪內壅積滯是以用辛溫之藥然亦但取其辛溫散表非取其辛溫溫補也夫治痢過用寒涼克削誠為不可但起內濕火燥火失於清利則腸胃頃刻腐爛補脾補腎乃是後來調理法也故曰視其緩急調其氣血表症在者汗之散之里症急者清之利之至痢症中腹痛一門有積滯壅塞之痛用下藥以行之有氣鬱大腸之痛用苦梗以開之有氣血不和之痛用芍藥以和之今止舉氣鬱一條曰以桔梗開之下曰以芍藥為主不分二味收散不同混敘氣鬱條內又無積滯作痛應下本條似乎腹痛之痢再無下行之法又云惡寒者加乾薑惡熱者加黃連夫症有似陰似陽兼化之假象宜察內症脈息未可以惡寒惡熱為據也後肛痛一條上云熱流於下用槐花木香是矣又云挾寒者用理中湯挾字下得不妥原病式云豈有寒熱夾雜於腸胃間乎夫肛痛初起再無寒痛之理痢之日久然後見痛方為元氣下陷然止宜用補中益氣湯以升提之未可用理中湯以治因肛痛皆是濕熱下流燥火閉塞即痢之日久者亦止宜於補未宜於溫即令虛矣寒則未必寒也若是虛而兼寒則肛門當不禁而無疼痛矣又曰局方復庵例用辛熱河間丹溪例用苦寒何其執而不圓不知夏秋之痢與四時之痢不同夏秋之痢本於濕熱但有濕淫燥淫之別從治正治之分有邪凝內伏之虞是以用辛散以治寒濕之痢此宗內經濕淫於內治以苦熱濕淫所勝半以苦熱而開濕淫為痢表症居多之法門也河間丹溪例用苦寒蓋謂夏秋之痢燥火為患熱毒壅害腸胃此時若效從治之法則燥火而遇辛溫腸胃頃刻焚爛是以用苦寒宣利之劑以為正治之法此宗內經熱淫於內治以鹹寒熱淫所勝治以苦寒而開燥熱為痢里症居多之法門也用溫用寒因發表攻裡二法各別今先生不發明四公之意開示後人反毀四公今後學不明余今較正傷寒例仍遵仲景先生之法夏秋之痢當分燥火濕火四時之痢當分外感內傷時行疫痢當分六氣歲氣如雨濕之年流衍之紀宜用發表者以辛涼辛溫之法治之亢旱之年赫曦之政宜用攻裡者以苦寒鹹寒之味治之深彰先生之道而全先生之書也論趙氏醫貫症因差誤治法不合嘗讀趙先生醫貫書發明先天水火之論深得守真先生保命陰陽微旨此軒岐堂上獨契玄提而有此出類之見然其論先天水火誠為萬世準繩至於論症論治之中敢為先生一二指陳如首論內經十二官論謂心主之官非心也別有一心主在無極無形之際以命門為君主夫先生之論先天無形之水火內經之論後天有形之臟象也今以無形先天之理以論後天反使後學差誤又云世之養生者宜加意於補火而比類於鰲山之燈火熄則不動火旺則動速獨不思火不宜動動則病矣速則易終而易壞火太旺則一炬成燼矣故養生家務靜不務動今云火旺動速是妄開後世偏於補火過端夫陰陽之道不可偏廢陰旺則陽虧陽旺則陰竭二者一有偏勝則為病矣今先生立有陽無陰之論有偏於補陽之弊至論傷寒一症於口燥口渴條中獨重地黃之滋陰但傷寒末後之時為虛熱初起之時為實熱今以地黃膩膈之味施以初起口渴症中則邪熱凝滯食氣不消其渴愈甚且口乾作渴皆屬陽明氣分之病今先生不分氣分血分之所屬竟云滋補腎中真陰不知邪熱未去雖日進滋陰無益於病仲景先生不設滋陰補血之方於口燥咽乾條內良以滋陰之藥治血虛發熱之內傷症非治熱邪為患之外感法也至於血症論中往往以外感內傷混一立論將內經太陽司天寒淫所勝民病嘔血血泄之論引金匱外感吐血方中麻黃桂枝等湯主治不知內經所論寒淫所勝言人表有六淫之寒邪壅遏發熱邪熱鬱於太陽之經不得發越故血從口鼻而出是以傷寒論有太陽傷寒失與麻黃湯發汗遂成衄血吐血之語今先生誤認太陽寒淫所勝之寒乃是虛寒之寒而以溫熱施治又不著明外感內傷此等立法最為誤事至論相火龍雷更有疵謬夫龍雷之理獨詳周易龍雷天象卦屬於乾實主純陽初九為潛九二為見上九為亢以明初陽在下未可施用必待上行九五方得剛健居尊之體至上九又為陽居過極而為亢龍有悔矣至雷屬於震於位屬東甲木所主蓋一陽初動於二陰之下則曰震動其地及其二陽見上卦成乎巽而龍雷皆得其令矣古人以肝腎之火喻之者以二經一主乎木一主乎水然皆有相火存乎其中故乙癸同源二經真水不足則陽旺陰虧相火因之而發治宜培養肝腎真陰以制之不使其陽居過極為乾之上九離之九四是矣今先生云得濕則焫遇水則熾以火遂之則焰灼自消而獨以桂附辛熱之藥溫補天真之火不知龍雷之火惟春分以後秋分以前少陽相火少陰君火太陰濕上三氣合而行令一土不勝二火一陰為二陽所逼上下皆陽一陰獨寓於中於卦成離於是炎暑時行天之熱氣下降地之濕氣上蒸或龍從海起水自天生或龍從天降水自地起震動其地而雷出離麗乎天而電生上下相合則火雷鼓頷作聲而成噬嗑之象矣及其雲行雨施則天氣分而清涼龍雷各自隱伏古人所謂移星易宿龍蛇起陸惟夏月見之今先生云冬時陽氣在下龍雷就火氣之同類而居於下夏月陰氣在下龍雷不能安其身而出於上果爾則龜鱉陰類之物夏伏何處冬見何地乎夫龍雷何故獨見於春夏而獨屬於震離也震屬東方生升之位天干甲乙地支寅卯離屬南方明麗之位天干丙丁地支巳午夫火長生於寅臨官於巳帝旺於午也夫子醜為開闢之初坎為方萌之陽包藏於二陰之間未能發動至寅則陰氣始剝有震動發生震驚百里之象及至天下雷行卦為無妄然後萬物皆生至巽則二陽皆生於上萬物皆齊至離則上下皆陽萬物相見故曰出乎震齊乎巽相見乎離也夫澤天為夬夬盡成乾乾復南方先天之位然後一陰始生於五陽之下而成天風之姤陽極陰生陰生漸長火動於上澤動於下火澤為睽於是澤遇於火水火相息澤火相革然後一陰上進二陽下伏説以利貞方成乎兌而龍雷潛隱直至剝盡成坤坤復北方先天之位然後陽往復反一陽始生五陰之下而雷在地中復也夫陰終於夬夬盡成乾陽終於剝剝盡成坤則知龍雷之火發見於五陽成卦之澤天夬收藏於五陰成卦之山地剝也是則龍雷之火其純陽之象無疑矣是以東垣云以火吸水水能上騰熱天龍見水從地起不可謂寒也今先生用辛熱攝伏豈不誤哉夫引火歸源而用附桂實治真陽不足無根之火失守上炎如戴陽陰躁之症非龍雷之謂也龍雷之火肝腎之真陰不足肝腎之相火上炎水虧火旺自下衝上突如其來如焚死棄若虛陽上浮真陽不足剝床剝膚乃為陰邪所逼一同乎五陽在下一陰將盡於上之純陽一同乎五陰在下一陽將盡於上之純陰一如乾之上九亢龍有悔一如坤之上六龍戰於野陽極陰極二者天淵夫肝屬於木火本所生腎屬於水火本先天然二者之火俱賴真陰相配水潤木榮此火安其宅真陰耗損則木失所養轉柔為剛水竭木燥燎原可畏但此火真水不足相火偏勝為患不比六淫之邪天外加臨之火而用苦寒直折者又不可宗火鬱發之而用升陽散火之法治宜養陰制火如盞中添油燈焰自熄用家祕肝腎丸六味丸合滋腎丸是也古人云壯水之主以鎮陽光陽光者龍雷之火也壯水者滋陰降火之謂也今先生云治以辛熱乃是益火之源以消陰翳矣烏乎可論內經金匱中風卒中症因各別治法不同內經論中風症因不一有風入腠理開則灑然寒閉則漐然悶名曰寒熱此言風寒在表發寒熱也有風氣入胃不得外泄則為熱中此言風邪入里發熱也有人瘦則外泄而寒為寒中泣出此言人弱汗多熱氣外泄而為虛寒也有風氣與太陽俱入散於分肉之間肌肉憤䐜而有瘍此言風毒逆於肉裡而發瘡瘍也有衛氣有所凝而不行其肉有不仁此言惡癘之風傷人衛氣閉塞血脈而為麻風癩風也以上內經總敘風邪之症也又云風中五臟六腑之俞各入其戶所中則為偏風此言風邪中於各經之俞或左或右則為卒中偏風半身不遂之症也又云風氣循風府而上則為腦風目風此言頭風之症能害人目也又云飲酒中風多汗不可單衣喘息惡風口乾善渴則為漏風此言因酒熱得風故多汗惡風口乾善渴表裡皆病之症也又云入房汗出中風則為內風言入房汗出風中於內必病遺尿便澀之症也又云新浴中風頭多汗惡風苦先一日則病甚頭痛名首風此言因浴見風而成頭風頭痛之症也又云久風入中則為腸風飧泄此言外傷於風之飧泄症也又云外在腠理汗出汗泄衣身體盡痛名泄風此言因自汗成痛風之症也以上內經論外感風中也又云春甲乙傷於風嗌乾善怒憎女子名肝風夏丙丁傷於風善嚇色赤言不快名心風季夏戊己傷於風四肢不欲動微黃不嗜食名脾風秋庚辛傷於風多汗惡風時咳短氣名肺風冬壬癸傷於風面龐然浮腫有病不能正立名腎風又云食飲不下隔塞不通失衣則脹食寒則泄形瘦腹大名胃風以上內經論內傷風邪也至千金方則以內經風論發卒中條立名中風而以半身不遂為偏枯身無痛四肢不收為風痱奄忽不知人為風懿痹而不仁為風痹類中風即為當今中風之祖至仲景金匱其第一條則曰風之為病當半身不遂或但臂不遂此為痹脈微而數中風使然此發內經所中為偏風之條而以脈之微數以明不同中寒中濕也第二條言寸口脈浮而緊緊則為寒浮則為虛虛寒相搏邪在皮膚浮者血虛絡脈空虛賊邪不瀉或左或右邪氣縱緩正氣即急正氣引邪喎僻不遂邪在於絡肌膚不仁邪在於經即重不勝邪入於腑即不識人邪入於臟舌即難言口吐涎此發內經偏枯中風之症若脈微數則為風熱若脈不數而見浮緊則為風寒風寒初中皮膚失治則或左或右喎僻不遂故邪在於絡肌膚不仁邪在於經即重不勝邪入於腑即不識人邪入於臟舌即難言此申明風邪之中人經絡臟腑次序輕重之不同也第三條言寸口脈遲而緩遲則為寒緩則為虛營緩則為亡血衛緩則為中風邪氣中經則身癢而隱疹心氣不足邪氣入中則胸滿而短氣按前條以寸口之脈浮緊明風寒從外而漸入於裡此條以寸口之脈遲緩明亦是風寒從外而漸入於裡第四條言寸口脈沉而弱沉則主骨弱則主筋沉即為腎弱即為肝汗出入水中如水傷心歷節痛黃汗出故曰歷節此言脈沉主骨脈弱主筋乃是汗出入水中風而成歷節痛黃汗出之症又云少陰脈浮而弱弱則血不足浮則為風風血相搏即疼痛如掣此言脈弱血虛中風而成痛風之症又云盛人脈澀小短氣自汗出歷節疼不可屈伸此言不虛之盛人脈多實大今見澀小且見短氣自汗出歷節疼不可屈伸之症例如內經飲酒中風多汗喘息等條又兼見歷節痛不可屈伸之症也又云諸支節疼痛身體尪羸腳腫如脫頭眩短氣溫溫欲吐桂枝芍藥知母湯主之此重申上文支節疼痛之痛風症是外感宜桂枝芍藥知母湯和營衛以散表邪也又云味酸則傷筋筋傷則緩名曰泄咸則傷骨骨傷則痿名曰枯枯泄相搏名斷泄營氣不通衛不獨行營衛俱微三焦無所御四屬斷絶身體羸瘦獨足腫大黃汗出脛冷假令發熱便為歷節此言筋傷骨痿內傷枯細之症似歷節痛風然歷節痛風系外感症必發熱假令黃汗脛冷且見發熱方可為歷節痛風症方可散表故下文復申曰病歷節不可屈伸疼痛烏頭湯散邪以上金匱之論中風也由此觀之內經之論中風總敘風邪致病非專言卒中暴僕之症千金方則發卒中之偏枯風痱風懿風痹四症而補立治法仲景金匱論風即以千金方所發之半身不遂四肢不收奄忽不知人風痹之歷節疼痛而發明千金侯氏黑散治寒風引湯治熱擴充而為卒中風之準繩然止論外感風寒未曾詳言內傷諸中於是河間發火性急速暴中卒倒皆屬於火東垣發氣郁壅滯氣虛受邪丹溪發因痰而生熱因熱而生痰是則千金仲景發卒中病單主風寒但言外感故劉李朱先生發主火主氣主痰兼內傷卒中亦全之矣喻嘉言先生妙論叢生獨著中風以內經邪害空竅之下補出補虛堵塞治法此亦一偏之見恐留而不去反成其害矣夫中風寒之症有虛有實有氣血不足空腹見風風邪乘虛而入者有氣血壅滯飲酒中風風邪乘實而入者有先中風寒因而生痰生熱者有先有痰熱後召風寒者夫飢寒迫切因虛而邪得以外入人人知之也醉飽當風因實而邪得外入人所不知也是以外有六經表症則比例加減續命湯等散表內見便溺阻塞比例於三化湯等清裡邪散正虛當用補虛堵塞古人分閉脫二條以驗虛實良有以也至治風先治血此言厲風傷血血痹不行當行血祛邪非言補血即可治風非言厲風傷氣亦以血治又云中風之症理氣為先此言氣道壅閉故當先理其氣非言凡治中風該用理氣也故當細詳外感寒邪屬表者比例千金之候氏黑散加減續命湯等散表若積熱壅閉屬裡者比例風引湯三化湯等清裡若內傷之陰火上炎積熱上衝者則遵河間治法痰凝中脘攻注成疾者則丹溪節齋之法當矣故凡治病切不可執一家論例如四肢不舉與半身不遂似同實異四肢不舉有虛有實半身不遂病邪為患故四肢不舉以土不及為虛土太過為實土不及者脾胃二經氣血不足則渾身無力四肢難以舉動無麻木痛苦者也土太過則氣血壅實而四肢作楚不能舉動或痛或麻木或極冷如冰者也至半身不遂則壅滯者多虛者少豈以一人之身有半邊不虛半邊獨虛之理即有偏中風寒者亦止得外感寒邪宜用辛散表邪實非虛寒而宜溫補準繩書注半身不遂立胃脈沉澀為虛胃脈鼓大為實是矣後於心脈小堅急止注元陽不足一條不知凡病有虛實有心脈小堅急元陽不足即有心脈大搏指心火太旺書不盡言學者宜細詳補解不玩內經云心氣熱則陽氣內動發為肌痹傳為脈痿又云陽有餘陰不足為偏枯又云熱多則大筋軟短而拘小筋弛張而痿如是則半身不遂未可指為元陽不足一條立論今之用熱藥誤治偏枯筋痿以至大害禍本於此論內經金匱陰虛陽虛症因各別治法不同虛勞症有虛而無火者名虛寒虛而有火者名虛火同一言虛而虛寒虛火實分天壤治虛寒之症宜溫補忌滋陰治虛火之症宜滋陰忌溫補然虛勞之症後天有形致病者易治先天無形水火不足致病者難治治先天不足之症要分別真陽虛真陰虛真陽不足者陽虛無火也當補陽桂附八味丸鹿角膠是也真陰不足者陰虛火旺也當補陰知柏八味丸玄武膠是也補先天不足仲景但立桂附八味丸補陽未立知柏八味丸心補陰良以既立先天補火之法則先天補水之法便可一例而推錢仲陽微露機關而以八味腎氣丸減去桂附惟以六味丸平補腎水以為滋陰治法至丹溪則比例仲景之旨而以黃柏知母加入六味丸中直與桂附八味丸旗鼓相對補陽旺陰虧腎水不足得全仲景補陰制火之未備夫人身陰陽水火平等則生偏旺則病偏極則死夫陽虛則陰偏旺陰偏旺則陽愈虛陽至絶則獨陰亦隨之而絶矣陰虛則陽偏旺陽偏旺則陰愈虛陰至絶則孤陽亦隨之而絶矣然虛勞之症到底陰虛者多陽虛者少故丹溪發陽常有餘陰常不足之論而加意於滋陰大補丸主治王節齋亦有誤服參耆必死之説此言真陰不足陰虛火旺勞瘵喘咳之症非言真陽不足虛寒無火之症也若是虛寒之症則黃柏知母豈能大補服參耆豈有必死之理今有真陰不足虛火之症服滋陰則變虛寒服溫補又變虛火者此陰水既竭陽火亦虛不耐滋陰之死症也有真陽不足虛寒之症用溫補則變虛火服滋陰又變虛寒者此陽火既竭陰水亦虧不耐溫補死症也有虛寒之症服溫補之藥不變虛火到底虛寒而死者此言陰無陽獨陰不長之死症也又有虛火症用滋陰到底不變虛寒而死者此獨陽無陰孤陽不生死症也以上言先天陰陽不足水火偏勝之虛勞也至後天損傷勞傷之症則有臟腑諸條精血氣三者不同然究其實亦惟虛寒虛火兩條為要虛而無火者當用溫補虛而有火者又當補虛清熱例如氣虛無火當用四君子湯補中益氣湯若是氣虛有火立齋加梔子牡丹皮血虛無火當用四物湯當歸補血湯若是血虛有火立齋加山梔牡丹皮故凡虛勞之症既明氣虛又要細詳氣虛之有火無火既明血虛又要細詳血虛之有火無火血虛有火人人知之矣氣虛有火人都忽之也故治氣虛無火者當溫補其氣若氣虛有火則補氣藥中要加清涼若血虛無火者當補其血若血虛有火者則滋陰藥中又要清火立兩法加減則精血氣三者調補平和之理盡矣夫知柏天地煎治精虛有火者知柏歸芍丸治血虛有火者古人用地骨皮散治勞瘵骨蒸亦因氣虛有火耳即內經云陰虛生內熱治當壯水之主以制陽光非言虛火是虛寒可用溫補者東垣云虛火可補參耆之屬此言後天飲食勞倦虛陽發熱之火非言先天腎虛水少煎熬真陰之火也原病式云腎虛者水虛也水虛則火旺而煎熬真水反用溫補消津爍肺則喘嗽聲啞自汗骨蒸而死矣世人誤認溫熱為補者皆因錯解內經勞者溫之形不足者溫之以氣誤認溫之二字為熱之不知內經原文言形不足者溫之以氣但言溫潤和養以培元氣非言用溫熱之藥精不足者補之以味言用滋陰補其陰精非言葷腥厚味也至論失血之症方書云氣有生血之功補血不如補氣此言陰絡傷血內溢血虛無火之症非言陽絡傷血外溢血虛有火症夫曰陰絡傷血內溢言下泄下脫之血也陽絡傷血外溢上衝咳血吐血鼻衄牙衄之血也夫陰絡所傷之血陰分之血也血去則火亦去故血虛無火者也陽絡所傷之血陽分之血也血去則火愈旺此血虛有火者也故血脫益氣之法但可施之於陰絡所傷無火之血難施之於陽絡所傷血去火旺勞瘵骨蒸脈數內熱之人也此等關頭從來差誤惟立齋曾有陽絡傷血上衝陰絡傷血下脫之發明然後人未曾思精而熟得若進思血之陰絡陽絡但當分別有火無火亦不必拘於上溢下脫例如咳血吐血上溢之血也金匱有面色白脈沉遲內無熱陽虛不能攝血古人用血脫益氣胃藥收功者又陽明大腸有火而發腸紅便血下脫之血也然有陽絡之血古人用黃柏槐米以治者總之無論上溢下泄惟以臨症時細審血去有火者即為陽絡所傷之血但宜涼血養血血去無火者即為陰絡所傷之血仍可血脫益氣例如肝主藏血又主施泄肝經下血同是陰經又有分別肝虛不能攝血則用補肝斂肝之藥若怒動肝火血得熱而妄行下泄則用涼血清火之藥明此兩條萬無差誤論內經金匱水腫腹脹症因各別治法不同腫脹之原內經金匱辨別分悉但其中節目隱而未彰前代諸賢皆未發明後人不察往往以虛腫之法施之實脹之人實脹之法施之虛腫之症不知腫脹二病皆有虛實腫浮於外病在經絡表也脹滿於中病在腸胃里也賴許學士分明四肢腫為水但腹脹四肢不甚腫為脹發金匱腫脹分治之旨後丹溪書以腫脹二症各立一門王宇泰以水腫脹滿分立治法皆有至理但脹滿症中分明虛實寒熱諸條而水腫門未詳內經何條是虛何條是實何條是脹何條是腫又不發明內經風水與金匱風水各自一症余心未慊靈樞津液篇曰陰陽氣道不清水穀並於腸胃之中不得滲入膀胱則為水脹此總論水脹之原也水脹篇曰水始起也目窠下微腫腹乃大膚脹者腹大身盡腫皮厚鼓腫者腹脹身皆大大與膚脹等腸覃者寒氣客於腸外大如雞卵稍益大如懷子之狀月事以時下石瘕生於胞中子門閉塞月事不以時下此分論腫脹之二症也脹論曰心脹者煩心短氣肺脹者虛滿喘咳肝脹者脅下滿痛引小腹脾脹者善噦體重腎脹者腹滿引背腰髀痛胃脹者胃脘痛妨於食大腸脹者腸鳴而痛濯濯有聲小腸脹者小腹䐜脹膀胱脹者小腹滿而氣癃三焦脹者氣滿於皮膚膽脹者脅痛口苦太息此分論五臟六腑脹病各經之見症也水脹篇又曰腹脹鼓脹可刺乎曰先瀉其脹之血絡後調其經腹中論曰心腹滿旦食不能暮食名為臌脹治以雞矢醴王宇泰因見同曰鼓脹也而治法有表裡不同乃分一以氣聚之病一以氣停與血相搏之病而楨以為未然夫水脹篇曰腹脹身皆大大與膚脹等則知腫於遍身非脹於內在表不在裡故曰先泄其脹之血絡後調其經此與脹論篇所謂營氣循脈衛氣逆並循分肉為膚脹三里而瀉同一法門也腹中論但曰心腹滿旦食不能暮食則遍身未皆大在裡不在表故用雞矢以下此即內經所謂中滿者瀉之泄之則脹已是也湯液篇曰平治極衡去菀陳莝開鬼門潔淨府此因氣拒於內形施於外形不與衣相保表裡俱病故兼用發汗利小便二法也評熱論曰有病腎水者面胕龐然壅害於言虛不當刺名曰風水又曰肝腎並浮為風水夫肝火曰雷火腎火曰龍火肝腎之脈本沉今並浮則雷火動而疾風暴雨龍火動而水附波揚此二條言肝腎之相火太過泛濫其水而上浮也靈樞本輸篇曰少陰者屬腎三焦者決瀆之腑也水道出焉宣明五氣篇曰三焦病氣滿小腹尤堅又云水留即為脹此二條言肝腎之相火不及不能蒸動其水而下積也水熱篇曰腎者至陰也至陰盛水也肺者太陰也故其本在腎其末在肺皆積水也此言腎水為病上連於肺也又曰腎者胃之關也關門不利故聚水而從其類也此言腎水為病上連於胃也又曰勇而勞腎腎汗客於玄府傳為胕腫此內傷腎水外受風邪之風水也陰陽別論曰陰陽結邪多陰少陽名曰石水又曰三陰結為水又曰肝腎並沉為石水此言寒結水邪後世所名陰水之寒症也經脈篇曰胃所生病大腹水腫膝臏腫痛又曰諸胕腫皆屬於火諸水腫者濕熱相兼也此言熱結水邪後世所名陽水之熱症也至真要大論諸濕腫滿皆屬於脾又濕勝則水閉胕腫此言濕土主脾而為脾經水腫之症也又云太陰所至為胕腫又太陰所至為中滿此言濕土司天濕淫所勝之腫脹也又云太陽司天寒勝則浮此言寒淫所勝之腫脹也又云少陰司天少陽勝復少陽司天少陰勝復又云熱勝則腫此言君相二火司天熱淫所勝之腫脹也又按本神篇曰脾氣實則腹脹調經篇曰形有餘則腹脹脈要篇曰胃脈實則脹此言脾胃壅滯而為脹病之實症也師傳篇曰足太陰之公孫虛則脹太陰陽明篇曰飲食起居失節入五臟則䐜滿閉塞此言脾胃不足而為脹病之虛症也方宜論曰藏寒生滿病又胃中寒則脹滿此言臟腑陽虛而為脹病之寒症也至真要大論諸脹腹大皆屬於熱又曰腹滿大便不利取足少陰又曰脹取三陽此言臟腑鬱熱而為脹病之熱症也以上乃內經之論腫脹二症也至金匱則曰風水脈浮骨節疼痛惡風又云風水脈浮身重汗出惡風者防己黃耆湯主之又云風水惡風一身悉腫脈浮不渴續自汗出無大熱越婢湯主之細玩金匱以脈浮主表皆從太陽經主治此必是外感門另是太陽之風水非內經肝腎並浮及勇而勞腎而胕龐然內傷風水也又云皮水其脈亦浮外症胕腫不渴當發其汗夫曰發其汗直與太陽經傷寒同茲治法矣豈可以此法而治肝腎並浮勇而勞腎而胕龐然虛不當刺之內傷症乎若云肝腎不足火衰水泛則以腎氣丸攝服之可也未宜以太陽經表藥升散之若以為面胕龐然壅害於言宜發其汗也則經文明有不當刺之戒溫衣謬刺同是發汗今刺尚不可汗豈所宜乎若以勇而勞腎腎汗客於玄府而當發也則傷寒少陰症又有強發厥竭之戒夫傷寒少陰外感症尚有不應汗之戒今太陽升散之藥反為勞腎內傷症所宜乎以此論之則金匱之風水乃是太陽之外感實非內經肝腎之內傷夫仲景之書往往補內經之缺如溫瘧論內經之溫瘧一主少陰然二者皆先熱後寒金匱之論溫瘧則但熱不寒內經之論溫病曰冬不藏精春必溫病仲景之論風溫則曰太陽病發汗已身灼熱名風溫即此二症仲景之論與內經之論各自一條金匱又曰皮水四肢腫水在皮膚中聶聶動防己茯苓湯此亦與上章脈浮風水以三陽主表而立陽經治法者也又曰正水其脈沉遲外症自喘石水其脈自沉外症腹滿不喘二症同是脈沉而以自喘主肺不喘主肝腎金匱以三陰主裡而立陰經治法者也又云黃汗其脈沉遲身發熱久不愈必致癰膿又云里水者一身面目黃腫其脈沉小便不利此二條金匱以脈沉主表立從症不從脈之法也又云水之為病其脈沉小屬少陰浮者為風無水而虛脹者為氣水發其汗即已此又以脈沉脈浮以分太陽少陰表裡主治而總結上文三陽三陰水腫治法也又云心水少氣不得臥肝水腹大脅下痛肺水小便難脾水四肢苦重腎水腰痛不得溺此以內經有五臟之脹金匱復補出五臟之水也金匱又曰寸口脈沉而緊沉為水緊為寒趺陽之脈當伏今反緊本有寒疝又曰趺陽之脈當伏今反數本自有熱此以肺主通調水道胃主出納水穀而以肺胃兩家為診治也又曰腰以上腫者宜發汗腰以下腫者宜利小便此以經文面腫為風腳腫為水而以身之上下以分表裡推廣於脈沉脈浮之外也然此乃同傷寒太陽經麻黃治標五苓治本之法不然則面胕龐然虛不當刺等症腰以上雖腫而發汗在所不取肝腎並沉真陰虛涸之症腰以下雖腫利小便又所不用也以上諸條乃金匱專論水腫之一症也至於後代節齋丹溪張三錫皆以內經諸濕腫滿皆屬於脾獨指足太陰一經立論不及乎諸條者也何柏齋獨指內經肝腎石水發金匱腎氣丸為治又單主足少陰一經者也薛新甫趙養葵以補腎補脾為腫脹統治而以脾腎二經為法者也丹溪又曰濕熱氣盛則肺郁成水此言內經諸氣膹郁濕熱乘肺作腫一門也河間又云燥邪干肺絶水之源則小便不利而為腫此因內經獨缺燥淫一條千古從未發明而特補燥熱乘肺作腫一門也奈後代名賢厭煩喜簡欲將一二經絡印定治法以為易便不知此症門路甚多斷難以一二臟為總括者也但當認明何經所主何經兼見五臟中何臟有傷六腑中何腑受病三因中何因起症六脈中何部應診因病治之無不中病論內經膈氣嘔吐噎隔嘔吐症因各別治法不同方書所謂膈氣嘔吐者此即內經氣為上膈之一條也所謂噎隔嘔吐者即內經三陽結為隔之一條也仲景金匱書以生薑半夏湯治痰嘔此治膈氣方也又以甘草大黃湯治嘔吐便結者此治噎隔方也潔古家珍以嘔吐分上中下三條而以氣積寒主治東垣以辛香溫胃立法此乃膈氣嘔吐方書非噎隔嘔吐之症也河間以內經諸逆衝上諸嘔吐酸諸痿喘嘔正合三陽結熱之義發明氣鬱不利胃火上炎故嘔湧溢食不下而以三乙承氣等方為治丹溪亦謂噎隔之症火熱上炎多升少降更發內傷真陰不足津液枯涸而以四物湯中多加竹瀝荊瀝牛羊乳等為治又著局方發揮力辨和劑之非此噎隔嘔吐方書非膈氣嘔吐胃寒之症也內經明明各是一條前賢亦各開一面今因二者症名相似膈隔易訛嘔吐難別遂至輾轉差誤不知同一嘔吐也而有熱吐寒吐之分同一痰涎也而有濕痰燥痰之別考之方書同是治隔也而有膈氣噎隔二條之分按之內經同有似論也而有氣為上膈三陽結為隔之異夫膈氣嘔吐者言飲食之時並無阻礙但食後時或作脹時或氣逆時或嘔吐然亦時作時止不比噎隔之症飲食之際即有拒隔不下之患下咽之後少頃直湧而上也內經云三陽結為隔注曰三陽者大小腸膀胱也結者結熱也小腸結熱則血脈燥大腸結熱則後不通膀胱結熱則津液乾涸三陽下結食必上潮此陽火上逆推而不下也楨細玩之曰三陽則與陰經無與曰結熱則非陰寒可知夫千金諸方治反胃噎隔而用薑桂因氣滯清道用大黃芒硝石膏竹瀝蘆根生地黃汁等一派苦寒略用薑桂以為嚮導非因胃寒而用也又按方約之附余心法曰噎隔之症因火而成病源不一有因思慮過度而動脾火者有因忿怒過度而動肝火者有因飲食太過而生胃火者有因淫欲過度而起腎火者蓋火氣火上熏蒸結聚津液乾燥飲食不得流利為噎為隔久則胃脘結斷飲食雖進停滯隔間反而上逆為嘔為吐此症切不可用香燥之藥若服之必死夫證屬熱燥又用香燥之藥散氣消陰則助火而爍津矣又考王宇泰準繩書謂溢食一症或傷於酒或傷於食或胃風而吐或胃熱而吐醫者不察火里燒薑湯中煮桂沉香未已豆蔻繼之砂仁未已胡椒繼之竟將熱藥妄施素熱之人三陽既結食必上潮倉公治用下劑劉河間治嘔吐噎食遵仲景嘔吐門甘草大黃湯及三乙承氣等獨超近代但用藥之時纍纍加服慎勿頓攻若咽喉痰阻微用若酸輕輕湧出因而治下設或不行蜜鹽下道始終勾引兩道相通結散陽消飲食自順余今分別發明曰膈氣嘔吐與噎隔嘔吐各是一條膈氣嘔吐有寒有熱有痰有氣有燥有濕噎隔嘔吐則但熱無寒但燥無濕惟是三陽結熱金匱千金潔古東垣之方治膈氣嘔吐者不可治噎隔症河間丹溪之方治噎隔法也不可治胃寒膈氣仲景小半夏湯治濕痰嘔吐者也大黃甘草湯治大便燥結食已即吐者也其小柴胡湯治運氣外來少陽所勝之嘔吐也後潔古加青黛治嘔苦亦同是義東垣之丁香茱萸湯治胃寒嘔吐者也三因方麥門冬湯內用竹茹蘆根汁治燥熱漏氣嘔吐也河間用承氣等下藥治熱淫所勝膏粱積熱外感有餘之噎隔也丹溪以四物湯加羊牛乳等滋陰治津竭血燥內傷不足之噎隔也趙氏書獨主滋陰而重地黃丸此治精竭陰耗腎經真水不足內傷噎隔之法也至於東垣所論噎塞又有不同夫曰堵塞喉嚨陽氣不得出曰塞陰氣不得降曰噎夫氣逆咽喉諸經不行口開目瞪氣欲絶當用氣味俱陽之藥引胃氣以治其本楨細玩之詞中並不言及拒格飲食等語下文反言食消服之更以美食壓之夫噎塞直至口開氣絶尚能待食消更以美食壓之乎此之噎塞又言膈氣不通陰寒氣窒之症另是氣噎一門之症非言噎隔溢食格食不下三陽結熱之噎矣余讀準繩書見以膈氣嘔吐敘於噎隔嘔吐之上另立一門又以噎塞之症敘於噎隔之下亦另立一門則知古人原有分別也是以一症之中亦要分析寒熱燥濕諸條即如內經諸嘔吐酸同言熱嘔也而為濕熱之嘔諸痿喘嘔同言熱嘔也而為燥熱之嘔二熱同源濕與燥又分天壤方書以食久而吐屬寒名曰翻胃以食入即吐為熱名曰反胃不知反與翻同皆是形容嘔吐之義未可以食入即吐食久而吐以定寒熱王太僕雖有此論亦言其理之常難必其症之變也余常見暴吐多熱即久吐中亦有熱者脾胃濕熱食久不化熏蒸結聚痰涎裹住不消亦令上逆而吐如夏月人感濕熱則食不消化而吐是也是以噎隔之症千無一寒萬無一寒從古到今亦無一寒也嘔吐之症亦止寒熱各半耳余今以下噎食不下隔食嘔吐之症直以有熱無寒施治以嘔吐之症不論食久食已惟以酸不酸臭不臭分別寒熱嘔而酸餿夏熱之化主火嘔而不酸不臭冬寒之象主寒如造酒者然熱者主酸主臭冷者不腐不臭是也
