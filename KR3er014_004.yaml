參湯中氣不足者補中益氣湯有痰六君子湯參橘煎獨參湯治真元將脫氣弱神離人參補中益氣湯治氣虛不能接續人參白朮黃耆當歸炙甘草陳皮升麻柴胡六君子湯見前濕痰參橘煎人參橘紅哮喘短氣厄逆各有分別哮症經年發作難治者然亦不死喘與短氣厄逆實症易治然有死者治此四症必以四條互相參發以其病症雖別而經絡病因同在肺胃二經耳夫短氣分立虛實二條實邪短氣易治尚可祛邪虛人氣短難治氣將絶又不受補耳今家祕發金匱各條詳其治法至氣虛短氣雖立加減代赭湯方然不治者多厄逆論秦子曰厄逆者胃氣不和上衝作聲聽聲命名故曰厄也靈樞篇謂噦以草刺鼻作嚏嚏已無息而疾迎引之立已大驚之亦已按此治噦之法即今外治厄逆之道也是內經之噦即今之厄也諸家謂乾嘔為咳逆或因嘔而傷胃氣以致厄因咳而吊動胃氣以致厄方可若以乾嘔即是厄逆咳逆即是厄逆大謬矣有外感有內傷外感厄逆外感厄逆之症身發寒熱嘔逆作厄此表邪傳裡之症也內熱口渴唇焦便赤上衝作厄此積熱內沖之症也或乍發乍止或連續不已此痰火攻衝厄逆之症也外感厄逆之因外受風邪邪傳半表半裡里不受邪抑遏少陽生升之氣則上衝作厄若熱邪結里失於清理則熱氣上衝亦能致厄或水飲內停胃家痰人諸逆上衝則厄逆之症作矣外感厄逆之脈左脈弦大少陽有邪右脈沉數胃熱裡實右關虛澀胃家虛熱右脈滑大胃中痰飲滑大而數乃是痰熱外感厄逆之治若表邪入里小柴胡湯和之胃熱失下者承氣湯下之胃熱便利者瀉心湯胃熱兼虛者橘皮竹茹湯若胃中兼痰飲者橘皮半夏湯加枳桔兼熱者梔連二陳湯加葛根竹茹小柴胡湯治寒熱嘔苦厄逆不止人參柴胡黃芩廣皮半夏甘草承氣湯見食積喘門瀉心湯治火逆上衝厄逆不止川黃連半夏生薑甘草橘皮竹茹湯消痰止厄方也橘皮半夏竹茹人參生薑甘草橘皮半夏湯半夏橘皮有寒加生薑有熱加梔連梔連二陳湯家祕治痰火厄逆加葛根竹茹陳皮半夏白茯苓甘草葛根山梔川連竹茹內傷厄逆內傷厄逆之症外無表邪入里身無寒頭痛惟見厄聲發作或三四聲而即止或厄數聲之外或連續而不已者此內傷厄逆之症也內傷厄逆之因或因中氣不足或因胃氣損傷水穀入胃難以運化或膏粱積熱胃火上衝或胃寒冷飲水寒上逆或脾胃不和臟腑為病或怒動肝火肝氣怫逆或肝腎陰虧陰火上衝此皆內傷厄逆之症也內傷厄逆之脈脈見微弱中氣不足或見沉數膏粱積熱或見促結臟腑不和或見弦數肝膽有火左尺數大真陰不足內傷厄逆之治若中氣不足六君子湯痰火上衝梔連二陳湯半夏瀉心湯積熱上攻梔連平胃散加葛根竹茹胃家受寒者丁香柿蒂湯理中湯水停心下二陳湯苓桂朮甘湯食滯中宮者枳朮湯枳桔平胃散蒼朴二陳湯怒動肝火者加味柴胡湯陰血不足陰火上衝知柏四物湯陰精不足相火上衝者知柏地黃丸家祕知柏天地煎加廣皮若肝腎之精血皆不足肝腎之陰火合而上衝者家祕肝腎丸六君子湯見前章梔連二陳湯見前章半夏瀉心湯治痰火沖逆半夏川連甘草黃芩人參乾薑梔連平胃散加葛根竹茹家祕治熱積厄逆山梔川黃連蒼朮厚朴陳皮甘草葛根竹茹丁香柿蒂湯治胃寒厄逆脈遲者丁香柿蒂人參生薑二陳湯見濕痰門苓桂朮甘湯見痰飲門枳朮湯見食積門枳朮平胃散即平胃散加枳實桔梗蒼朴二陳湯即平胃散加蒼朮厚朴加味柴胡湯治肝膽之火上衝厄逆柴胡黃芩陳皮甘草山梔丹皮知柏四物湯即四物湯加黃柏知母知柏地黃丸見前家祕天地煎黃柏知母天門冬地黃廣皮家祕肝腎丸天門冬地黃當歸白芍藥黃柏知母附諸賢論東垣云厄是陰火上衝古方悉以胃弱言之而不及火未盡病情人之陰氣依胃為養胃土傷損則木氣乘之陰為火所乘不得內守木挾相火直衝清道而上言胃弱者陰氣弱也然亦有實者不可不知脾與胃一陰一陽也二者不諧則逆右腎陰中有陽也在下相凌亦逆左腎主水性不上逆必右腎相火炎上挾其衝任如以火吸水則水上騰熱天龍現而水從地起不可盡謂之寒也肝木之風從少陽之火沖剋亦必從火為治劉宗厚曰厄逆一症有寒有火有實有虛有熱痰有水飲不可專作寒若平人飲食太速或飲水喜笑或膏粱積熱或痰火水飲或動五志厥陽之火皆能致厄皆是實症夫火性炎上今其症乃自下衝上者非火而何準繩云治此症須分寒熱如因汗吐下後誤服寒涼過多此虛中之寒也當溫補之理中湯丁香柿蒂湯如脾胃陰虛火逆上衝此虛中之熱也當以清補之參朮湯下大補丸若夫傷寒失下痰飲停蓄暴怒氣逆膏粱積熱皆實症也皆當隨其邪之所在湧泄清利可也若胃中虛而有熱橘皮竹茹湯人參竹茹湯戴人曰厄逆因痰與熱胃火者極多火厄大急乍厄乍已脈數有力寒者連綿不已脈沉而逆外無熱候二便清利痰者呼吸時有痰聲六脈滑大虛者厄而無力厄聲不急連厄綿綿虛症外現張三錫曰有痰火有氣虛有鬱氣有陰火有死血有食滯痰火者脈洪滑有力症兼噁心口乾梔連二陳湯氣虛者脈見虛軟右寸口虛無力四肢倦怠或久病過服寒滑克削六君子湯加減治之鬱氣者脈多沉結胸次氣脹四七湯香砂二陳湯越鞠丸煎服陰火者兩尺洪大而數或沉細而數厄逆面赤此陰虛伏火四物坎離丸煎服死血者脈見芤澀至晚則厄食物則厄此飽後用力血入氣分桃仁紅花湯桃仁承氣湯食滯者脈多沉滑有力外症噯氣飽悶此食滯中脘寒涼停積不化宜銷化丸煎服嘔吐論秦子曰嘔以聲響名吐以吐物言有聲無物曰嘔有物無聲曰吐有聲有物曰嘔吐皆陽明胃家所主有外感有內傷外感嘔吐風氣嘔吐風氣嘔吐之症偶遇風冷即發嘔吐