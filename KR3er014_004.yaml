body:
  text: 卷二咳嗽總論秦子曰內經云五臟六腑皆令人嗽非獨肺也其詞似撇開肺經然其義實言肺經獨多而他經亦有耳河間以咳謂無痰而有聲肺氣傷而音不清嗽謂無聲而有痰脾濕動而為痰此指有痰之嗽主脾濕無痰之咳主肺傷合內經不獨在肺之句而發脾臟之令人嗽也楨細玩之肺受外感六氣所傷內受濕熱燥火煎熬則肺經痰嗽亦多急宜清肺不可一見痰嗽竟治脾濕有傷肺燥也外感咳嗽傷風咳嗽傷風咳嗽之症憎寒壯熱頭痛眼眶痛自汗惡風鼻塞涕流痰結肺管咳嗽不已此風傷肺氣即痰飲門風痰咳嗽今人名曰傷風症也傷風咳嗽之因肺家伏熱外冒風邪束於肌表肺熱不得發泄則肺風痰嗽之症作矣傷風咳嗽之脈脈多浮大浮緊風寒浮數風熱浮緩風濕浮滑風痰傷風咳嗽之治脈浮緊惡寒發熱羌活湯頭痛眼眶痛乾葛湯脈浮數自汗身熱加味瀉白散表邪盡散痰結肺管咳嗽不止者蘇子杏仁湯肺中伏熱家祕瀉白散羌活湯羌活防風荊芥桔梗甘草柴胡前胡葛根湯乾葛柴胡防風荊芥桔梗甘草加味瀉白散桑白皮地骨皮甘草防風荊芥桔梗蘇子杏仁湯蘇子杏仁桔梗枳殼防風半夏栝蔞霜家祕瀉白散桑白皮地骨皮甘草黃芩石膏傷寒咳嗽傷寒咳嗽之症頭痛身痛惡寒發熱無汗喘咳此寒邪咳嗽之症也傷寒咳嗽之因時令寒邪外襲皮毛內入於肺不得外伸鬱而發熱則肺內生痰惡寒無汗頭痛喘咳而為傷寒咳嗽之症矣傷寒咳嗽之脈若見浮緊里未鬱熱若見浮洪肺已鬱熱緊而帶數以寒包熱傷寒咳嗽之治脈浮緊寒傷肺未鬱熱者冬月麻黃杏仁湯若三時惡寒身熱咳嗽前方加石膏半夏寒傷肺鬱而變熱者羌防瀉白散三時寒傷肺者通用此方麻黃杏仁湯麻黃杏仁桔梗甘草肺熱加石膏頭痛身痛加羌防羌防瀉白散桑白皮地骨皮甘草羌活柴胡葛根防風有痰加栝蔞半夏有熱加黃芩石膏傷濕咳嗽傷濕咳嗽之症身重身痛或發熱有汗或面目浮腫或小便不利骨節煩疼氣促咳嗽此傷濕咳嗽之症也傷濕咳嗽之因或時行雨濕或坐臥濕所或濕衣所侵肺主皮毛皮毛受濕則身重鼻塞之症作矣傷濕咳嗽之脈脈多濡軟浮緩風濕沉緊寒濕沉數濕熱沉澀濕鬱傷濕咳嗽之治帶表症防風勝濕湯濕熱壅肺神術瀉肺湯汗後兼利小便通苓散古人有清肺則小便自利此則利小便而肺自清也防風勝濕湯家祕治風濕咳嗽防風荊芥葛根白芷桔梗甘草神術瀉肺湯家祕治傷濕咳嗽蒼朮石膏桑皮地骨皮桔梗甘草通苓散利濕清肺之方麥門冬淡竹葉車前草赤茯苓木通傷暑咳嗽傷暑咳嗽之症身熱引飲內熱煩躁外反惡寒或身痛口渴咳嗽身倦此暑傷肺氣之症也傷暑咳嗽之因時值夏秋或氣虛身弱觸冒暑濕或熱甚於中偶感時行內外夾攻蒸釀胸胃之間上熏於肺則暑濕咳嗽作矣傷暑咳嗽之脈經曰脈虛身熱得之傷暑又云傷暑之脈濡軟者多大抵右寸口脈或虛或數傷暑咳嗽之治身熱引飲內熱煩躁者石膏知母湯身痛口渴外反惡寒十味香薷飲瀉白益元散外冒暑邪內傷積熱者涼膈散脈虛身熱氣虛身乏之人清暑益氣湯石膏知母湯家祕治暑熱傷肺石膏知母桔梗桑白皮地骨皮甘草十味香薷飲香薷厚朴白扁豆陳皮白茯苓蒼朮黃柏升麻葛根桑白皮地骨皮甘草瀉白益元散桑白皮地骨皮甘草水煎調益元散服涼膈散山梔黃芩川黃連大黃桔梗天花粉連翹薄荷玄參甘草清暑益氣湯治氣虛傷暑補中救肺之方黃耆蒼朮升麻人參白朮陳皮神麯澤瀉黃柏葛根當歸麥冬傷燥咳嗽傷燥咳嗽之症口渴唇焦煩熱引飲吐痰不出或帶血縷二便赤帶喘急咳嗽此傷燥咳嗽之症也傷燥咳嗽之因天行燥烈燥從火化肺被燥傷則必咳嗽傷燥咳嗽之脈多見躁疾或見數大或見沉數或見浮急傷燥咳嗽之治石膏瀉白散清燥救肺湯人參白虎湯口渴加門冬飲子石膏瀉白散家祕治燥火傷肺喘咳之症石膏知母桑白皮地骨皮甘草痰多加貝母栝蔞清燥救肺湯桑葉石膏人參麥門冬枇杷葉杏仁真阿膠甘草痰多加川貝母陰精虛加地黃熱甚加羚羊角人參白虎湯治口渴唇焦煩熱引飲脈見沉數人參石膏知母甘草口渴加葛根天花粉門冬飲子天門冬麥門冬桑白皮枳殼桔梗荊芥甘草痰多加貝母大便燥結加大黃傷熱咳嗽傷熱咳嗽之症咽喉干痛面赤潮熱夜臥不寧吐痰黃濁或帶血腥臭煩躁喘咳每咳自汗此即痰飲門熱痰嗽傷熱咳嗽之因濕熱行令熱傷肺氣或時令應寒而反溫應涼而反熱皆能令人咳嗽也傷熱咳嗽之脈右脈洪數洪為肺火數為裡熱洪數而滑肺熱痰結傷熱咳嗽之治寸口脈大家祕瀉白散面赤潮熱柴胡飲子梔連清肺飲脈數而實吐痰黃濁涼膈散加川貝母煩躁喘嗽帶血腥臭犀角地黃湯加山梔黃芩家祕瀉白散桑白皮地骨皮甘草川連黃芩石膏柴胡飲子柴胡黃芩人參大黃廣皮甘草當歸白芍藥梔連清肺飲山梔川連桔梗甘草杏仁天花粉黃芩薄荷涼膈散見傷暑嗽門犀角地黃湯加山梔黃芩犀角生地牡丹皮白芍藥山梔黃芩內傷咳嗽肺經咳嗽肺經咳嗽之症氣急喘咳痛引缺盆右脅下灑淅惡寒或右臂筋吊痛痰咯難出或吐白涎口燥聲嘶此肺咳之症也肺咳不已大腸受之大腸咳狀則遺矢糞水也肺經咳嗽之因或真陰不足勞傷火動或肺脾素燥不慎辛熱炙煿或惱怒思慮憂愁動火三者皆能傷其肺金乃成肺經咳嗽也肺經咳嗽之脈右寸洪滑肺有實痰或見微弱肺氣不足或見滑數肺有熱痰或見沉數鬱火內伏肺經咳嗽之治右寸洪數瀉白一物湯清肺飲脈見遲細人參補肺飲人參生脈散瓊玉膏肺有熱痰青黛海石丸節齊化痰丸久嗽肺虛百花膏主之瀉白一物湯即瀉白散加黃芩黃芩一物湯治火傷肺之血而嗽者瀉白散治火傷肺之氣而嗽者氣血俱傷二方合用清肺飲桔梗甘草杏仁天花粉黃芩山梔薄荷連翹人參補肺飲人參麥冬五味子天冬薏苡黃耆百合炙甘草人參生脈散人參麥門冬北五味三味同煎瓊玉膏生地白茯苓人參青黛海石丸青黛海石栝蔞仁川貝母節齊化痰丸栝蔞霜天冬海石青黛連翹桔梗百花膏款冬花百合等分為末煎膏蜜收脾經咳嗽脾經咳嗽之症咳而右肋下隱隱作痛痛引心脾神衰嗜臥面色痿黃腹脹黃腫身重不可以動動則咳劇此脾經咳嗽之症脾咳不已則胃受之胃咳之狀咳而嘔甚則長蟲出脾經咳嗽之因或膏粱積熱濕熱蒸釀脾胃之火上熏於肺或土不生金母虛子病則為脾虛脾損二者乃脾經咳嗽之因也脾經咳嗽之脈右寸洪數肺家有火右關弦急積熱腸胃寸口虛大肺氣不足右關微弱中氣衰弱脾經咳嗽之治肺有熱者家祕瀉白散脾胃熱積梔連二陳湯肺氣不足生脈散土不生金四君子湯有痰六君子湯虛熱加丹皮山梔熱甚加梔連家祕瀉白散桑白皮地骨皮甘草加白芍川連若胃火加石膏肝火加黃芩心火加黃連腎火加黃柏梔連二陳湯見後痰症生脈散見前章肺咳四君子湯人參白朮茯苓甘草加半夏陳皮名六君子湯虛中有熱加丹皮山梔熱甚加梔連心經咳嗽心經咳嗽之症咳則心痛喉中介介如梗狀甚則舌腫咽痛此心咳之症也心咳不已則小腸受之小腸咳狀咳而失氣氣與咳俱失心經咳嗽之因焦心勞思心火妄動金被火囚肺葉焦滿為喘為咳或心血不足心氣虧損心神不安上為喘咳二者乃心經咳嗽也心經咳嗽之脈左寸洪數心經有熱右寸洪數肺家有熱左寸細數心經虛火右寸細數肺經虛熱心經咳嗽之治左寸洪數導赤各半湯硃砂安神丸右寸洪數家祕瀉白散右寸虛數人參平肺散導赤各半湯生地木通甘草黃連麥冬山梔赤茯苓車前子加燈心硃砂安神丸硃砂黃連甘草生地麥冬當歸遠志白茯苓家祕瀉白散桑白皮地骨皮甘草石膏黃芩川連人參平肺散人參桑白皮甘草地骨皮揀冬橘紅川貝母肝經咳嗽肝經咳嗽之症咳則兩脅下痛痛引小腹或寒熱往來面青色筋急此肝經咳嗽肝咳不已則膽受之膽咳之狀咳嘔膽汁而口為之苦肝經咳嗽之因木氣怫鬱肝火時動火盛刑金則為喘咳或肝經少血肝氣虧損則木燥火生亦為喘咳二者肝經咳嗽之因也肝經咳嗽之脈左關弦數或見弦急肝經有熱或見弦細或見弦澀肝經少血肝經咳嗽之治左關弦數瀉青各半湯寒熱往來宜柴胡飲子左關弦細加味逍遙散瀉青各半湯家祕治木火刑金黃芩山梔桑白皮地骨皮甘草柴胡飲子柴胡黃芩陳皮甘草人參大黃當歸白芍藥加味逍遙散白芍藥當歸白茯苓甘草柴胡白朮廣皮丹皮山梔腎經咳嗽腎經咳嗽之症咳則腰痛五心煩熱湧泉熱陰火上炎時見乾咳痰味帶咸此腎經咳嗽也腎咳不已則膀胱受之膀胱咳狀咳則遺溺腎經咳嗽之因有勞傷肺氣則金不生水有色欲過度則真陰涸竭水虛火旺腎火刑金有真陽不足水泛為痰則腎經咳嗽之症作矣腎經咳嗽之脈左尺滑數真水不足或見沉實腎經有火右尺虛軟腎氣不足或反浮大真陽外越腎經咳嗽之治勞傷肺氣金不生水生脈散合四君子湯左尺滑數知柏天地煎真陰涸竭人參固本丸三才丹右尺虛軟生脈散真陽不足八味丸主之生脈散四君子湯二方俱見肺嗽人參固本丸人參天門冬麥門冬生地三才封髓丹天冬人參熟地知柏天地煎天門冬地黃知母黃柏八味丸即六味丸加附子肉桂氣虛咳嗽氣虛咳嗽之症面黃肌瘦氣怯神離咳嗽吐痰痰色清稀飲食減少此氣虛咳嗽之症也氣虛咳嗽之因或勞役過度肺氣有傷或飲食勞倦中氣有損脾傷則土不生金肺傷則氣怯喘嗽此子母俱病而成氣虛咳嗽之症也氣虛咳嗽之脈右寸脈微肺氣有損右關脈濡中氣不足寸關皆澀脾肺俱虛浮軟者生數實不得臥者死上氣喘急面腫肩息脈浮大者死氣虛咳嗽之治土旺則金生宜四君子湯參朮膏損其肺者益其氣補中益氣湯潤肺即是補肺瓊玉膏生脈散久嗽不止百花丸四君子湯見脾經咳嗽門參朮膏人參白朮補中益氣湯見前氣虛短氣門瓊玉膏見肺經嗽門生脈散見前肺嗽百花丸款冬花百合等分蒸曬研極細煉蜜為丸每夜噙化一丸血虛咳嗽血虛咳嗽之症盜汗自汗潮熱骨蒸下午嗽多形體黑瘦五心煩熱此血虛咳嗽之症也血虛咳嗽之因形役陽亢陰血虧損血虛則內熱煎熬真陰陰火日旺肺金被克而咳嗽之症作矣血虛咳嗽之脈左寸細數肺陰有損中氣弱虛氣不生血左脈弦數肝火煎熬兩尺細數腎虛水竭血虛咳嗽之治血虛補血海藏四物湯歸芍地黃湯天地煎虛寒之人血脫益氣四君子湯合生脈散虛熱之人肝腎陰虛龍雷之火刑肺而嗽者宜斂陰降火家祕肝腎丸合黃芩瀉白散海藏四物湯熟地白芍藥牡丹皮當歸歸芍地黃湯生地歸身白芍藥枸杞丹皮知母人參甘草地骨皮天地煎天門冬熟地二味同煎四君子湯見前脾咳生脈散見前肺嗽家祕肝腎丸血虛下午嗽古云斂而降之非言酸斂收斂乃滋陰降火斂而下降也當歸白芍藥天冬地黃知母黃柏黃芩瀉白散見前肺嗽條食積咳嗽食積咳嗽之症每至五更嗽發嗽至清晨或吐痰味甜胸前飽悶此積痰咳嗽之症食積咳嗽之因食滯中焦不能運化成痰成飲每至五更痰火上升則咳嗽之症作矣食積咳嗽之脈氣口洪大或見沉滑或見沉數或見沉實食積咳嗽之治脈沉滑胸滿悶者二陳平胃散三子養親湯若沉數而滑加梔連肺火上升咳嗽汗出石膏瀉白散加枳桔二陳平胃散熟半夏白茯苓廣皮甘草熟蒼朮厚朴三子養親湯萊蔔子山楂子紫蘇子石膏瀉白散桑白皮地骨皮甘草枳殼桔梗石膏積熱咳嗽積熱咳嗽之症面赤煩躁嗽則多汗夜臥不寧清晨嗽多小便赤澀此積熱咳嗽之症也積熱咳嗽之因膏粱積熱酒客浩飲熱氣聚於中焦陽明受熱肺被火刑則積熱咳嗽作矣積熱咳嗽之脈右關長大或見浮洪或見洪數胃脈上朝肺受火熱積熱咳嗽之治家祕清胃湯以清中焦咳嗽不已家祕瀉白散熱結大腸枳殼黃連湯家祕清胃湯升麻生地川連山梔甘草乾葛石膏家祕瀉白散見前傷風嗽枳殼黃連湯枳殼川連甘草積熱咳嗽得食暫停少頃復發嗽而多汗梔連保和散閣家祕瀉白散以多汗而定內有積熱不獨咳嗽一症以多汗而以清熱主治亦不獨治咳嗽一症例如胃痛胸脅痛痛即汗出亦為火痛即身表發熱若見多汗亦用清熱主治如前外感咳嗽條身熱身痛咳嗽本表症也若一見多汗口渴而在夏秋不作傷寒表症而治又作傷暑主治同一咳嗽發熱惡寒身痛而應發表應清裡下手分別惟以有汗無汗渴而引飲二症上端的又如夏秋熱病若身熱身痛無汗發熱此為內伏暑熱外冒表邪當服羌獨敗毒散或羌活沖和湯若見咳嗽兼用荊防瀉白散先散表邪若身熱多汗口渴引飲即用白虎湯清裡兼咳嗽者家祕瀉白散清燥湯清裡附諸賢論王節齊曰傷風咳嗽宜辛涼解表如桑白皮防風荊芥薄荷傷熱咳嗽宜清涼降火如黃芩桑白皮知母門冬傷濕熱咳嗽宜利濕熱流濕潤燥如桑皮石膏黃柏蒼朮滑石甘草傷燥咳嗽宜清金降火潤肺清燥如石膏知母桑皮麥冬傷寒咳嗽宜辛散解表如麻黃杏子湯小青龍越婢湯等若肺素有熱者仍加山梔黃芩石膏知母又云咳嗽皆主於肺蓋肺主氣而作聲者也治法須分新久虛實新冒風寒則散之火熱則清之濕熱則滲泄之燥熱則清潤之久病宜分虛實若氣虛則補氣血虛則補血精虛則補精若久而有郁又宜開鬱為主又云因咳而有痰咳為重主治在肺此言素無痰候今見咳嗽後乃有痰而嗽也因痰而致嗽者痰為重主治在脾此素有痰涎今漸加咳嗽喘急之候即濕痰痰飲之嗽也若食積成痰頑痰膠固痰氣上升以致咳嗽只治其痰消其積而咳自止不必治肺又云凡酒色過度勞傷肺腎真陰而咳嗽者不可服參耆恐陰虛火旺反助陽氣而陰益消也先以壯水之藥如六味之類補其真陰使水升火降隨用參耆補肺之藥以助腎之母使金水相生則陰自生而陽火退世之用參耆者不知先壯水以鎮火而遽投參耆以補陽反使陽火愈旺而金水愈竭矣直指云感風嗽者鼻塞聲重傷冷嗽者悽悽清怯寒傷熱嗽者煩熱焦心熱鬱於內外覆冒寒者惡寒煩熱聲啞感濕嗽者身重鼻塞瘀血嗽者脅肋刺痛胸膈腥悶水停嗽者心下怔忡如肺脈浮緊者為外感風寒以發散取汗如肺脈沉實而數為內傷肺熱以清利之肺脈濡散者為肺虛以補之肺主皮毛肺氣虛則腠理不密風邪易入法先當解表後乃補虛肺氣實則腠理密而邪不入矣肺有火則腠理不閉風邪易入當解表清火肺火清則腠理閉而邪不入矣若肺虛咳嗽而用清肺之藥則腠理愈加不密而感邪愈易肺火而用補肺之藥則腠理愈不閉而感邪愈甚夏月喘急而嗽面赤潮熱其脈大者黃連解毒湯煩躁而咳梔子湯此實火之治也咳唾有血者麥冬湯吞六味丸以制陽火此虛火之治也張三錫曰百病惟咳嗽難治一咳而痰便出者名滑痰屬脾濕宜南星與半夏之類燥之滋潤之味所當忌也如連咳數聲痰不出者名燥痰屬肺燥宜門冬知母杏仁之類以潤之香燥之藥亦當忌也丹溪云上半日嗽多胃中有火午後嗽多陰虛火旺黃昏嗽多陰火上浮宜斂而降之又曰五更嗽者胃中有痰火伏積於內至此時火氣生養之時上潮於肺也宜知母石膏地骨皮青黛海石治之午前嗽者氣分有熱瀉白散加知母石膏午後嗽者血分有熱宜養陰退熱加減四物湯吞六味丸合滋腎丸又云乾咳嗽乃痰鬱火邪在中宜先以甘桔湯開之隨加補陰之味咳嗽聲啞寒包熱不宜驟用寒涼宜以辛散之以甘潤之楨按黃昏嗽火氣上浮肺中宜斂而降之一法此斂字言陰虛火氣上升當養陰滋陰斂其火氣下降即滋陰降火之法今人誤認酸寒收斂大謬矣噎膈論秦子曰夫噎者飲食在喉不得下咽噎住喉間隔者飲食稍能入咽頃刻上逆吐出此火熱煎熬血液衰耗胃脘乾枯其干在上近喉之間水飲可入食物不進名之曰噎其干在下在胃之中食雖暫下才將入胃不能下行反而吐出名之曰隔噎隔之症純熱無寒但有外感內傷之分再無寒熱之異內經故曰三陽結而為隔不比膈氣嘔吐門有寒有熱者也若腸結於下胃反於上更為甚矣外感噎隔外感噎隔之症向無飲食阻隔忽爾內熱唇焦飲食不得下咽下咽噎住不通或下咽而復吐出煩熱引飲此外感噎隔之症也外感噎隔之因偶逢赫曦之令或遠行勞倦時當大熱燥火爍人津液內涸而噎隔之症作矣外感噎隔之脈右脈洪數熱在氣左脈洪數熱在血兩手洪數氣血皆熱兩手細數血燥津竭外感噎隔之治宜清熱生津三因麥門冬湯人參白虎湯或沖竹瀝蘆根汁大便閉結者三一承氣湯選用血不足者四順飲便結有寒熱者大柴胡湯元氣弱者柴胡飲子三因麥冬湯通治津竭液干嘔吐隔食麥冬知母石膏枇杷葉葛根山梔黃芩陳皮甘草竹茹人參白虎湯知母石膏粳米人參甘草天花粉三一承氣湯治便閉氣壯者四順飲治便閉血枯者當歸白芍藥大黃甘草大柴胡湯治便閉寒熱氣壯者柴胡黃芩廣皮半夏甘草大黃柴胡飲子治便閉寒熱氣弱者柴胡黃芩廣皮半夏甘草人參大黃內傷噎隔內傷噎隔之症飲食之間漸覺難下或下咽稍急即噎胸前如此旬月日甚一日漸至每食必噎只食稀粥不食乾糧此內傷噎隔之症也內傷噎隔之因平素憂愁鬱結五志之火皆動日夜煎熬津液乾涸或膏粱厚味辛辣炙煿恣意不謹積熱消陰二者皆成噎隔反胃之因也內傷噎隔之脈多見沉澀左寸沉澀心血枯左關沉澀肝血竭尺脈沉澀腎水虛右關沉澀脾陰絶胃脈沉澀胃汁干胃汁干兮腸亦結內傷噎隔之治宜生津養胃二母二冬湯虛者生脈散加養血之藥若凝窒已久痰涎聚結於胃脘不可用凝滯之藥先用清痰清火開豁化痰金匱麥門冬湯沖竹瀝薑汁蘆根汁以開通中脘結痰隨以養陰生津治本若大腸已結者名結腸宜以四順飲緩緩微利幾次如大腸結硬略加玄明粉津液乾枯承氣不可用若膏粱積熱本元旺者承氣湯或可選用二母二冬湯知母貝母麥門冬天門冬家祕痰多暫加青黛海石腸枯暫加當歸芍藥氣凝痰滯暫加半夏香附以行本方之滯此不得已暫服二三劑可也生脈散見前肺嗽四順飲見前肺嗽金匱麥門冬湯麥門冬半夏人參粳米甘草橘紅承氣湯枳殼厚朴大黃甘草楨按膈氣嘔吐噎隔嘔吐同一嘔吐也而其原不同其治天壤夫方書所謂膈氣嘔吐者即內經氣為上膈之一條也所謂噎隔嘔吐者即內經三陽結為隔之一條也膈氣嘔吐有寒有熱者也噎隔嘔吐有熱無寒者也噎隔外感者易治以其暫得燥熱不過清之內傷者難治以其陰精內竭一時難復然尚有輕重初病者痰涎未起可用滋陰久病者必強其飲食以致吐干胃汁若誤投燥熱燥極反見濕象必至痰涎上湧熱極反見寒象必至冷氣上衝如是則滋陰凝滯不服詳論首卷總論中細玩則得之矣第一要飲食得法一起忌食乾糧辛辣竟吃酥粥牛乳及淡腐漿等小口慢咽漸潤胃管開通然後咽下若吃葷腥但可慢火煮爛竟吃濃汁切不可吃有形硬塊治以養陰滋血湯等夫醫者止論用藥誰知治隔症反在飲食得法例如飲食傷胃必要飲食小心勞動損傷必要咽津靜養方可挽回也吐血咳血總論秦子曰胃中嘔出名吐血肺中嗽出名咳血吐血陽明胃家症咳血太陰肺家症丹溪以嘔血嗽血皆從口中吐出總名之曰吐血故嘔咳不分肺胃罔別余今分別咽中胃管嘔出名吐血喉中肺管嗽出名咳血則經絡分明治法不混外感吐血外感吐血之症發熱煩躁面赤目赤口乾唇紅夜不得臥從口吐出純血無痰此外感吐血之症也外感吐血之因內有積熱諸經火盛外有風寒束其肌表血絡熱甚不得外越妄行上衝從口嘔出故外感吐血責之邪熱妄行外感吐血之脈脈必洪大或見浮緊表邪未解或見沉數裡熱熾盛失血太多若見芤澀洪大和緩易治沉細弦急難醫外感吐血之治若身痛發熱表邪未解此太陽邪熱攻衝脈浮大而數者羌活沖和湯加減治之佐以清胃之藥若表邪已散身仍發熱目痛不眠此陽明經邪熱脈長而數者乾葛石膏湯佐以涼血之藥或用犀角地黃丸耳聾寒熱兼用小柴胡湯脈芤而澀者歸芍地黃湯血紫胸痛紅花桃仁湯外感門衄血乃是表邪今吐血門乃是熱邪在裡故不用麻桂湯羌活沖和湯治太陽失汗表邪未解者羌活黃芩生地荊芥川芎葛根甘草葛根石膏湯治陽明熱盛吐血不止者葛根石膏山梔黃芩荊芥丹皮生地熱甚者加川連大便結加大黃犀角地黃湯生地犀角丹皮山梔白芍藥荊芥小柴胡湯治吐血兼少陽經見證柴胡黃芩廣皮甘草歸芍地黃湯當歸白芍藥生地丹皮茯苓山藥山茱萸澤瀉紅花桃仁湯紅花桃仁丹皮楂肉赤芍藥澤蘭歸尾紅曲大便結加酒煮大黃內傷吐血內傷吐血之症身無表邪脈不浮大起居如故飲食自若時而嘔吐純血一連數口此胃家吐血之症若傾盆大出者則肝家吐血也內傷吐血之因或積熱傷血血熱妄行或失飢傷飽胃氣傷損或浩飲醉飽熱聚於中或鹽醋辛辣縱口不忌或惱怒叫喊損傷膈膜則血從口出而內傷吐血之症作矣內傷吐血之脈兩關獨盛或見洪大或見浮數右關獨大胃家有傷左關獨大肝家之損和緩沉小者易治弦急細數者難治內傷吐血之治胃家之血犀角地黃湯加乾葛知母積熱甚者加黃連石膏大便結加酒蒸大黃即釜底抽薪之法酒客致咳必至吐血者乾葛石膏湯合瀉白散此胃火上衝傷肺之條若傾盆大出肝經血犀角地黃湯加黃芩玄武膠此清肝攝血之法面色白脈沉遲內無熱陽虛不能攝血歸脾湯主之此即血脫益氣之條胸前痛血色紫而成塊紅花桃仁湯失飢傷飽調理胃氣飲食得法則胃氣自和而病自愈犀角地黃湯犀角生地丹皮山梔白芍藥荊芥黃芩玄武膠乾葛石膏湯合瀉白散乾葛石膏桑白皮地骨皮甘草歸脾湯當歸白朮人參甘草白茯苓木香遠志黃耆龍眼肉酸棗仁紅花桃仁湯紅花桃仁丹皮紅曲楂肉赤芍藥澤蘭歸尾嗽血論秦子曰咳血即嗽血外感咳血之症乃是邪壅於肺擇其何邪而施治則愈矣故丹溪曰壅於肺者易治不過散之清之而已不比內傷門損於胃者之難治也外感嗽血外感嗽血之症身發寒熱喘促氣逆咳嗽不止嗽痰帶血甚則吊動胃氣嘔吐痰涎飲食齊出此外感嗽血之症也外感嗽血之因有肺胃伏火失於清理風寒外束肺熱內郁肺主皮毛不得發泄上衝於喉又有時令燥熱傷其肺氣清化之令不行相傅之官怫逆二者皆令咳嗽吐血者也外感嗽血之脈左脈浮大表邪未散右寸數大火邪傷肺或見沉數肺中伏火若見躁疾燥火刑金外感嗽血之治表邪外束身發寒熱咳嗽帶血者瀉白散加荊防柴葛熱邪伏內者瀉白散加乾葛石膏燥火傷肺清燥救肺湯主之瀉白散桑皮地骨皮甘草荊芥穗防風柴胡葛根又瀉白散桑白皮地骨皮甘草乾葛石膏清燥救肺湯桑葉石膏甘草人參桑白皮阿膠麥冬杏仁枇杷葉知母地骨皮內傷嗽血內傷嗽血之症身無表邪咳嗽吐血金匱有三大法門若先咳嗽吐痰後咳嗽吐血者此是肺胃積熱痰火上衝之症也若先咳吐純血後乃咳嗽吐痰者此是陰虛陽旺勞瘵骨蒸之症也若面色白脈沉遲內無熱者此是土不生金陽虛不能收攝之症也內傷嗽血之因有膏粱積熱痰火伏於肺胃之間久嗽失治土中之火刑金即金匱所云酒客致咳必致吐血之一條也有房勞精竭腎火刑金有思慮傷脾脾火消陰有鬱怒傷肝肝火怫鬱有用心太過心火妄動即金匱咳逆上氣脈數有熱之一條也有陽虛不足血虛氣弱土不生金即金匱病人面色白內無熱脈沉遲之一條也內傷嗽血之脈右手洪數膏粱積熱若見滑大痰火內結左尺躁疾房勞精竭右關細數脾陰消竭左關弦數肝家鬱結左寸躁疾心火妄動六脈沉遲陽虛之別內傷嗽血之治膏粱積熱熱傷肺金之氣瀉白散合乾葛石膏湯熱傷肺金之血黃芩一物湯胃火上衝清胃湯化痰丸房勞精竭腎火刑金先用犀角地黃湯後用歸芍天地煎三才丹脾陽不足土不生金者加味歸脾湯脾陰不足土中之火刑金加味戊己湯怒動肝火木火刑金者柴胡飲子肝血不足者加味補肝散心火妄動者導赤各半湯心血不足者天王補心丹腎火不足陽虛不能攝血者八味腎氣丸瀉白散治火傷肺氣咳嗽痰血桑白皮地骨皮甘草黃芩一物湯治火傷肺血咳嗽痰血黃芩清胃湯治胃火上衝升麻黃連生地山梔甘草乾葛石膏化痰丸天門冬栝蔞霜連翹香附黃芩海石青黛桔梗犀角地黃湯涼血止血之方犀角生地丹皮白芍藥黃芩荊芥山梔歸芍天地煎天門冬生地當歸白芍藥丹皮山梔玄武膠收厚膏服三才丹天門冬生地人參家祕肝腎丸天門冬地黃白芍藥當歸黃柏知母上為細末玄武膠為丸加味歸脾湯當歸白茯神黃耆白朮木香人參甘草龍眼肉遠志酸棗仁加味戊己湯白芍甘草黃柏知母柴胡飲子治怒動肝火木火上衝柴胡黃芩廣皮甘草人參當歸大黃白芍藥加味補肝散治肝血虛火旺當歸生地白芍川芎廣皮甘草柴胡山梔黃芩導赤各半湯治心火妄動上刑肺金生地木通甘草川黃連麥門冬犀角天王補心丹人參玄參丹參五味子柏子仁當歸遠志桔梗生地天門冬麥門冬甘草黃連酸棗仁白茯神腎氣丸治腎陽不足真火衰者生地山藥澤瀉丹皮山萸肉白茯苓附子肉桂秦子曰先嗽痰後見血皆是胸膈痰盛此膏粱積熱實火攻衝先傷肺經之氣煅煉而咳白痰日久不愈因傷肺經之血逼迫而嗽血者也治宜瀉白散加石膏知母先清肺經氣分之火以治其本後用犀角地黃湯黃芩一物湯清肺經血分之火以治其標此即金匱酒客致咳必致吐血六脈數大宜清肺胃兩家之火者也若先咳血後嗽痰皆是陰虛火動津竭血燥水中火發先傷肺經之血故先咳純血日久不愈後傷肺經之氣然後而嗽白痰治宜犀角地黃湯加荊芥黃芩先涼肺經血分之火以治其本後用天地煎玄武膠合瀉白散清肺經氣分之火以治其標此即金匱陰虛勞瘵之症六脈細數不可補氣而遵壯水之主以鎮陽光之條者也有真陽不足脾腎虛寒面色痿黃時或咳嗽見血脈多空大無力此土不生金肺經虧損肺氣虛不能攝血大宜溫補切忌苦寒此即金匱面色白脈沉遲越人所謂損其肺者益其氣之條也夫吐血與咳血不同咳血純是肺家伏火故一切溫劑補劑與兜澀之劑皆不可用節齊有服參必死之戒單為積熱痰盛咳血嗽血者言至吐血家亦有久吐而致陽虛者蓋吐血雖是陽旺若久而不止則真陽亦虛故仲景有血脫益氣之法又有吐血不止用柏葉湯柏葉性燥綱目但有益脾之名仲景以久吐不止則陽隨陰耗用寒涼止血之藥皆不應故用柏葉性燥辛香之味引血歸於脾經是以原文止治久吐血且曰不止者並不列於咳血嗽血門中今人不會前人本意誤治咳血嗽血余並表而出之衄血論秦子曰血從鼻孔而出者衄也鼻為清道肺之開竅陽明主司以手太陰肺與手陽明大腸相為表裡者也陽明有熱肺受火制陽明之脈入目絡鼻交頞中旁納太陽之脈故仲景傷寒條以太陽有邪侵入陽明則衄血又以足太陽膀胱之脈與足少陰腎相為表裡故金匱內傷條以肝腎有火上衝太陽巔頂傳入陽明亦為衄血內傷門衄血為熱在裡宜涼血外感門衄血為熱在表宜解表外感衄血外感衄血之症惡寒身熱頭疼身痛鼻孔出血此寒傷太陽經侵入陽明而成衄血之症也若目痛鼻乾不眠身熱口渴脈長而洪此陽明本經鬱熱衄血之症也外感衄血之因其人內有積熱外冒風寒傷於太陽之經鬱而發熱經絡熱甚熱侵陽明迫血妄行於鼻又有陽明本經鬱熱熱邪在經不得發越又有過服辛溫或以火劫汗兩陽相搏此皆外感衄血之因也外感衄血之脈浮大而緊太陽衄血脈若弦長熱在陽明脈沉洪數里有熱結脈若躁疾誤用火劫外感衄血之治惡寒脈浮緊無汗冬月仲景用麻黃湯有汗脈浮緩桂枝湯三時節庵羌活沖和湯陽明鬱熱無汗乾葛解肌湯有汗犀角地黃湯加升麻乾葛火劫致衄黃芩芍藥湯麻黃湯麻黃桂枝甘草杏仁桂枝湯桂枝芍藥甘草生薑大棗楨按以上二方辛溫太過仲景冬月用之治衄血皆表症不比吐血咳血裡熱症耳羌活沖和湯羌活黃芩防風蒼朮川芎生地細辛白芷甘草乾葛解肌湯葛根桂枝芍藥甘草麻黃犀角地黃湯犀角地黃白芍丹皮山梔升麻乾葛加茅根同煎熱甚加黃芩黃芩芍藥湯黃芩白芍藥生地丹皮甘草加茅根同煎磨京墨沖服內傷衄血內傷衄血之症身無表邪目睛或黃五心煩熱鼻孔出血此內傷衄血之症也內傷衄血之因或房勞傷腎陰精不足水中火發或惱怒傷肝肝火易動陰血隨火上升錯經妄越則內傷衄血之症作矣內傷衄血之脈左尺脈浮肝腎陰虛左寸沉數心火妄動右寸脈洪肺家火旺右關脈數脾胃積熱內傷衄血之治腎陰不足左尺脈浮者犀角地黃湯涼八味丸肝火攻衝清肝飲心火刑金天王補心丹熱甚者瀉心湯肺火上炎瀉白一物湯膏粱積熱清胃湯加酒大黃犀角地黃湯治腎火上衝犀角生地丹皮白芍藥山梔黃柏涼八味丸治腎火上衝生地山藥澤瀉丹皮山萸肉白茯苓黃柏知母清肝飲當歸川芎生地柴胡黃芩白芍藥丹皮山梔青皮天王補心丹治心血不足者人參玄參丹參五味子柏子仁當歸遠志生地黃連天門冬麥門冬棗仁桔梗白茯神瀉心湯治心火上炎黃連甘草瀉白一物湯即瀉白散加黃芩清胃湯升麻黃連生地山梔甘草乾葛石膏犀角夫血從胃中嘔出名吐血從肺中咳出名嗽血從鼻孔流出名衄血分立三條則經絡各別夫胃中嘔出之血雖輕於肺中咳血然有大吐不止而死者鼻中流血本為輕症然有鼻血不止久久變症故以三症同名血症皆因火載上衝下手真訣必要先去血中之火家祕歸經湯以黃芩黃柏與當歸同用則血中之火去而血立刻歸經若咳嗽甚者兼用家祕瀉白散血不上衝隨以家祕肝腎丸補其真陰家祕歸經湯當歸白芍藥黃芩黃柏丹皮生地甘草大便結者加大黃同煎臨服多磨犀角汁沖家祕肝腎丸牙衄總論秦子曰牙衄者即牙齦出血之症也有兩經分別一主陽明腸胃一主少陰腎經若血來如湧來勢甚暴來血甚多此陽明牙衄之血也有外感有內傷若血來點滴來勢緩慢來血不多此少陰腎經之血也有內傷無外感以經絡而論有臟腑陰陽之別以病因而論皆屬血中有火但有虛實別而無陰寒者也外感牙衄外感牙衄之症身發寒熱煩悶不安目痛頭額痛鼻乾不眠牙血暴出此陽明經牙衄之症也外感牙衄之因或太陽表邪侵入陽明或陽明自冒風熱本經熱甚陽明多血多氣氣血皆熱則上攻陽明所過之經得牙齦之竅縫而直出也外感牙衄之脈脈多浮數浮主表邪數主血熱左脈浮數太陽侵邪右脈浮數陽明之熱浮數解表沉數涼血外感牙衄之治左脈浮數身熱無汗有表邪者葛根羌活湯右脈浮數身熱無汗有表邪者乾葛防風湯右脈浮數身熱有汗無表邪者乾葛清胃湯表邪已解脈沉而數犀角地黃湯未效加酒蒸大黃其血即止乾葛羌活湯即羌活湯加乾葛乾葛防風湯乾葛防風荊芥石膏知母乾葛清胃湯升麻生地丹皮川連甘草乾葛石膏犀角地黃湯見前咳血嗽血裡熱甚加酒蒸大黃內傷牙衄內傷牙衄之症身無表邪牙齦出血一湧而上來血甚多此陽明經牙衄之症若身無表邪牙齦時或出血來血不多久而不愈肌肉消瘦此少陰腎經牙衄之症也內傷牙衄之因膏粱積熱辛辣炙煿好酒香燥腸胃有熱血中伏火則上衝而出若腎陰不足水中之火上炎亦令牙齦出血久而不愈內傷牙衄之脈脈多洪數右關洪數陽明經熱兩尺洪數腎經之血內傷牙衄之治右關沉數陽明血熱者犀角地黃湯加酒浸黃芩右關洪數腸胃積熱者升麻清胃散加酒蒸大黃左尺脈數龍火上衝者知柏肝腎丸加玄武膠犀角地黃湯見吐血升麻清胃散升麻生地川連丹皮山梔當歸大黃酒蒸知柏肝腎丸凡治血症要明血去火亦去可用血脫益氣若血去火存但可補血涼血切不可用溫燥至牙衄陽明經血熱用升麻清胃湯酒大黃生犀角則血立止即腎陰不足亦是陰虛火旺用知柏肝腎丸苟大便不滑亦加大黃生犀要知血得熱而妄行以當歸三黃同煎則血涼盡而下順歸經世人不明妄言當歸辛散不宜治血逆上衝及胎前安胎豈知血熱上衝涼血則下順歸經胎前血熱胎氣不寧仲景立安胎飲用當歸黃芩各一斤以血中熱減則歸經養胎而自安家祕化四物三黃同用治血熱上衝開化方妙法勞傷總論秦子曰勞傷之症即發熱咳嗽勞瘵骨蒸之症今人患者比比考之內經但有言虛未見言勞然於病因條內則有因虛成病之語即可謂之虛勞矣至金匱書則發明虛勞之症立論立方而勞傷之症始彰至巢氏撰病源候論分別五者為勞七者為傷則勞傷之義已著後又立六極三十三蒸反覺太煩太碎余今酌立精氣血之傷五臟之勞為勞傷而以機要所云感寒成勞感熱成勞自外入內者為外感氣怯神傷精竭血燥自內致病者為內傷分立外感二條內傷八條而大綱節目盡矣外感勞傷感寒勞傷感寒勞傷之症初起惡寒發熱咳嗽氣逆脅肋刺痛或無汗身熱或朝涼暮熱此即感寒成勞傷風成勞之症也感寒勞傷之因玄珠云體虛之人最易感邪不去其邪便服補劑或不忌葷酒邪氣得補留滯發熱熱傷肺氣為喘為咳此感寒成勞之因也感寒勞傷之脈多見浮緊左脈浮緊血分感寒右脈浮緊氣分感寒感寒勞傷之治左脈浮緊血分感寒者羌活柴胡湯加川芎芍藥治之右關浮緊氣分感寒者乾葛防風湯加紫蘇廣皮治之羌活柴胡湯羌活獨活柴胡防風川芎白芍藥乾葛防風湯乾葛防風荊芥柴胡紫蘇廣皮感熱勞傷感熱勞傷之症內熱躁悶喘咳氣逆唇焦口渴小便赤澀此久蒸成勞因疳成勞之症也感熱勞傷之因機要云勞損之疾因虛而感如遠行勞倦逢大熱而渴則熱舍於腎水不勝火則骨枯髓虛而成感熱勞傷之症感熱勞傷之脈脈多洪數左脈浮數氣分感熱左脈沉數血分感熱右脈浮數氣分感熱右脈沉數血分感熱感熱勞傷之治左脈浮數血分感熱者柴胡歸芍湯加生地丹皮右脈浮數氣分感熱者柴胡地骨皮散加紫蘇廣皮以治之柴胡歸芍湯治血分感熱柴胡黃芩山梔甘草當歸白芍藥生地丹皮柴胡地骨皮散治氣分感熱柴胡地骨皮知母甘草紫蘇廣皮乾葛內傷勞傷心虛勞傷心虛勞傷之症驚悸恍惚神志不定心痛咽腫喉中介介如梗實則毛焦發落唇裂舌赤煩熱咳逆此心勞之症也心虛勞傷之因曲運神機耗散心血內而欲心妄動外而起居如驚則諸念動處皆是火火旺傷金咳逆氣急則心勞之症作矣心虛勞傷之脈左脈多浮左寸浮緩心氣不足左寸浮數心血不足心虛勞傷之治心氣不足虛寒者歸脾湯虛熱者天王補心丹心血不足虛熱者門冬安神丸實熱者導赤各半湯歸脾湯見前吐血天王補心丹見前嗽衄血