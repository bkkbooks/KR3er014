結溫中健脾則氣化痰行若用寒涼反凝結不散矣一曰心下有痰飲胸脅支滿目眩苓桂朮甘湯主之若短氣有微飲當從小便去之苓桂朮甘湯主之腎氣丸亦主之痰飲胸滿推廣蒼朴二陳湯苓桂朮甘湯治心下有痰飲胸脅支滿目眩茯苓桂枝白朮甘草腎氣丸治痰飲短氣當從小便去者懷生地澤瀉白茯苓山藥丹皮山茱萸附子肉桂推廣蒼朴二陳湯治胃家有水飲胸滿嘔吐不渴者飲傷肺則喘咳飲傷胃則嘔逆熟半夏廣皮甘草白茯苓熟蒼朮厚朴身熱口渴加葛根小便不利加澤瀉脈數者加山梔川連脈遲加煨姜懸飲懸飲之症飲後水流在脅下咳唾氣逆引痛胸肋謂之懸飲此即金匱懸飲症也懸飲之因飲食不節水漿不忌脾肺不能運化水流在脅下上攻肺家故咳而吐氣逆阻絶肝膽生升之令是以痛引胸脅而成懸飲之症矣懸飲之脈或沉或弦沉為有水故曰懸飲弦為氣結故曰內痛懸飲之治金匱隻立一方曰脈沉而弦懸飲內痛十棗湯主之以懸飲主痛故用下法今余推廣二方滾痰丸加味二陳湯大棗湯芫花甘遂大戟滾痰丸青礞石大黃沉香黃芩加味二陳湯熟半夏白茯苓廣皮甘草枳實桔梗杏仁栝蔞仁有熱加川連嗽加貝母陶氏用此以治痰結胸脅溢飲溢飲之症水氣流行歸於四肢身體疼重支節煩疼謂之溢飲也溢飲之因飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱若飲水多水性寒冷停滯氣逆逆則溢於四肢當汗不得汗不能外散身得濕則重復得寒則疼故曰身疼重而成溢飲之症矣溢飲之脈金匱曰脈沉而數脈沉而弦懸飲也又云病溢飲者當發汗不言脈象楨意其必浮大浮緊未必沉弦沉數溢飲之治金匱治懸飲內痛用十棗湯又曰病溢飲者當發汗大青龍湯主之小青龍湯亦主之夫懸飲脈沉弦飲懸於內而痛者故用下法溢飲溢於外故用汗法大棗湯見前懸飲大青龍湯治溢飲身體疼重肢節煩疼當發汗者麻黃桂枝甘草生薑杏仁大棗石膏小青龍湯麻黃甘草桂枝白芍藥五味子乾薑半夏細辛支飲支飲之症咳逆倚息氣短不得臥其形如腫即金匱支飲症也支飲之因飲邪偏注停留曲折之間蓋肺與大腸之脈下膈絡腸今飲積於中外不得達於表內不得循於裡而偏礙肺與大腸交通之氣道則咳逆倚息呼吸不得流利氣逆而咳喘促而不得臥矣形如腫者水飲之外現也支飲之脈脈多沉緊脈弦為水脈弱可治數實者死其脈虛者必苦眩暈支飲之治金匱曰膈間支飲其人必喘心下痞堅面色黎黑其脈沉緊得之十數日醫吐下之不愈木防己湯虛者即愈實者三日復發復與不愈者以前方去石膏加茯苓芒硝主之以胃有痰飲之積熱石膏止清無形氣分之熱不能去有形痰飲之實熱故易芒硝又云心下有支飲其人苦冒眩澤瀉湯主之又云支飲胸滿者厚朴大黃湯主之支飲不得息葶藶大棗湯主之嘔家本渴今反不渴心下有支飲故也小半夏湯又云卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓咳家其脈弦為有水十棗湯主之夫有支飲家咳煩胸中痛不卒死至一百日或一歲十棗湯主之咳逆倚息不得臥小青龍湯主之外另有腹滿口舌乾燥此腸間有水氣己椒藶黃丸主之假令瘦人臍下有悸吐涎沫而顛眩此水也五苓散主之按此二條非指定支飲而立說大約統言水飲家之條目木防己湯木防己石膏桂枝人參上四味煮取一升溫服愈後復發去石膏加芒硝澤瀉湯治心下有支飲其人苦冒眩澤瀉白朮上二味水二升煮取一升溫服厚朴大黃湯治支飲胸滿者厚朴大黃枳實上三味以水五升煮取二升溫服葶藶大棗湯葶藶子大棗肉先以水三升煮棗取二升去棗納葶藶子半夏湯半夏生薑上二味以水七升煮一升服小半夏加茯苓湯半夏生薑白茯苓上三味煮一升服十棗湯見前懸飲門小青龍湯見前溢飲門己椒藶黃丸防己椒目葶藶大黃蜜丸如梧子大日三服五苓散澤瀉豬苓白茯苓白朮肉桂上五味為末暖水調服留飲留飲之症金匱云心下有飲其人背寒冷如掌大又云留飲者脅下痛引缺盆咳則輒已又云胸中有留飲其人短氣而渴四肢歷節痛脈沉者必有留飲留飲之因始因水飲停積結成痰飲日久不化即曰留飲夫留者聚而不散之謂也飲留於背妨督脈上升之陽而為背寒少陽肝膽之脈由缺盆過季脅飲留於脅阻絶肝膽生升之氣故脅下痛引缺盆留飲胸中其人短氣而渴四肢歷節痛留飲之脈脈多沉者胸有留飲雙弦者寒偏弦者飲留飲之治病者脈伏其人欲自利利反快雖利心下續堅滿此為留飲欲去故也甘遂半夏湯主之甘遂半夏湯甘遂半夏芍藥炙甘草伏飲伏飲之症痰滿喘咳吐發則寒熱背痛腰疼目淚自出其人振振身瞤劇名曰伏飲之症也伏飲之因水飲不散伏於胸中阻其肺氣則痰滿喘咳阻其中氣則吐發伏於腰背太陽表邪外束則寒熱背痛伏於上焦阻絶清升之氣則目淚自出飲伏胃家胃陽凝塞不能四布振振瞤劇夫曰吐發則寒熱背痛可見不發即不吐不吐即不發矣以其有飲內伏故外邪觸之即發也伏飲之脈左脈浮緊寒邪束飲寸脈沉弦上焦阻絶關脈沉弦中脘凝塞沉脈主伏弦脈主飲沉弦之脈伏飲之診伏飲之治有寒熱則病在表腰背痛則病在太陽此內有伏飲外表有邪當從表裡並治小青龍湯木防己湯主之蓋留飲里症也故用行痰逐飲之藥今伏飲有寒熱背痛吐發等表症故從表散也小青龍湯見前溢飲門木防己湯見前支飲門楨按以上諸條金匱之論痰飲也此以脾濕成痰非比諸痰症故別之曰痰飲夫飲者即停蓄之水飲也蓋痰因火動而成飲因水寒所致痰症論秦子曰痰之為病變化百出皆內因七情外感六氣中宮失清化之令熏蒸結聚而成須分所兼之邪治之有風痰濕痰燥痰郁痰食積五條夫濕痰燥痰有外感有內傷郁痰食痰有內傷無外感飲主乎水寒多熱少痰主乎火寒少熱多外感痰症風痰風痰之症頭痛身痛發熱惡寒吐嗽痰沫氣逆此外感風痰症也風痰之因外感風邪襲人肌表束其內郁之火不得發泄外邪傳裡內外熏蒸則風痰之症作矣風痰之脈浮滑者多浮數風熱浮緊風寒若見沉滑風邪內結洪大易治沉細難痊風痰之治有風寒風熱之分外感風寒宜辛散表邪如三拗湯合小半夏湯小青龍湯加減治之外感風熱宜辛涼解熱如參蘇飲荊防甘桔湯荊防瀉白散選用三拗湯合小半夏湯治風寒痰嗽等症麻黃杏子甘草半夏生薑小青龍湯見前溢飲門參蘇飲治風痰咳嗽人參紫蘇前胡葛根半夏枳殼桔梗廣皮甘草氣逆加蘇子橘紅痰多加半夏南星氣喘加蘇子前胡荊防甘桔湯治風熱痰嗽荊芥防風桔梗甘草薄荷荊防瀉白散治風熱入肺肺風痰喘荊芥防風桑白皮地骨皮甘草濕痰濕痰之症身發寒熱面目浮腫惡寒頭重身痛不能轉側嘔吐噁心煩滿不渴此外感濕痰之症也濕痰之因或坐臥卑濕或衝風冒雨則濕氣襲人內與身中之水液交凝積聚靈樞所云風雨襲陰之虛病起於上而成積清濕襲陰之虛病生於下而生聚此即濕痰之因也濕痰之脈脈多浮大浮緩兼風浮澀主濕浮滑濕痰沉滑頑結濕痰之治身熱脈浮大者宜散風除濕羌活勝濕湯胸滿脈滑者宜化痰二陳湯平胃散羌活勝濕湯散表除濕則痰自化羌活獨活防風川芎甘草藁本二陳湯消痰利濕半夏白茯苓廣皮甘草平胃散燥濕化痰蒼朮厚朴廣皮甘草燥痰即火痰燥痰之症發熱唇焦煩渴引飲喘咳短息時作時止吐咯難出此外感燥痰之症也燥痰之因或亢陽行役時逢火令燥熱之氣干於肺家為喘為咳傷於腸胃為痰為嗽此外感燥痰作矣燥痰之脈脈必洪數浮數傷表沉數傷里左脈洪數燥傷肝膽右脈洪數燥傷肺胃燥痰之治宜清熱潤燥降火化痰竹葉石膏湯二母石膏湯二母二陳湯竹葉石膏湯石膏麥冬竹葉人參半夏知母甘草二母石膏湯知母川貝母石膏二母二陳湯知母貝母半夏白茯苓陳皮甘草內傷痰症燥痰燥痰之症咳嗽喘逆痰火上升時咳時止痰不能出連嗽不已面赤氣升此內傷燥痰之症也燥痰之因五志之火時動於中或色欲過度真水涸竭或膏粱積熱腸胃煎熬熏蒸於肺煅煉為痰則燥痰之症作矣燥痰之脈右寸數大肺家有熱右關沉數腸胃有熱左關脈數木火之邪兩尺沉數腎水燥竭燥痰之治養陰壯水潤肺生津則火熄燥除而痰不生若用燥味消痰禍不旋踵真水枯涸二冬二母湯膏粱積熱節齊化痰丸二冬二母湯麥冬天門冬知母川貝母腎水竭加生地熟地元氣虛加人參二母固本丸川貝母知母天門冬麥門冬懷生地懷熟地人參節齊化痰丸天冬一兩黃芩一兩海石一兩橘紅一兩桔梗一兩栝蔞仁一兩青黛一兩連翹一兩芒硝五錢香附一兩家祕加昆布一兩濕痰濕痰之症身或熱或不熱體重足酸嘔而不渴胸膈滿時吐痰身體軟倦此內傷濕痰之症也濕痰之因中氣不足胃陽不能消化脾陽不能施布則水穀停留為痰為飲而濕痰之症成矣濕痰之脈多見沉滑滑實頑痰滑軟虛滯滑而不數脾濕成痰滑而帶數濕熱所致濕痰之治燥濕則痰自化理脾則痰運行二陳平胃散或二陳羌防湯濕鬱成熱梔連二陳湯虛人六君子湯帶熱加梔連帶寒加薑桂二陳平胃散見前食積咳嗽梔連二陳湯即二陳湯加梔連二陳羌防湯半夏白茯苓廣皮甘草羌活防風六君子湯人參白朮茯苓甘草陳皮半夏郁痰即結痰頑痰郁痰之症胸滿飽脹九竅閉澀懊憹煩悶或咽中結核睡臥不寧或腸胃不爽飲食有妨或氣逆不利倚肩喘息郁痰之症也郁痰之因七情所傷易成鬱結肺氣凝滯脾元不運思則氣結悶郁成痰皆郁痰之因也郁痰之脈多見沉澀沉遲寒鬱沉數為熱沉實頑痰沉牢內結郁痰之治寒鬱辛散香芎二陳湯熱鬱清解梔連二陳湯肺經郁痰節齊化痰丸加昆布膽星香芎二陳湯治寒痰半夏白茯苓廣皮甘草香附撫芎白芥子梔連二陳湯治熱痰半夏白茯苓廣皮甘草川連山梔節齊化痰丸見前條食積痰食積痰之症飽滿不食噁心嘔吐或攻四肢肩背作痛下遺大腸時瀉時止或時吐痰口中覺甘此食積痰之症也食積痰之因胃強能納脾弱不運前食未消後食隨進停積成痰故曰食積痰也食積痰之脈脈多滑大滑大不數寒凝痰結滑大而數積痰而熱食積痰之治宜消食化痰佐以利氣宣導導痰湯枳朴二陳湯三子養親湯甚者滾痰丸導痰湯南星橘紅白茯苓半夏甘草枳殼枳朴二陳湯治胃家有痰枳實厚朴半夏白茯苓廣皮甘草三子養親湯治食積痰山楂子萊蔔子白芥子滾痰丸見前懸飲丹溪雜治濕痰用二陳湯虛者六君子湯風痰頭痛發熱脈浮大祛風丸導痰丸寒痰身不熱口不渴脈沉遲熱痰面赤多汗口渴眼爛煩躁燥結脈數用梔連二陳湯或加石膏黃芩竹瀝蘿蔔汁化痰丸血虛痰五心煩熱形體滑瘦六脈細數加減四物湯加貝母杏仁青黛氣虛痰面黃肌瘦六脈濡緩六君子湯精虛痰骨蒸潮熱虛火時升脈多細數地黃丸加減二冬湯固本丸加玄武膠佐以理氣之藥食積痰痰味甘甜五更咳嗽或成瘧痢六脈沉滑或見數大沉實枳朮丸保和丸老痰即結痰頑痰堅結膠固吐咯難出脈見沉牢海石青黛丸加半夏栝蔞膽星痰在咽喉咯不出咽不下即老痰結痰也宜節齊化痰丸痰在膈上六脈弦遲白芥子可以引達痰在腸胃間腸鳴而濯濯有聲脈見沉滑導痰湯痰在皮裡膜外或結核或麻痹非竹瀝不能通非薑汁不能散滾痰丸攻瀉腸胃痰積最為要藥然須看虛實腎氣丸治腎陽不足不能納火歸源水泛為痰者最效腎水陰虛火旺金水皆枯者斷斷不可用十棗控涎三花神佑諸湯治脅痛虛人不可妄施痰飲在胃每多攻注四肢肩背或為麻木軟痹腫痛指迷丸主之指迷丸消胃家上結之痰化大腸下凝之垢半夏四兩白茯苓三兩廣皮三兩枳殼一兩元明粉一兩甘草五錢上為細末竹瀝為丸鉤藤湯送下肝膽有火加膽星痰積不消加海石按節齊化痰丸化肺中燥痰兼化胃痰者今指迷丸消胃中濕痰兼消腸中痰者也飲因水濕痰因火動然就火而論有濕火燥火之分肺火成痰為燥痰胃火成痰為濕痰治燥用潤治濕用燥人人知之用潤而已結之痰凝滯不化用燥助火則痰愈生思得金匱以門冬半夏同用又以石膏半夏同用節齊化痰丸以香附天冬同用凡此皆是用潤以制燥用燥以制潤方書以二陳湯加梔連治濕火之痰家祕以二陳湯加知母石膏兼治燥火之痰良以用半夏則已結之痰從半夏而化同石膏則燥熱之火從石膏而清半夏同石膏亦能散熱石膏同半夏亦能化痰立此法門用燥不犯辛燥用潤不犯凝滯家祕治夾食傷寒用平胃保和散恐太燥多衝竹瀝蘿蔔汁廣而推悟者也附諸賢論劉宗厚曰痰之為病仲景論四飲六症無擇敘內外三因蓋四飲則敘因痰而顯諸症者三因方則論其因所傷而生痰者也夫痰病之原有因熱而生痰者亦有因痰而生熱者有因風寒暑濕而得有因驚而得有因氣而得有因飲酒而得有因飲食而得有脾虛不能運化而生者有腎水虛不能制火而生者若熱痰則煩躁脈數風痰則身熱脈浮冷痰則滑瀉脈遲濕痰則身重不渴驚痰則睡臥不寧酒痰則胸腹作痛食積痰則胃脘作痛不思飲食若夫子和謂飲無補法必當去水立汗吐下三法又論熱藥治痰之誤固為切當然亦有挾寒挾虛者夫老痰凝結頑固不行不用溫藥引導必有拒格凝滯之患況風寒外束痰氣內郁者不用溫散何由開鬱行滯至若氣血虧乏之人痰客中焦理宜導去痰滯補接兼行不可盡拘汗吐下三法也因脾氣虛弱津液不運痰反愈生法當補脾胃清中氣則痰自運治法濕痰生於脾胃宜實脾燥濕燥痰生於肺隨氣升降宜順氣然氣升屬火順氣莫先於清火導引次及故濕痰則燥之熱痰則清之風痰則散之郁痰則開之頑痰則軟之食痰則消之在上者吐之在中者清之在下者順之又中氣虛者宜補中氣助脾元以運行之古人用二陳湯為治痰通用者所以實脾燥濕然以之治濕痰寒痰痰飲痰涎則固是矣若夫痰因火動肺氣不清咳嗽時作及老痰郁痰黏痰結痰凝滯窒塞吐咯難出此等之痰皆因火邪炎上熏於上焦肺氣被郁則其津液之隨氣而升者為火煅煉凝濁鬱結而成矣病在上焦心肺之分咽喉之間非脾胃家濕痰寒痰痰飲痰涎之比惟宜開鬱降火清潤肺金滋養腎水而消化凝結之痰乃立化痰丸趙養葵論腎經痰曰痰者病名也原非人身之所有非水泛為痰即水沸為痰但當分有火無火之異耳腎經真陽虛不能攝伏其水則水如洪水泛濫而為痰是無火也八味丸益火之源腎經真陰虛不能制伏其火水得火而沸騰成痰是有火也六味丸壯水之主此不治痰之標而治痰之本也龐安常曰有陰水虛陰火上升肺受火侮不得清肅下行由是津液凝濁生痰不生血此當用潤劑如二冬地黃丸之屬滋其陰使上逆之火得返其宅火自息痰自清矣投以二陳等立見其殆又有腎經真陽不足不能攝伏其火則水泛為痰眩暈總論秦子曰余觀嚴用和眩暈論云眩掉諸症內經皆主肝風上攻致是而原病式釋之曰風木生火風火皆主陽焰得風則自旋轉然此但可論風火之眩暈若外感六淫之邪內傷七情之症皆能致眩暈者於是立外感風寒暑濕四條又立內傷痰涎下虛兩條實為眩暈指南然余惜其六氣未全七情未備且其用方主治又難於下手劉宗厚議其論症親切集方缺明深中其弊今余改立外感三條內該六氣內傷四條內該七情而其主治之方皆按經對症不得以平淡無奇而忽之也外感眩暈風寒眩暈風寒眩暈之症頭痛額痛骨節煩痛身熱多汗上氣喘逆躁擾時眩此風邪眩暈之症也若身熱無汗惡寒拘緊頭痛身痛時時冒眩此寒邪眩暈之症也風寒眩暈之因或風木司政風熱大作或體虛不謹外受風邪風主乎陽風熱為患則令人掉眩或太陽司政寒氣凌逼或太陰在泉寒沖頭角則發眩暈或疾風暴冷胃寒入胃激動痰涎亦令人眩暈風寒眩暈之脈左脈浮數太陽風熱左脈浮弦少陽風熱右脈浮數陽明風熱右脈滑大內有痰涎左脈浮緊太陽寒邪左脈弦緊少陽寒邪右脈浮緊陽明寒邪風寒眩暈之治左脈浮數太陽風邪者羌活防風湯加天麻黃芩左脈浮弦少陽風熱柴胡防風湯加天麻羌活右脈浮數陽明風熱者乾葛防風湯加天麻升麻右脈滑大症兼痰涎者導痰湯加天麻防風左脈浮緊太陽寒邪者羌獨敗毒湯加天麻細辛左脈弦緊少陽寒邪者柴胡羌活湯加天麻川芎右脈浮緊陽明寒邪者乾葛羌活湯加天麻升麻大凡眩暈之症多有兼痰者故天麻方書多用之今申明首條則以下諸條皆可參而用也羌活防風湯見痠軟柴胡防風湯即小柴胡湯去半夏加防風乾葛防風湯乾葛石膏知母甘草防風導痰湯南星半夏枳實甘草橘紅羌活敗毒散見傷寒痢疾門柴胡羌活湯柴胡羌活防風川芎乾葛羌活湯乾葛羌活防風白芷暑濕眩暈暑濕眩暈之症熱令之時自汗身熱面垢背寒煩渴引飲小便赤澀頭目冒眩此濕熱眩暈之症也若雨濕之時惡寒無熱身重身痛不能轉側無汗拘緊頭旋眼眩此寒濕眩暈之症也暑濕眩暈之因炎夏主令天之熱氣下降地之濕氣上升人感冒之則為濕熱眩暈之症若陰雨太多人感冒之經注所云濕氣內逆寒氣不行太陽上留亦為眩暈之症暑濕眩暈之脈傷暑之脈虛而帶數傷濕之脈濡而遲緩暑濕二脈虛細者多實大者少虛緩者寒虛數者熱暑濕眩暈之治煩渴引飲脈虛帶數者人參白虎湯自汗煩躁小便赤澀黃連香茹飲沖六一散溫服若惡寒無熱身痛不能轉側脈遲緩者羌獨勝濕湯合朮附湯人參白虎湯見咳嗽噎隔門黃連香茹飲見中熱羌活勝濕湯見痠軟朮附湯見腹脹燥火眩暈燥火眩暈之症身熱煩躁口渴引飲夜臥不寧頭旋眼黑小便赤澀此燥火眩暈之症也燥火眩暈之因經謂厥陰司天客勝則耳鳴掉眩又云肝肺太過善忘忽忽冒眩此皆運氣加臨之眩暈也又有時令之熱感入腸胃傳於臟腑上衝頭目則眼眩旋轉此人自感冒而為眩運也燥火眩暈之脈左脈躁疾厥陰客勝右脈躁疾肺熱眩暈左右皆疾肝肺太過右脈躁疾燥火傷氣左脈躁疾燥火傷血燥火眩暈之治左脈躁疾厥陽掉眩者柴胡清肝飲右脈躁疾肺熱上衝者清肺飲左右躁疾肝肺太過者瀉青各半湯右手脈數燥火傷氣者竹葉石膏湯左手脈數燥火傷血者歸芍大黃湯柴胡清肝飲見腹痛清肺飲見咳嗽瀉青各半湯見咳嗽竹葉石膏湯見痰症歸芍大黃湯當歸身白芍藥川大黃丹皮內傷眩暈氣虛眩暈氣虛眩暈之症氣虛即陽虛也其人面色白身無熱神識清爽言語輕微二便清利時或虛陽上浮頭面得火眩暈不止或熱手按之則運乃定此氣虛眩暈之症也氣虛眩暈之因大病久病後汗下太過元氣耗散或悲號冷引以傷肺氣曲運神機以傷心氣或惱怒傷肝鬱結傷脾入房傷腎飢飽傷胃諸氣受傷則氣虛眩暈之症作矣氣虛眩暈之脈脈浮而空浮則為氣空則為虛右寸脈虛肺氣不足右關脈虛中氣不足左寸脈虛心氣不足左關脈虛肝膽氣弱兩尺脈虛腎氣不足氣虛眩暈之治肺氣不足者人參生脈散合四君子湯中氣不足者補中益氣湯中氣虛寒不能運化水穀者理中湯心氣不足者酸棗仁湯肝氣有傷者逍遙散腎氣不足都氣丸真陽不足虛陽上浮者腎氣丸加鹿角膠為丸攝伏降之古方用一味鹿茸濃煎服治真陽虛者最效人參生脈散見霍亂四君子湯補中益氣湯理中湯上三方見痢疾酸棗仁湯見不得臥逍遙散見咳嗽都氣丸即六味丸加五味子腎氣丸即熱八味丸加車前子血虛眩暈血虛眩暈之症血虛即陰虛也形體黑瘦五心常熱夜多盜汗睡臥不寧頭面火升則眼花旋轉火氣下降則旋暈亦止不比外感之常暈不休不比痰火之暴發暴作此血虛眩暈之症也血虛眩暈之因陽絡傷則血外溢上逆陰絡傷則血內溢下泄凡此亡血成虛而為眩暈者又有焦心勞思憂愁鬱結心脾傷而不能生血或惱怒傷肝肝火內動而煎熬血室此陰血內耗血海乾枯而為眩暈者也血虛眩暈之脈脈多細澀細而不數血虛無熱細而帶數血虛有熱左寸細澀心血不足左關細澀肝不藏血右關細澀脾不統血兩尺細數腎陰枯竭血虛眩暈之治血從下泄傷於陰絡血虛無火脈細不數者歸脾湯補中益氣湯心血不足血虛無火左寸細澀者酸棗仁湯心血不足血虛有火左寸細數者天王補心丹合安神丸肝血不足血虛無火左關細澀者逍遙散血虛有火左關細數者知柏四物湯脾陰不足血虛無火右關細澀者歸脾湯血虛有火右關細數者加味當歸補血湯腎陰不足水虛無熱尺脈不數者八味丸水虛有火尺脈洪數者知柏天地煎知柏肝腎丸古方用玄武膠一味陰虛火旺最效歸脾湯見中風吐血二門補中益氣湯見痢疾酸棗仁湯見不得臥天王補心丹見嗽血安神丸見內傷中風逍遙丸見咳嗽知柏四物湯見喘症加味補血湯即當歸補血湯加知母黃柏楨按同一失血之症要分陽絡傷而為外溢上逆者陰絡傷而為內溢下泄者同一血虛之症要分血脫陽脫而為血虛無火當用歸脾湯補中益氣湯遵血脫益氣之法者又血脫陽旺而為血虛有火用肝腎丸知柏天地煎玄武膠遵壯水之主以制陽光之法者是以凡治虛症而用補劑當分有火無火以別或養陽或養陰之大關節也痰飲眩暈痰飲眩暈之症胸前飽悶噁心嘔吐膈下漉漉水聲眩悸不止頭額作痛此痰飲眩暈之症也痰飲眩暈之因飲食不節水穀過多胃強能納脾弱不能運化停留中脘有火者則煅煉成痰無火者則凝結為飲中州積聚清明之氣窒塞不伸而為噁心眩暈之症矣痰飲眩暈之脈滑大而數痰火之診沉弦不數乃是寒飲右關滑大脾胃之痰右關沉弦脾胃之飲左關滑大肝膽之痰左關朝寸膽涎沃心右關朝寸熱痰刑金痰飲眩暈之治脾胃有痰右關脈滑者二陳湯導痰湯滑大而數有熱者加梔連沉細而遲有寒者加石菖蒲白芥子若實痰膠固胸中作脹作痛脈數有力者滾痰丸下之若脾虛不能運化而成痰者六君子湯補脾化痰若脾胃雖虛虛中尚有滯者大安丸大便燥結或大便不結而澀滯不順者指迷丸左關滑數肝膽有痰青黛膽星湯火旺者兼用瀉青丸膽涎沃心心火上衝者硃砂安神丸加陳膽星牛黃清心丸加川連膽星二陳湯導痰湯見中風諸條滾痰丸見腹痛六君子湯即四君子加陳皮半夏大安丸即保和丸加白朮指迷丸見痠軟青黛膽星湯即膽星湯加青黛瀉青丸膽草山梔炒黑大黃酒蒸川芎當歸羌活防風硃砂安神丸見內傷中風牛黃清心丸見外感中風火沖眩暈火沖眩暈之症暴發倒僕昏不知人甚則遺尿不覺少頃汗出而醒仍如平人此火沖眩暈之症也火沖眩暈之因內經有諸風掉眩皆屬肝木言風主乎動木旺火生則為旋轉此五志厥陽之火上衝而為實火眩暈之症若肝腎之真陰不足龍雷之火上衝清道亦令人頭旋眼黑此陰火上衝而為虛火眩暈之症又有真陽不足虛陽上浮亦令人頭目冒眩之症此命門真火不足而為虛陽上浮眩暈之症也火沖眩暈之脈脈多洪數洪為陽盛數為火熱左寸洪數心火妄動左關洪數肝膽之熱左尺洪數腎與膀胱右寸洪數肺中之熱右關洪數脾胃之火右尺洪數三焦之熱兩尺空大沉按不數虛陽之別火沖眩暈之治心火妄動左寸洪數者導赤各半湯左寸細數者天王補心丹肝膽有火左關數大者梔子清肝散熱甚者龍膽瀉肝湯肝經血少左關細數者知柏四物湯家祕肝腎丸左尺數大膀胱小腸實熱者火府丹知柏導赤散熱甚者梔連導赤散左尺細數精血虛而火旺者知柏天地煎加玄武膠收斂陰中之火以降之肺熱上衝右寸數大者家祕瀉白散右寸細數肺陰不足者二冬二母丸合青金丸脾胃有火右關數大者梔連平胃散乾葛清胃散右關細數脾陰不足者知梔補血湯知柏戊己湯虛而熱甚者梔連補血湯梔連戊己湯三焦熱甚右尺實數者竹葉石膏湯加山梔黃芩虛陽上浮右尺浮大沉按無力者當用八味腎氣丸溫補天真斂真陽之火攝伏以降之導赤各半湯見中風中熱門天王補心丹見內傷嗽血門梔子清肝散梔子丹皮柴胡當歸白芍藥牛蒡子黃芩甘草龍膽瀉肝湯見脅痛知柏四物湯見厄症門家祕肝腎丸見內傷嗽血火府丹治熱結上焦小便不利生地木通甘草黃芩山梔知柏導赤散治熱結中焦小便不利生地木通甘草知母黃柏梔連導赤散治熱結下焦小便不利生地木通甘草山梔川黃連知柏天地煎見內傷嗽血門家祕瀉白散見咳嗽門二冬二母湯見燥熱咳嗽清金一物丸見傷熱咳嗽梔連平胃散見內傷厄症乾葛清胃散升麻丹皮生地當歸石膏川黃連乾葛甘草知柏補血湯知母黃柏黃耆當歸身知柏戊己湯知母黃柏甘草白芍藥梔連補血湯山梔黃連黃耆當歸梔連戊己湯山梔黃連甘草白芍藥竹葉石膏湯知母石膏揀冬竹葉山梔黃芩八味腎氣丸即六味地黃丸加肉桂附子楨按火沖眩暈之症有三大法門有五志厥陽之火膏粱積熱之火二者皆能上衝致眩此名實火眩暈當用導赤各半湯火府丹龍膽瀉肝湯梔連平胃散竹葉石膏湯等以清之有真陰不足龍雷之火上衝而暈者此名陰火眩暈當用天王補心丹知柏四物湯肝腎丸天地煎等養陰滋陰斂而降之有真陽不足無根之火失守上炎亦令人眩冒不止此名虛陽眩暈當用桂附八味丸四逆湯等攝伏降之例如發熱煩躁等症亦有三條分別實火攻衝而煩躁者名曰實熱煩躁此火擾於中大用苦寒之藥以直折之有真陰內耗而煩躁者名曰陰虛煩躁此陰虧火旺當用養陰之藥滋陰降火壯水之主以制陽光有真陽不足虛陽上浮而煩躁者名曰陰極發躁此陰寒之極反見虛陽之假象當用補陽之藥益火之原以消陰翳者喘症論秦子曰喘者促促氣急喝喝喘息甚者張口抬肩搖身擷肚與短氣不相接續逆氣上奔而不下者不同若喘促喉中如水雞聲謂之哮正傳云喘以氣息言哮以聲響名河間云病寒則氣衰而息微病熱則氣盛而息粗諸經皆令人喘而多在肺胃二家喘而咳逆嗽痰者肺也喘而嘔吐者胃也今立外感三條內傷六條外感喘逆風寒喘逆風寒喘逆之症頭痛身痛身發寒熱無汗惡寒喘咳痰鳴氣盛息粗此外感風寒喘症也風寒喘逆之因外冒風寒皮毛受邪鬱於肌表則身熱而喘逆於陽明則嘔吐而喘壅於肺家則咳嗽而喘肺風痰喘之症也風寒喘逆之脈浮緩為風浮緊為寒六脈俱浮表有風寒六脈沉數寒鬱為熱弦急難治沉散者絶風寒喘逆之治風氣勝者宜散風解表防風瀉白散防風桔梗湯寒氣勝者小青龍湯三拗湯麻黃定喘湯寒鬱成熱逆於陽明嘔吐者乾葛竹茹湯平胃散防風瀉白散見前哮症防風桔梗湯肺風痰喘此方甚妙防風半夏枳殼陳皮桔梗不應加桑白皮地骨皮即效小青龍湯見前溢飲門三湯拗見前風痰門麻黃定喘湯肺受寒邪未經鬱熱者用麻黃杏仁枳殼桔梗蘇子橘紅甘草乾葛竹茹湯清理胃氣去煩止嘔乾葛竹茹廣皮白茯苓熟半夏甘草有風加防風有寒加生薑平胃散治胃氣不平喘而上逆者熟蒼朮厚朴廣皮甘草風寒俱有加防風生薑暑濕喘逆暑濕喘逆之症煩悶口渴喘息氣粗多言身重汗出身仍熱此暑濕之喘症也暑濕喘逆之因內經云因於暑汗煩則喘喝此暑氣也因於濕首如裹面胕腫呼吸氣喘此濕氣也暑濕襲於皮毛干於肺胃則喘喝多言也暑濕喘逆之脈脈多濡軟或見微緩脈經云脈盛身寒得之傷寒脈虛身熱得之傷暑暑濕喘逆之治汗多口渴清暑益元散脈大多言即中熱症也黃連解毒湯或竹葉石膏湯暑濕身痛無汗喘逆應汗者羌活勝濕湯清暑益元散香茹厚朴白扁豆川黃連黃連解毒湯治三焦熱壅心肺伏火川連黃柏黃芩山梔竹葉石膏湯見燥痰門羌活勝濕湯見濕痰門燥火喘逆燥火喘逆之症口渴身熱二便赤澀喘咳氣逆面赤唇焦吐痰難出此燥火發喘之症也燥火喘逆之因燥萬物者莫燥乎火故喘症燥火居多原病式敘喘逆熱淫條下蓋燥火爍人則諸逆衝上諸痿喘嘔諸氣膹郁肺家不寧喘症作矣燥火喘逆之脈脈多數大或見滑數右脈數大燥火傷氣左脈滑數燥火傷血燥火喘逆之治栝蔞根湯知母甘桔湯脈大口渴人參白虎湯調益元散大便結涼膈散栝蔞根湯天花粉麥冬知母石膏甘草知母桔甘湯治肺家受燥咳嗽氣逆知母石膏桔梗甘草地骨皮人參白虎湯治胃受燥邪喘嘔煩渴人參知母石膏粳米甘草口渴加葛根氣逆加橘紅涼膈散治燥在上焦喘咳氣逆黑山梔黃芩桔梗連翹川連薄荷甘草以上皆外感喘逆故不用滋陰內傷喘逆內火喘逆內火喘逆之症五心煩熱口燥唇焦喘逆自汗得食稍減少頃復發時作時止面赤便祕此內火發喘症也內火喘逆之因內而欲心妄動外而起居如驚五志厥陽之火時動於中煎熬真陰精竭血燥內火刑金肺氣焦滿而喘逆作矣內火喘逆之脈脈多洪數心火上炎左關脈數肝膽之熱兩尺洪數腎火上逆右寸脈數肺中有火右關洪數胃家有熱內火喘逆之治腎虛火旺宜養陰制火壯水之主以鎮陽光門冬飲子家祕肝腎丸肝火上衝宜柴胡清肝散心火上炎導赤各半