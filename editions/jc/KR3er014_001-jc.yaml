body:
  text: 查敘秦子皇士者上海人也少時慨然有利濟天下之志遂研精醫學而於古今方書無不通徹要以黃帝神農造命宗旨為指歸其臨症必力窮其症之本末與夫輕重緩急推之至微嘗曰我非欲精於醫也惟期內省不疚而已斯真仁人君子之用心者於是聲稱籍甚海昌去海邑相距不啻四百里而名聲習聞如比屋然非實大者而能如是耶余向也奔走四方深以不得面承請教為悵自壬午冬膺特簡日侍內廷蓋益絕遠當世之士云然秦子者實益大聲益洪四方賢士大夫聞風遠迎者日益眾乙酉春赴嘉禾之請接臨敝邑起沉疴者不計算名益貫盈於耳因念古者學成名立必手定一書以公於世今以秦子之學如是之名如是使無所傳以公於世古之利濟天下者不如是至季冬單升陳子來入春闈會家人持方書數卷名曰症因脈治約五六百帙進閱之乃秦子皇士之所著也分門別類無不本末兼舉輕重緩急之得宜直令讀者據其書自無不至於神而臻於化人人皆可造命者既而宇瞻及仲季諸公捐金鐫刻以公世用固請序於余以弁其簡端余不禁躍然大喜以為秦子於利濟天下之志庶幾能垂無窮矣柂諸君光被天下後世之功且與余公於世之意有合也遂書而為之序康熙乙酉除夕賜進士出身現任翰林院編修通家弟查慎行書凡例是書之作竊比丹溪先生脈因證治篇但先生憑脈尋因尋症施治暗中摸索後人苦無下手是以王宇泰先生著準繩書竟取證治立名則有確據下手矣然不詳及脈因二條余又恐其脫略今更其名曰症因脈治則四科俱備開卷瞭然亦足以為初學之津梁矣凡前賢著書往往於外感內傷有餘不足混敘一篇不分條例彼以同是症名則同一論列聽人自擇而已不知此但可語中人以上者也設中下之才因見同在一門每每以治虛之法施之實症之人內傷之方用之外感之症余今於每症中必以外感內傷各著一端有餘不足各分治法臨症庶無多歧之惑治病先當分別十二經絡灼見何經主病用藥可以不誤故凡一經見症則以一經所主之藥治之兩經見症則以兩經之藥合而治之如是則孰急孰緩從少從多皆有主宰有病之經再無失治無故之經不妄誅伐也用藥之法須尋實據之症固已然有症脈相應依脈用方而為正治者亦有症象分明脈象模糊難於依脈立方而必隨症施治者余於治法中立此兩條則從症從脈自有準繩玄機之士所當觸類而旁通也每症章中詳立外感內傷誠恐學者混於施治然亦有外感而兼內傷者則以外感方中加內傷藥一二味有內傷則兼外感者則於內傷方中加外感藥一二味若二症並見者則以二症並治例如仲景治傷寒若見純表症者純用表藥見純里症者純用里藥表裡兼見者則以一半發表一半清裡雙解表裡之邪廣而推之傷寒如是雜症亦無不如是也凡著十二經絡症象不能一條詳悉者必得互相發明症象始著故余著水腫症已經分別各經絡病形然有言之未盡者則於後條脹症中重言以申之以為兩相闡發之用他如五臟咳嗽五臟痿痹等症經絡既同則症象亦無不同前後合參彼此互發相得益彰泛視之竟似重複實反復發明諸經形證今之治病不明經絡者通忽此法耳病機百出書不盡言集中諸病皆確見於平時臨症而不惑者故敢就正當世至如篇中或因文義拘牽而病情不無遺漏或因言此彼明而辭意概從省釋又或病症中大關節處前書未嘗明言後人每多忽略往往反復告戒以見鄭重其詞安辭煩瑣之譏難免支離之誚然而聞一可以知十知經可以達權業是道者或亦鑑此苦心也秦皇士識
