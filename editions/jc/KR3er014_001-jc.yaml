front:
  text: 原序醫有五科曰脈曰因曰病曰症曰治丹溪先生以病症為一故以四字賅之纂成一帙名曰脈因症治實為壽世之書奈後代諸賢不業是作遂至散亡淹沒予所深惜然諦思之仍有難於宗行者蓋執脈尋因尋症一時殊費揣摩不若以症為首然後尋因之所起脈之何象治之何宜則病無遁情而藥亦不至於誤用也是以古人先重望聞問而獨後於切耳余不諒敢竊丹溪之餘語匯成一卷改名症因脈治先辨其症次明其因再切其脈據症據因據脈用治庶節節可證而法不謬施諒必無罪於後世也但年邁神衰恐多疵漏未敢授梓傳世待後之賢者詳定而行可也崇禎辛巳嘉平月淡香堂廣野道人秦景明序沈序秦子皇士好學多才藝自幼博通經史及長名重士林惜不得志以有為古之人進則救民退則修己為秦子者獨善其身可矣然而秦子濟人利物之心不甘自棄謂無其位而可行其志者惟有醫於是取岐黃之要潛心三十年而其道甚明遂行於世全活者無算不論富貴貧賤終日孜孜惟以救人為事而不計利其術工而專奇而正固一時之彥也而秦子思以海內之大後世之久非一身之所能及必求其可大可久能以遍於天下傳之將來然後乃可發其祖景明先生所傳之秘曰症因脈治者復窮搜博覽闡明而損益之以行於世俾行是道者因症按脈而脈不虛索因脈用藥而藥不妄投其有功於世不大且久乎向以不得有為為秦子惜今則為秦子慶矣假使秦子者得一官效一職不過安全一鄉一邑而止其能起四海九州萬億千載之老少強弱悉保太和以安全於熙皞之天哉癸未冬予以疾告歸其書適成曾施君宇瞻及昆季葆文紋石象三諸公者善發一家欲躋斯民於仁壽之域捐資將授梓予不禁撫掌而為之序時康熙四十三年端陽後十日賜進士現任翰林編修同郡沈宗敬書於醉花處自序余幼業醫見家伯祖景明公有症因脈治一稿序原丹溪先生脈因證治中來時余學淺未會其趣後見嘉言先生寓意草云治症必先識病然後可以議藥今之學醫者議藥不議病嘆內經甲乙無方之書無人考究丹溪脈因證治分析精詳反不見用而心法諸書群方錯雜則共宗之余因知景明公症因脈治之作非無謂也遂有纂述之志然慎之未敢為也後三十年年至慮深每思有以成公之集而牽於生事日無寧晷偶憶袁先生可以濟人之語遂乃屏絕應酬潛心纂述症分內外傷因分內外因脈分虛實治分經絡對症用藥無遊移多歧之惑不十載而就意者彼蒼好生或丹溪景明兩公陰能助余也書成之明年余友施君宇瞻仲季見而悅之因謂余曰是書壽世之寶也與其寶之一方不若廣之天下與其利諸目前不若傳之後世子為是書以利濟一方余兄弟為是刻以公天下可乎余與及門皆大歡喜乃謝施君曰是書出倘有補於斯世者惟君之力時康熙四十五年歲在丙戌臘月秦之楨字皇士纂
