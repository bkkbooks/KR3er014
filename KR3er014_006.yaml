矣溫熱便結之脈云岐子云尺寸浮數太陽陽明尺寸洪數正陽陽明尺寸弦數少陽陽明右關沉數太陰溫熱左寸洪數少陰溫熱左關沉數厥陰溫熱溫熱便結之治太陽陽明羌活湯加大黃枳殼正陽陽明乾葛湯加大黃枳殼少陽陽明小柴胡湯加大黃枳殼言陽明者即言不大便也夫傷寒表解傳裡則熱邪斂入腸胃結實糞硬可用承氣下法今溫熱病則邪熱散漫諸經雖熱之久者亦不肯斂入於裡即大便閉結亦止宜以三陽表藥中加通利之藥雙解表裡之邪不比傷寒直下者也羌活湯羌活防風柴胡黃芩大黃枳殼乾葛湯乾葛知母石膏大黃枳殼小柴胡湯柴胡黃芩大黃枳殼陳皮甘草內傷便結積熱便結積熱便結之症內熱煩躁口苦舌乾小便赤澀夜臥不寧腹中脹悶胸前苦濁大便不行此積熱便結之症也積熱便結之因或膏粱積熱熱氣聚於脾中而不散或過服溫熱熱氣伏於大腸而乾結皆能令人大便閉結也積熱便結之脈右寸細數肺熱下遺右寸大數大腸積熱右關細數脾家之熱右心沉數亦大腸熱積熱便結之治肺熱下遺大腸清肺飲大腸積熱者黃連枳殼湯脾家積熱者黃連戊己湯清脾飲見前小便不利黃連枳殼湯川黃連枳殼各半同煎黃連戊己湯見前小便不利氣祕便結氣祕便結之症心腹脹滿脅肋刺痛欲便而不得便此氣實壅滯之症也若質弱形弱言語力怯神思倦怠大便不出此氣虛不振之症也氣祕便結之因怒則氣上思則氣結憂愁思慮諸氣怫鬱則氣壅大腸而大便乃結若元氣不足肺氣不能下達則大腸不得傳道之令而大便亦結矣氣祕便結之脈盛則沉實虛則細微右寸沉實肺氣鬱結右關沉實脾氣鬱結左關沉實肝膽氣結右寸細微肺氣不足右關微細脾氣不足氣祕便結之治肝氣壅盛者枳桔瀉白散脾胃鬱結者平胃二陳湯肝膽氣結者清肝飲大腸氣結者枳桔湯元氣不足者四君子湯肺虛不能下達生脈散合參橘煎枳桔瀉白散枳殼桔梗桑白皮地骨皮甘草平胃二陳湯平胃散加茯苓半夏清肝飲見腹痛枳桔湯即枳殼桔梗二味同煎四君子湯見痢疾門生脈散見前參橘煎即人參橘皮二味血枯便結血枯便結之症形弱神衰肌肉消瘦內無實熱大便祕結此陰血不足精竭血燥之虛症也若內熱煩熱或夜間發熱睡中盜汗此陰中伏火煎熬血乾之火症也血枯便結之因或久病傷陰陰血虧損高年陰耗血燥津竭則大便乾而祕結若血中伏火煎熬真陰陰血燥熱則大便亦為之閉結血枯便結之脈六脈沉數血液乾枯細小而數陰血不足滑大而數血中伏火血枯便結之治久病傷陰脈細而數者四物湯加麻仁何首烏高年陰耗血燥津竭者生脈散天地煎血中伏火滋血潤腸湯脾約丸四物麻仁丸當歸白芍藥生地黃川芎麻仁生何首烏生脈散見前小便不利天地煎天門冬生地黃等分同煎滋血潤腸湯當歸白芍藥生地大黃紅花麻仁脾約丸見前大凡去病真訣止有毛竅二便三條去路故傷寒身熱不減首重發汗解肌裡熱不解又重於清利二便內經治腫脹惟立開鬼門潔淨府內外分消開鬼門者發汗解肌也潔淨府者清利二便也按此三條初學無有不知究其下手真訣則白首皆不知矣故余著傷寒大白外感症苦心於發汗解肌清利二便三法著症因脈治首卷之傷寒獨開發汗散邪之法門末卷反復詳論大小二便不利也
