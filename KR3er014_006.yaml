body:
  text: 卷四瘧疾總論秦子曰瘧疾者先寒後熱發作有定期大約巳午末三時者多若一日一作太陽少陽也間日而作陽明少陽也伸欠惡寒頭痛太陽也發熱口渴陽明也有寒有熱嘔而口苦少陽也日中三陽得令其病即發日夕三陽時令退而病解不比寒熱往來時寒時熱一日二三次發亦不比暑熱之症熱無停止按內經但有巨陽陽明二經而不及少陽然有寒有熱乃是少陽所主余故補注少陽之脈少陽之治也以上三陽經瘧易愈若三日一發名曰三陰經瘧難愈今分別外感八條內傷三條又三瘧三條遊瘧一條外感瘧疾寒瘧內經寒營名寒瘧寒瘧之症內經云先寒後熱腰背頭項痛脊膂強呵欠呻吟始則寒極而戰動終則大熱而汗解發在午前者此太陽經瘧若目痛鼻乾寒栗鼓頷略寒即熱發在午後者此陽明經瘧以上二條乃內經寒邪傷營名寒瘧之症也寒瘧之因夏傷暑熱之氣入於皮膚之內腸胃之外營氣所舍之處又值早晚寒冷之邪外束暑熱至日中陽旺之時發泄不出後感寒邪近表是以先寒先感暑熱在裡是以後熱此先寒後熱之瘧作矣寒瘧之脈浮大而緊太陽之邪長大洪實陽明之瘧弦大之脈少陽之診寒瘧之治在太陽者桂枝羌活湯在陽明者桂枝葛根湯在少陽者桂枝柴胡湯三經俱見症者三方互用桂枝羌活湯治寒傷太陽寒多熱少無汗寒瘧桂枝羌活防風甘草吐者加半曲夏秋口渴引飲加石膏桂枝葛根湯治寒傷陽明寒多熱少有汗之瘧葛根白芍藥桂枝生薑甘草無汗加防風頭痛加羌活夏秋口渴消水加石膏桂枝柴胡湯治寒傷少陽寒多熱少之瘧桂枝柴胡楨按前三方因寒傷之瘧寒多熱少故皆用桂枝原文曰夏秋熱令必加石膏可見熱多寒少脈數口渴者切不可誤用也風傷衛瘧內經亦名溫瘧風瘧之症內經云風傷衛氣先熱後寒此言先後者言多少也言熱多寒少之瘧是以不曰惡寒而曰惡風自汗煩躁伸欠也不惡寒則寒少也發熱直至煩躁熱多也若頭痛背痛發於午前者太陽也目痛鼻乾發於午後者陽明也發於寅卯者少陽也風瘧之因內經云暑邪既伏秋氣收之汗出遇風與衛氣並居陰陽分爭內外相搏而風邪傷衛之瘧作矣風瘧之脈左脈浮緩太陽瘧也右脈洪長陽明瘧也左右皆弦少陽瘧也風瘧之治瘧在太陽有汗桂枝石膏湯在陽明白芷石膏湯在少陽小柴胡湯三陽俱見症者準繩和解湯桂枝石膏湯桂枝知母石膏黃芩無汗加防風身痛加羌活柴胡白芷石膏湯治陽明經溫瘧白芷石膏知母家祕以升麻葛根易白芷惡寒加桂枝無汗加防風柴胡身痛加羌活獨活小柴胡湯柴胡黃芩陳皮半夏甘草人參準繩和解湯治三陽經寒熱之瘧柴胡升麻葛根羌活知母石膏黃芩豬芩山甲甘草陳皮防風此方用表藥五味升散表邪使鬱熱外發而惡寒自已用寒藥三味以清裡使裡熱得清而發熱自退用豬苓分別陰陽穿山甲以通經絡陳皮甘草二味助胃氣升降諸藥真良方也楨按前二方因熱多寒少之溫瘧故以知母石膏黃芩互用若寒多則涼藥不可用矣其後和解湯乃和解三陽之瘧也仲景治傷寒熱病表症多者用辛溫散表裡熱多者用寒涼清裡若表裡俱見症者用一半散表一半清裡以雙解之若痰凝食滯者兼用化痰消滯之藥可見治傷寒如是治瘧疾外感症皆如是也陽明疸瘧內經名疸瘧仲景名溫瘧疸瘧之症但熱不寒少氣煩冤手足熱而欲吐嘔面赤口渴雖熱已而六脈沉數大者內經名熱傷陽明疸瘧之症仲景發明內經陽明疸瘧則曰身無寒骨節疼痛煩冤時嘔更其名曰溫瘧是也疸瘧之因夏秋暑熱之令熱氣傷人內經云陰氣先絶陽氣獨發此暑熱傷於陽經陽獨用事毫無陰寒故名曰疸熱瘧也疸瘧之脈六脈弦數少陽有熱若見洪長陽明有邪若見沉數里有熱結疸瘧之治仲景以脈平者用白虎加桂枝湯治太陽陽明家祕用桂枝黃芩湯兼治少陽陽明準繩於風邪瘧中補出三陽和解湯余於疸瘧中亦補立三陽和解法也白虎加桂枝湯治但熱無寒骨節疼痛時嘔之瘧知母甘草石膏粳米桂枝桂枝黃芩湯柴胡黃芩人參甘草半夏石膏知母桂枝陳皮南方熱令多用羌活以易桂枝按此二方以但熱故用知母石膏以骨節煩疼不得不用桂枝和營衛通其表裡此治陽明經之瘧又借太陽經之桂枝以治骨節煩疼以桂枝與石膏同用則桂枝藉石膏之涼不礙裡熱石膏藉桂枝之辛溫亦不礙表寒矣濕瘧即暑瘧濕熱瘧之症身體重痛肢節煩疼嘔逆脹滿胸膈不舒此濕熱瘧之症也濕熱瘧之因內經云因得秋氣汗出遇風及得之以浴水氣舍於皮膚之內與衛氣並居衛氣者晝日行於陽夜行於陰此氣得陽而外出得陰而內薄內外相薄則瘧日作濕熱瘧之脈若見浮緊表有寒濕若見浮緩乃是風濕若見弦數濕而兼熱濕熱瘧之治內經有其論仲景無其方楨意身體重痛肢節煩疼脈浮緊者羌活敗毒散右脈弦長嘔逆胸滿者柴葛平胃散六脈洪數濕熱者加味香薷飲調益元散羌活敗毒散治濕瘧表邪多有者羌活獨活柴胡前胡川芎桔梗枳殼陳皮甘草柴葛平胃散治濕瘧胸次不平者蒼朮厚朴陳皮甘草柴胡乾葛頭痛身痛加羌活無汗加防風加味香薷飲治暑濕之瘧香茹厚朴扁豆甘草川黃連肺熱疸瘧肺熱疸瘧之症發則陽氣盛而不衰故但熱而不寒令人消爍脫肉此內經肺素有熱之疸瘧症也肺熱疸瘧之因內經云肺素有熱熱盛於身因有所用力腠理開泄風寒舍於皮膚之內分肉之間邪盛於陽不涉於陰則但熱不寒而肺熱疸瘧之症作矣肺熱疸瘧之脈寸口洪而數洪則主陽數則主熱陽熱為患火來乘金陰虛陽亢消爍脫肉則發疸瘧肺熱疸瘧之治古人有論無方楨意用防風瀉白散以散舍於皮膚之風寒用石膏瀉白散以治肺素有熱用涼八味丸滋陰清肺以治陰虛陽亢消爍脫肉防風瀉白散治風寒舍於皮毛外束肺熱即瀉白散加防風石膏瀉白散治肺素有熱熱盛於身即瀉白散加石膏涼八味丸治陽亢陰虛消爍脫肉即六味地黃丸加知母黃柏腎經瘧腎經溫瘧之症肌肉消腦髓爍先見煩躁發熱躁狀畏人熱勢稍衰復返歸腎又見寒候此腎經冬受風寒溫瘧之症也腎經溫瘧之因冬受風寒藏於骨髓至春陽氣大發邪氣不能自出因遇大暑有所用力邪氣與汗皆出從內出外則始熱終寒乃成腎經瘧疾之症矣腎經溫瘧之脈尺脈多弦弦緊主寒弦數主熱浮弦外發沉弦內結腎經溫瘧之治內經有其論無其方楨意壯水之主急救其陰六味地黃湯加柴胡白芍藥獨活細辛以乙癸同源肝腎同治藉滋陰養腎之藥滋陰降火以治始熱佐以升散之藥升散伏寒以治終寒於理可通家祕溫瘧地黃湯治腎受冬寒至春夏始發之溫瘧熟地丹皮山藥白茯苓山茱萸澤瀉柴胡獨活白芍藥細辛風發瘧即金匱少陽熱瘧風發瘧之症熱極生風消渴易飢其脈弦數症兼少陽內經止有巨陽陽明症象而少陽之瘧惟以三陽俱虛暗為地步未曾明示故仲景特以瘧脈自弦弦數一條發明內經內外皆熱喘渴冷飲以著少陽風發瘧疾之症也風發瘧之因風屬東方甲乙風能勝濕風主乎燥風熱之邪挾少陽木火之勢傳入三陽之經而風發煩渴之症作矣風發瘧之脈瘧脈自弦弦浮風發弦數風熱風熱交作故曰風發風發瘧之治仲景以寒飲食消息之止其煩渴退其風熱今以知母石膏湯合小柴胡湯治之大便結者大柴胡湯下之知母石膏湯治少陽有熱無寒風發疸瘧也知母石膏粳米竹葉乾葛麥門冬甘草柴胡黃芩水煎沖梨汁一碗蔗漿一碗嘔者加蘆根汁小柴胡湯治少陽寒熱胸滿心煩喜嘔柴胡黃芩人參甘草生薑半夏加大棗水煎沖梨汁蔗漿大柴胡湯治瘧疾里症急不得不下者柴胡黃芩半夏陳皮甘草大黃細詳仲景寒飲食必是梨汁蔗漿瓜汁等但痰食凝滯於中不可用故補出三方治法也瘴瘧瘴瘧之症瘧發之時神識昏迷狂妄多言或聲音啞喑此瘴毒瘧疾之症也瘴瘧之因山嵐溪澗之間濕毒蒸釀之處瘴氣入人臟腑血聚上焦敗血瘀於心竅毒涎聚於肝脾則瘴毒瘧疾之症作矣瘴瘧之脈或大或小或見沉伏或見數大或見沉澀瘴瘧之治解方宜之毒消嵐瘴之氣治無一定之治方無一定之方當隨地以措方隨機以應變古不定方余亦未補方也內傷瘧疾牡瘧牡瘧之症即痰飲之瘧先寒後熱寒多熱少胸前滿悶欲吐不吐此涎飲牡瘧之症也牡瘧之因風寒之邪伏於心胃界分不得外出凝結痰涎作患則胸滿噁心之瘧作矣牡瘧之脈脈多弦滑弦主乎瘧滑主乎痰滑數熱痰沉弦飲結氣口沉實食痰兼雜牡瘧之治仲景治以蜀漆散牡蠣湯今豫推廣二條海石二陳湯常山草果飲蜀漆散仲景治牡瘧原方表無寒邪者蜀漆雲母龍骨牡蠣湯仲景治牡瘧原方表有寒邪者牡蠣麻黃甘草蜀漆四味以水先煮蜀漆麻黃去上沫納諸藥煮取溫服若吐則勿更服海石二陳湯家祕痰疾常方海石半夏陳皮甘草白茯苓胸前飽悶加草果蒼朮厚朴枳殼惡寒頭疼加羌活常山草果飲家祕治食痰之瘧常山草果半夏陳皮厚朴熟蒼朮甘草飽悶作痛加炒萊蔔子腹痛加枳殼瘧母瘧母之症即痰血瘧癖也瘧久不愈胸腹脅肋有癥瘕痞癖為患不瘥此瘧母之症也瘧母之因邪干臟腑凝結痰血假物成形憑陵為患則瘧疾不瘥而成瘧母之症矣瘧母之脈或牢或結或見沉弦或見沉滑沉弦瘧邪沉滑痰結沉實食積沉澀血結瘧母之治仲景用鱉甲煎丸瘧母丸陶氏加味二陳湯鱉甲煎丸仲景原方鱉甲烏扇黃芩柴胡鼠婦乾薑大黃芍藥桂枝葶藶石葦厚朴丹皮瞿麥紫葳半夏人參蟅蟲阿膠蜂窠赤硝蜣螂桃仁加味二陳湯即二陳湯加常山草果海石瓦楞子食積瘧即胃瘧食積瘧之症胸膈不利噫氣吞酸臨發胸前飽悶嘔吐不寧多發午後未申之時此食積瘧之症也食積瘧之因飲食過飽停積中宮或痰或飲互相交結偶遇六淫之邪內外交爭而食積瘧之症成矣食積瘧之脈滑實停滯滑數兼熱右手弦滑痰食之診左手弦滑瘧邪尚結食積瘧之治草果飲清脾飲枳朮湯香砂平胃散海石二陳湯常山飲草果飲治寒瘧初愈服此進食理脾草果紫蘇川芎青皮白芷甘草生薑氣不順加熟砂仁胸前飽悶加枳殼清脾飲治食滯太陰脾有痰飲寒熱發瘧之症青皮厚朴白朮草果柴胡黃芩茯苓半夏甘草加生薑大棗寒熱加柴胡惡寒發熱加羌活口乾加知母葛根天花粉枳朮湯治食積成瘧之方枳實白朮胸前飽悶加草果厚朴嘔加陳皮半夏香砂平胃散治食積胃家成瘧之症藿香蒼朮厚朴甘草熟砂仁嘔加葛根半夏海石二陳湯治中脘有痰之瘧海石陳皮甘草白茯苓熟半夏常山草果飲治痰積中脘胸滿不食嘔吐不飢胃家痰實之瘧常山草果半夏陳皮茯苓蒼朮厚朴甘草三瘧三瘧之症三陰經瘧也發於子午卯酉日者少陰瘧也發於寅申巳亥日者厥陰瘧也發於辰戌丑未日者太陰瘧也以其間兩日而發故名三瘧症也三瘧之因三陰經藏氣不和六淫之邪得以外入陰經屬臟臟主乎里而三日一發如陽經之瘧邪氣初入太陽其經主表其位主外是以一日一發若入陽明少陽則在肌肉之內其經稍深其發漸遲是以間日而發今乃邪入三陰其經深其發遲是以三日一發也三瘧之脈弦數多熱弦遲多寒弦滑者痰弦澀者血弦細者虛弦大者實左脈弦大表邪之別三瘧之治瘧在太陰經加減白朮膏在少陰經加減地黃湯在厥陰經加減逍遙散又有何首烏四味截瘧湯當歸補血湯乃通治三瘧之方也加減白朮膏此治太陰經瘧白朮當歸黃耆柴胡芍藥何首烏陳皮炙甘草加大棗肉同煎取膏惡寒加羌活升麻熱多加山梔黃芩知母寒多加生薑有痰加半夏口渴加乾葛日晏一日加升麻加減地黃湯治少陰經瘧熟地黃牡丹皮白茯苓山茱萸山藥澤瀉柴胡白芍藥熱多加山梔知母黃柏寒多加羌活獨活加減逍遙散治厥陰瘧當歸白朮柴胡陳皮白茯苓丹皮甘草山梔白芍藥熱多加黃芩寒多加生薑惡寒加羌活升麻四味截瘧湯治一切諸瘧何首烏五錢羌活二錢五分山楂肉一錢二分青皮七分上合煎露一夜臨發日五更溫好向東南服之當歸補血湯家祕治三陰久瘧不愈當歸黃耆柴胡白芍藥楨用此方治三陰經血虛之瘧當歸補血湯加柴胡芍藥以定寒熱此方不獨治瘧並治一切血虛發熱但邪盛者不可用遊瘧遊瘧之症先起三瘧後又加一發連發兩日只停一日如少陰經子午卯酉日之瘧至明日辰戌丑未又加一發此少陰之瘧餘邪遊入太陰又如辰戌丑未之瘧至明日寅申巳亥又加一發此太陰之瘧餘邪遊入厥陰故曰遊瘧之症也遊瘧之因其血氣虧損臟氣不足外邪客陰經三瘧乃作若瘧邪充盛則遊溢他經故連發二日止停一日俗名遊瘧也遊瘧之脈脈多細數或見沉細或見虛大或見弦滑或見沉伏遊瘧之治先治本經見症如厥陰之瘧先以加減逍遙散加升麻柴胡少陰之瘧加減地黃膏加升麻柴胡太陰之瘧以加減白朮膏加升麻柴胡提還本經則所遊之經自退古方皆不分經絡輒以補藥混投未當諸方俱在前三瘧症中加減逍遙散方見三瘧加減地黃膏方見三瘧加減白朮膏方見三瘧人傷風寒則惡寒發熱若得汗出則邪散身涼而愈今瘧疾始而惡寒繼而發熱繼而汗出身涼而愈但愈後或一日或間一日至其時而仍發者何也以其不比暴感之症但傷肌表瘧疾之邪漸積而成已經傷里非一寒熱汗出所能了其局至外邪深伏則為三瘧不論日數但看病邪若何如發時先見惡寒足冷此太陽之邪伏於陰分宜以羌獨敗毒散重加當歸芍藥提其血分之伏邪外解若久病人虛略加人參於羌獨方中則邪易散若見胸前飽悶則兼痰食加半夏厚朴青皮檳榔山楂同煎臨發清晨服若發時先見胸前飽悶嘔惡此名痰瘧用家祕草果飲消積化痰若見惡寒加羌獨升麻引拔內伏之邪外出此治瘧之真訣不獨三瘧凡瘧皆要散邪去根從來治三瘧不效者以其未得治伏邪之法不得拔去病根反用補塞閉竅遂至飲食阻滯變腫變脹不知瘧症不愈皆因痰結中焦葷腥不忌早服補藥所至余以散邪消滯補虛前後次序而用以見治瘧妙法先去病邪然後補元者例如外感痢久不愈非補塞太早即是失散表邪內傷痢久不愈非補塞太早即是失戒葷腥生冷故也夫不思飲食而瘧不愈宜消其痰食胃氣清和而熱自除人人知之能食而發熱不除禁其飲食不助熱邪而熱自減人所不知也此法不獨瘧疾凡是熱病及膏粱積熱疳火皆如是者附諸賢論王節齋云夏秋暑濕熱三氣傷於陽明胃家輕者即發為瘧等症重則伏而不發積久則發外感熱病若傷陽明大腸輕者即發霍亂泄瀉之症重則伏而不發煅煉煎熬而發赤白痢下矣又云瘧是暑風之邪治法宜發散又須分別陰分陽分以及新久新發者宜散表久病宜扶正為主虛人不可過服克削若陽分氣瘧多汗用黃耆人參白芍藥以斂之無汗用柴胡蒼朮葛根羌活黃芩以發之若陰分血瘧多汗用當歸白芍藥熟地黃黃柏黃耆以斂之若無汗用柴胡蒼朮川芎紅花升麻以發之楨按此皆言內傷瘧也若外感氣分瘧多汗當用桂枝石膏等以止之無汗當用麻黃川芎當歸等以發之薛立齋云瘧疾皆因先傷於暑次感於風客於營衛之間復遇風寒閉而不出舍於腸胃之外與營衛並行晝行於陽夜行於陰並則瘧作離則病退邪並於陰則寒邪並於陽則熱邪在表屬太陽則日作邪稍傳內在陽明少陽則間日作若深入三陰則三日一作邪走血分則日晏作邪走氣分則日早作準繩云仲景易老治瘧之法用於外因暑邪病在盛熱之時為宜若深秋悽清之候與七情痰食諸條尚未盡備故又廣諸治法然暑月之瘧必脈浮惡寒無口渴裡熱方可用麻桂羌活等表藥脈洪數長實無表邪有裡熱方可用白虎等涼藥脈沉實有便閉腹痛裡實症者方可用大柴胡承氣等下藥若脈細緩芤微四肢倦怠得之傷暑傷熱宜以清暑益氣湯十味香薷飲治之雖人參白虎尚不可用若內外俱熱引飲自汗熱退後其脈洪實如舊即處暑後單進白虎何害又曰溽暑時行瘧發時惡寒雖甚然實系熱邪再無虛寒之理經云陽並於陰則陰實而陽虛陰實者言邪在於陰非陰氣虛也陽虛者言陽邪內陷非陽氣虛也如陽明虛則寒栗鼓頷太陽虛則腰背頭項痛三陽皆虛則遍身骨節俱痛此之謂寒乃陰陽交爭互作之寒非真寒也方用柴胡升葛羌防以升舉陽氣之隨邪陷入陰中者使之返還陽分則惡寒自已以當歸紅花引入血分又以豬苓分利陰陽使其不復陷入陰中一劑可愈矣若寒一陳熱一陳者方用柴葛羌防以升舉陽氣使惡寒自已又以石膏知母黃芩清其里分之熱使其發熱自除更以穿山甲穿通經絡以豬苓分別陰陽不使交併復以甘草和之一劑而愈矣嘗考本草知母草果常山烏梅檳榔山甲等皆言治瘧以知母性寒入足陽明治獨盛之火熱草果性溫入足太陰治獨盛之惡寒二經合和則無陰陽交錯之患是以為君常山吐胸中結痰以定寒熱為臣烏梅檳榔除痰癖破滯氣為佐穿山甲出入陰陽穿通經絡為使甘草和諸藥此方乃脾胃家有郁痰伏飲者用之收功痢疾論秦子曰痢疾之症便下膿血或赤或白或黃或三色雜下裡急後重欲便而不得便既便而復登廁逼迫惱人若但瀉水穀不滯膿血此名水瀉而非痢疾矣痢疾要分外感內傷天行自感蓋夏秋外感時行之痢手足陽明腸胃二經主病者也三時內傷一人獨病之痢三陰脾腎主病者也從來前書混而立論未曾分別故余詳別外感四條內傷三條休息痢二條外感痢疾寒濕痢寒濕痢之症初起惡寒發熱身痛頭疼嘔吐不食不作渴痢下膿血或下黑水腹反不痛謹察時令無濕熱燥熱但有陰寒雨濕此寒濕痢症也身痛頭疼感於太陽嘔吐飽悶感於陽明寒熱往來感於少陽三陽不解傳入於裡在傷寒曰傳經之邪在痢疾曰風邪內縮從陽經傳入於裡之症也寒濕痢之因寒水濕土之政流衍卑監寒濕時行內氣不足乘虛感入郁遏營衛衛郁營泣內傳腸胃則水穀不化氣血與糟粕互相蒸釀而痢下赤白之症作矣寒濕痢之脈左脈浮緊太陽寒濕右脈浮大陽明寒濕寒濕內伏脈乃沉緊若是少陽脈見弦緊寒濕痢之治身痛發熱脈浮緊者宜用敗毒散辛溫散表嘔吐飽悶脈長者乾葛平胃散和胃寬胸小水不利者散表利濕五苓散不比燥熱痢禁利小便又不同燥熱痢妄用大黃又不可同濕熱痢誤用川連若寒涼大早則寒濕不散抑遏內縮傳入於內仍要先治外邪使之從表而出故寒濕痢必要先用表散者也敗毒散治風寒濕痢人參羌活獨活川芎柴胡前胡陳皮桔梗無汗加防風胸滿去人參加枳殼若飽悶不食嘔吐噁心此兼陽明胃病加後方平胃散家祕名敗毒平胃散乾葛平胃散治寒濕痢胸滿乾葛蒼朮厚朴廣皮甘草寒熱加柴胡頭痛身疼惡寒加羌活若惡寒身痛頭疼發熱此兼表邪者也加前方敗毒散家祕名平胃敗毒散五苓散白朮豬苓澤瀉桂枝白茯苓積痢不必利小便今因濕痢且五苓中有桂枝濕熱痢濕熱痢之症初起先水瀉後兩三日便下膿血濕氣勝腹不痛熱氣勝腹大痛肛門重滯裡急後重此外感濕熱症也若嘔吐不食目痛口渴濕熱傷陽明也惡寒發熱身痛頭疼濕熱傷太陽也寒熱往來脅痛口苦濕熱傷少陽也如三陽不解則濕熱內陷傳裡而成痢矣濕熱痢之因濕土之年君相二火行令天之濕氣下臨地之濕氣上升當長夏火令司政人在氣交之中受其蒸釀則日飲水穀不能運化與天行濕熱之氣互相鬱蒸則成赤白深黃三色之積濕鬱主否反似其燥而裡急後重努責不宣之症作矣濕熱痢之脈脈必數大浮數表熱沉數里熱表熱宜汗裡熱宜下洪大傷氣細數傷血濕熱痢之治若惡寒頭痛身熱有表邪者荊防解毒湯解表如無表邪當清裡腹痛後重酒煎大黃湯黃連枳殼湯香連丸六一散八正散通苓散分利等藥古人云濕熱下結分利甚捷不比燥熱痢禁發汗利小便者當遵流濕潤燥之法凡下痢紅積而腹不痛者濕傷血分也宜服河間黃連湯荊防解毒湯治濕熱痢初起表未解者荊芥防風薄荷連翹枳殼桔梗木通甘草加淡竹葉如有太陽症加羌活陽明症加乾葛少陽症加柴胡濕氣勝腹不痛加川芎蒼朮熱氣勝腹大痛加川連枳殼酒煎大黃湯治濕熱痢無表邪者川大黃酒煎去大黃服酒黃連枳殼湯治濕火傷於氣分川黃連枳殼陳皮甘草香連丸治濕火傷氣分下痢川黃連木香如肛門後重加枳殼小便不利加滑石嘔吐平胃散各半服之六一散滑石甘草八正散瞿麥滑石山梔木通甘草車前子澤瀉赤苓加淡竹葉通苓散治濕熱結於膀胱小水不利之症麥門冬淡竹葉車前子河間黃連湯治下痢血積腹反不痛濕熱傷於血分者川黃連當歸甘草此方用當歸似治燥傷血分矣不知用川連者乃治濕火也加當歸不過引川連以入血分耳若是燥火當用大黃潤燥之藥豈用川連苦燥之藥乎同一火痢也當分燥濕同一濕火之痢也當分傷氣傷血如濕火傷氣分則用香連丸濕火傷血分則用河間黃連湯余以大黃枳殼湯治燥火傷氣分之痢用大黃當歸湯治燥火傷血分之痢楨豈無師憶見哉蓋因濕火傷於氣分則煅煉而成白積故用川連枳殼湯濕火傷於血分則煅煉而成血積故用川連當歸湯燥熱痢燥熱痢之症內熱煩躁口燥舌乾腹痛頻並膿血稠黏枯涸難下肛門熱痛小便全無夜臥不寧此燥熱痢症也如口渴唇乾燥傷陽明也熱結膀胱燥傷太陽也寒熱口苦燥傷少陽也燥熱痢之因燥火之年赫曦流涸時當夏秋丙丁用事膀胱壬水已絶於已腎家癸水又絶於午子令母虛則庚辛肺與大腸互相交困金不生水反現燥金之火燥火傷氣則氣液凝聚而成白積燥火傷血則血液凝聚而成赤積氣血俱傷則成赤白之痢矣燥熱痢之脈脈必洪數浮數傷表沉數傷里洪數傷氣細數傷血浮沉皆數氣血皆傷燥熱痢之治燥傷血分者當歸大黃丸散熱清燥次用當歸銀花湯潤燥滋燥燥傷氣分者枳殼大黃湯合益元散燥熱退一味生津養血不比濕熱痢可用香連丸苦燥於前又不可用五苓散白朮散燥脾於後此症禁發汗利小便燥脾三條河間云下痢紅積腹中痛甚乃燥熱傷氣血也以芍藥黃連湯治之則知古人已發燥火痢矣非楨之杜撰也當歸大黃丸治燥傷血分下痢赤積腹中作痛當歸大黃應急下者合天水散應緩下者合戊己湯當歸銀花湯治燥火傷血涼血潤燥當歸銀花生地生甘草枳殼大黃湯治燥傷氣分下痢白積腹中作痛大黃枳殼桔梗甘草益元散即六一散河間芍藥黃連湯治燥熱氣血兩傷下痢腹痛者當歸大黃甘草赤芍藥川黃連氣滯者加木香檳榔疫痢有外感無內傷疫痢之症長幼相似沿門合境一齊發作下痢膿血或下純血或下黃水或下紫血水身熱頭痛胸滿不食此疫痢之症也疫痢之因運氣所主或流衍之紀雨濕連綿寒水時行或二火司政赫曦行令濕熱大作或燥金行令燥火時行三者皆成疫毒症此所謂天行病也疫痢之脈寒濕所傷脈多濡散或見微遲或一手脈伏脈若洪數濕熱之邪脈若躁疾燥火之診疫痢之治寒濕脈微者人參敗毒散脈伏者升麻葛根湯以升陽發散則脈自起若早用涼藥則疫毒內伏胸次不舒而脈愈不出矣待表邪已散然後分濕火燥火治之濕熱脈洪香連丸六一散滿悶不舒香連平胃散燥火脈數當歸銀花湯調六一散送下當歸大黃丸人參敗毒散羌活獨活柴胡前胡川芎人參甘草枳殼桔梗白茯苓升麻干根湯升麻乾葛甘草白芍藥香連丸川黃連木香香連平胃散川黃連木香熟蒼朮厚朴陳皮甘草當歸銀花湯當歸生地甘草銀花當歸大黃丸見前躁火痢門以上三陽之症系外感故與內傷諸痢不同內傷痢身熱脈大者死外感痢身熱脈大者吉沉細虛小者凶此脈不同也內傷痢其來也緩外感痢其發也暴此症之不同也外感三陽之痢久則亦入三陰然腸胃之熱傳入三陰者經雖屬陰症則屬陽如太陽之邪或傳少陰陽明之邪或傳太陰少陽之邪或傳厥陰此外感三陽不解陽邪傳入陰經之痢非內傷痢陰經自病也前書從未發明惟劉河間治厥陰動而瀉痢寸脈沉而遲手足厥逆甚則下部脈不至用升麻葛根湯小續命湯法云此表邪縮於內故下痢不止當散表邪布於四肢經絡外泄其表邪則臟腑自安後喻嘉言用敗毒及柴胡湯皆得此旨故治痢必要分外感內傷在表在裡無表邪單是里症可用清利之藥若有身熱惡寒頭痛胸滿等表症當散表邪不可清涼順下此治外感痢要訣也若疫痢則時行之毒更宜散邪故敗毒散為疫痢首方耳夏秋雨濕傷表治宜辛散世多忽之故余加意焉內傷痢疾七情痢七情內傷痢之症初起先見飲食難化後復大便不實時常清泄久久不愈漸下膿血宛似外感濕熱痢先水瀉復便膿但病來遲緩與外感暴發為異此即方書所謂脾泄痢內經所謂脾邪傳腎為賊邪症也七情內傷痢之因憂愁思慮則傷脾脾陰既傷則轉輸失職日飲水穀不能運化停積腸胃之中氣至其處則凝血流其處則泣氣凝血泣與稽留之水穀互相膠固則脾家壅滯而賊邪傳腎之症作矣七情內傷痢之脈脈必重虛虛大傷氣虛細血虧虛緩者生弦大者死弦而有胃尚可挽回弦多無胃必死不活七情內傷痢之治宜先用楂術膏兼補兼消助脾化積次用參苓白朮散補脾固本久瀉不止元氣下陷用補中益氣湯久瀉虛寒用理中湯歸脾湯治之滑泄不禁加固澀切不同外感痢誤用寒涼克削又不可補澀太早因此症虛中有滯補澀太早反助病氣矣如腎陽不足見陰冷之症用腎氣八味丸如腎陰不足見虛熱燥候六味丸與白朮散朝暮對服楂術膏治脾虛多食停積成痢之症白朮楂肉陳皮甘草煎膏服參苓白朮散補脾實脾虛痢方中必用人參白朮茯苓甘草山藥薏苡仁桔梗加蓮肉扁豆補中益氣湯治脾元虛弱久瀉下陷之症人參白朮黃耆當歸陳皮炙甘草升麻柴胡久滑不止加訶子肉果家祕加茯神棗仁以治久瀉傷陰不得安臥之症即合歸脾湯理中湯治虛寒瀉痢人參白朮炮薑甘草寒甚加附子有熱加川連歸脾湯人參白朮黃耆棗仁遠志白茯神木香甘草家祕加升麻柴胡以治元氣下陷之痢即合補中益氣湯八味丸補真陽不足益火之原以生脾土即六味丸加肉桂附子勞役痢勞役痢之症起於大勞之後下痢純血或腰背作楚脅肋作痛四肢倦怠嗜臥減食節勞稍緩勞重即發此勞役痢症也勞役痢之因起居不謹勞役無度或飢餓不節負重遠行營傷衛損則血下溜大腸而勞役內傷之症作矣勞役痢之脈必見虛損虛數傷血虛大傷氣虛緩者生數實者死勞役痢之治先用當歸活血湯生新去舊後用當歸補血湯調養氣血氣血和平用補中益氣湯歸脾湯扶元保本切不可兜澀太早又不可誤用苦寒當歸活血湯當歸紅花桃仁楂肉甘草牡丹皮血寒加黑炮薑見黑即止血熱加黑山梔世人但知見黑即止當明血寒血熱之別當歸補血湯當歸身黃耆筋脈痛加秦艽續斷中氣弱加人參白朮氣滿加陳皮木香補中益氣湯見前節七情內傷痢門歸脾湯見前七情痢門飲食痢飲食內傷痢之症胸前飽滿不思飲食腹痛脹滿或瀉下飧餿久久不愈或下膿血痛而欲痢痢後稍減或飲食太過即食積痢又有發積下痢痢下純血如腸風血者凡此飲食內傷痢也飲食內傷痢之因胃強脾弱過食傷脾損傷腸胃氣凝血泣停積於中與損傷之血互相膠結結久不愈而成赤白之積此飲食內傷痢也飲食內傷痢之脈多見滑大或見弦緊滑大實積弦小虛滯飲食內傷痢之治先用胃苓散健脾消積後用四君子湯異功散等以養脾切不可補澀太早又不可妄用苦寒必要認真是膏粱積熱方用三黃丸清利之若系冷食傷脾則五積散亦當用也劉河間云食入即瀉胃有宿食胃滿無餘地故即瀉也枳實湯家祕消積散治之酒入即瀉腸胃積熱胃熱之甚見酒性之熱乃尋竅下池也乾葛清胃湯主之若飲食傷脾久利純血家祕獨聖散胃苓散陳皮一兩蒼朮一兩厚朴五錢甘草二錢豬苓五錢白茯苓一兩澤瀉五錢白朮一兩家祕去豬苓澤瀉加山楂神麯各一兩四君子湯白朮人參白茯苓炙甘草異功散白朮人參真廣皮炙甘草白茯苓積氣未盡加楂肉腹痛加木香口渴加乾葛發熱加柴胡以上三法治脾虛成積之痢三黃丸治膏粱積熱大黃黃芩黃連氣滯加朮香五積散治寒積瀉痢蒼朮厚朴陳皮甘草乾薑桂心半夏枳殼枳實湯治腸胃停食厚朴陳皮麥芽陳枳實家祕消積散治飲食傷脾積痢不止蒼朮厚朴陳皮甘草神麯紅曲山楂鮮麥芽甘葛清胃湯乾葛升麻甘草山梔生地川黃連牡丹皮以上五法治食傷成積之痢家祕獨聖散山楂肉一斤研細末滾白湯調服服完即愈外感休息痢外感休息痢之症暴發熱痢而起後乃久久不愈或暫好一月半月旋覆發作纏綿不愈積滯不除此外感休息痢症也外感休息痢之因外感六淫之邪以成痢疾或失於解表或寒涼抑遏外邪或早食膏粱助其邪熱或補澀太早邪伏腸胃則成休息之痢矣外感休息痢之脈脈若見澀氣凝積滯或見沉滑食積未徹或見沉數內有積熱或見沉弦脾傷氣血外感休息痢之治脈澀滯者和氣四七湯脈沉滑者行積香連丸脈沉數者潑火散脈沉弦者助脾消積枳朮湯合保和丸久痢不止下純血家祕獨聖散煎湯服和氣四七湯治氣凝積滯枳殼厚朴陳皮紫蘇子紅積多加山楂肉白積多加炒神麯潑火散治火傷血痢之方川黃連赤芍藥地榆青皮甘草枳朮丸合保和丸可治休息痢陳枳實白朮保和丸治食積痢萊蔔子楂肉神麯麥芽陳皮甘草獨聖湯家祕治小兒下紅積産婦血痢神效楂肉一斤研末每服二兩煎湯服內傷休息痢內傷休息痢之症無外感之邪非暴發暴痢之症但因脾胃虧損漸成積痢或發或止經年不愈此內傷休息痢症也內傷休息痢之因或因勞心過度思慮傷脾或因胃強脾弱飲食傷損或因寒涼不謹腸胃受傷脾腎相傳則內傷休息之痢作矣內傷休息痢之脈脈見弦細思慮所傷或見虛大脾氣虧損或見細澀脾血有傷或見沉弦食積傷脾或見遲弦寒涼傷損內傷休息痢之治思慮傷脾者歸脾湯飲食傷脾者枳朮丸大安丸家祕消積散楂術膏寒瀉不禁者理中湯錢氏異功散歸脾湯見前七情痢枳朮丸見前章大安丸治飲食傷脾內傷積痢楂肉神麯半夏白茯苓萊蔔子陳皮連翹白朮家祕消積散治飲食傷脾積痢不止神效蒼朮一兩飯上蒸厚朴五錢陳皮五錢甘草三錢神麯二兩炒紅曲一兩楂肉四兩麥芽一兩炒上為細末白湯服楂術膏治脾虛不能運化助脾消積楂肉白朮陳皮甘草理中湯見前七情痢錢氏異功散治脾元不足有痢無積久不愈者白朮人參陳皮白茯苓炙甘草木香訶子肉果凡痢第一要戒葷腥外感痢不論日久第一要先散表邪若風寒寒濕而見太陽表症羌獨敗毒散兼見陽明少陽者羌防柴葛湯若胸次不寬兼平胃保和散若內傷之痢不帶外感則不用表藥若下純紅者治以家祕獨聖散或煎湯頻服赤白相雜者家祕消積散積滯未除脾氣已虛大安丸作散白湯調服大凡病症各有分別例如咳嗽吐血水腫痛痹筋攣痙痿以外感為輕內傷為重若泄瀉痢疾則以內傷為輕外感為重故發熱泄痢者常有不治夫外感之邪必要仍從毛竅而出凡病一見表邪起影即當先散表邪如內傷痢兼見外邪必當先散表邪夫痢本於內傷但夏秋時行疫痢乃是疫毒致病內傷者一人自作之孽疫症者天災流行之病也古人立敗毒散以治外感疫毒最為妙訣乙酉年夏秋多雨連次風潮後發疫痢惡寒身痛發熱嘔吐病形相似服寒藥多有變症時余酌一方表症甚者重用敗毒散佐以蒼朴名敗毒平胃散胸次不寬里症甚者重用平胃散佐以羌獨柴胡名平胃敗毒散隨手取效此係寒濕之邪傷人肌表侵入腸胃而成有表邪之疫痢也又於丁卯年夏秋亢旱赤日燥裂沿門合境下痢赤積腹痛頻並肛門如火積滯難出用香連丸等痢勢反加余因悟燥火傷血不比濕火同治香連丸治濕火傷氣之藥遂化立當歸大黃湯清血分之燥火血積潛消頃刻平安此係燥火之邪傷人口鼻直入腸胃而成無表之疫痢也同一外感而有表症無表症天壤各別同一火而濕火燥火傷氣傷血治各不同又如乙未年三時雨濕熱令陰寒深秋多發頭痛身痛胸滿寒熱之症早用寒涼生冷則胸前凝結不能敷布作汗死者比比余亦以乙酉治痢法用敗毒平胃散則胸寬汗出而愈夫治痢而因雨濕陰寒用敗毒平胃表散取效此從時行外感寒熱病中化出治法今治外感寒熱病又以陰寒雨濕治痢之敗毒平胃散散表此因天災流行皆系毛竅口鼻從外感入之表邪必要仍從毛竅肌表而出痢疾與寒熱病症雖別而發散表邪彼此可以悟用是以時行暑熱燥火無表邪有裡熱之症而用清裡之法亦可化用治暑熱燥火時行之痢矣因此悟得發癍之症皆因邪火傷血然濕火傷血則大便滑泄家祕用川連枳殼木通分利二便若燥火傷血而大便乾結方書用當歸大黃丸清血中之火而潤大便祕結余今以下痢純血腹痛之痢化用此方以清血中燥火反止大腸下痢彼此互發隨處生花以聞後人妙悟泄瀉論秦子曰泄瀉之症或瀉白或瀉黃或瀉清水或瀉水穀不雜膿血名曰泄瀉若帶稠黏之積則是痢疾而非泄瀉之症矣今列外感五條內傷五條又五更泄瀉五條外感泄瀉外感風瀉風瀉之症自汗頭汗惡風發熱頭痛額疼瀉下水穀或下清水此傷風飧泄之症也風瀉之因風邪入於腸胃之間則有泄瀉之患經云春傷於風夏必飧泄此即風邪內陷之症也風瀉之脈多浮而弦左關浮弦風木之邪大腸脈浮乃是腸風右關脈浮胃風之診風瀉之治左關浮弦柴胡防風湯調五苓散大腸脈弦風入陽明乾葛防風湯調下六一散右關脈弦風邪入胃防葛湯調胃苓散總之有表當散表表既散當分利小便風散濕去則瀉自止柴胡防風湯柴胡防風荊芥羌活川芎乾葛陳皮甘草五苓散白朮澤瀉豬苓肉桂白茯苓乾葛防風湯乾葛防風荊芥羌活川芎枳殼甘草六一散滑石甘草防風湯防風葛根胃苓散蒼朮厚朴陳皮甘草白朮白茯苓澤瀉豬苓肉桂外感寒邪瀉寒瀉之症惡寒身痛不發熱口不渴小便清白腹中疼痛泄瀉水穀此寒邪直中三陰經之寒瀉症也若惡寒身痛身反發熱口反渴此寒傷三陽經之熱瀉症也寒瀉之因真陽素虛偶值時令之寒直中三陰之經則身不發熱口不發渴小便清利腹中疼痛而中寒下利之症作矣若腸胃有熱外寒束於皮毛內熱不得發泄則寒變為熱而成傷寒熱利之症矣寒瀉之脈右關沉遲寒中太陰左尺沉遲寒中少陰左關沉遲寒中厥陰若身熱脈浮緊寒傷太陽也身熱脈浮弦寒傷少陽也身熱脈長右寸關獨大寒傷陽明也寒瀉之治三陰寒瀉理中湯四逆湯真武湯主之寒傷三陽熱瀉應解表太陽羌活湯陽明葛根湯少陽小柴胡湯應清熱者葛根黃芩黃連湯黃芩湯主之理中湯見前四逆湯見前真武湯生薑白朮附子白芍藥白茯苓羌活湯羌活防風川芎黃芩蒼朮白芷葛根湯葛根桂枝芍藥甘草麻黃有汗去麻黃無汗面赤加白芷寒熱加柴胡裡熱加黃芩身痛加羌活小便不通加木通車前子小柴胡湯柴胡黃芩陳皮人參半夏甘草葛根黃芩黃連湯葛根黃芩黃連甘草黃芩湯黃芩大棗甘草白芍藥外感中暑瀉中暑瀉之症時值夏秋之令忽然腹痛煩悶口渴板齒乾焦暴瀉糞水腸鳴飧泄痛瀉交作此暑熱之症也中暑瀉之因火令當權天之熱氣下降地之濕氣上升暑濕之氣充塞宇內人感熱淫之邪傷於腸胃暑瀉作矣中暑瀉之脈虛細中暑洪滑中熱濡散暑濕促結鬱熱中暑瀉之治宜清理暑濕分利陰陽脈虛細藿香參橘煎調服六一散脈洪滑熱重者黃連香薷飲調服六一散熱輕者木通湯調下六一散胸次不舒平胃六一散參橘煎人參橘紅藿香三味同煎黃連香薷飲黃連香薷厚朴扁豆甘草平胃六一散蒼朮厚朴陳皮甘草滑石外感中熱瀉中熱瀉之症發熱口渴唇乾齒燥面赤煩躁小便赤澀小腹中一泛即瀉一瀉即止少頃復痛後瀉肛門如火糞色多黃此火熱瀉症也中熱瀉之因熱淫以勝濕火炎蒸積熱之人又中邪熱則中熱泄瀉作矣中熱瀉之脈浮大而數熱中在表若見沉數熱中在裡數而實者中熱之重數而不實中熱之輕中熱瀉之治熱在表柴葛芩連湯熱在裡家祕枳殼黃連湯家祕木通黃芩湯調六一散二便皆滯八正散柴葛芩連湯柴胡乾葛黃芩川連四味同煎服家祕枳殼黃連湯川連枳殼木通甘草八正散瞿麥滑石木通萹蓄甘草車前子山梔赤茯苓應下者加大黃外感濕瀉濕瀉之症瀉水腸鳴腹反不痛身重身痛或嘔而不渴此濕氣泄瀉也濕瀉之因久雨陰濕濕土司政太陰被濕淫所傷人病泄瀉濕瀉之脈多見濡軟或見細澀或見浮緩濕瀉之治宜燥濕利小便胃苓散平胃散身痛身熱脈浮應汗者敗毒散羌活勝濕湯小便不利木通煎調五苓散或生薑湯調六一散利小便則濕自去而瀉自止胃苓散見前風瀉門平胃散蒼朮厚朴陳皮甘草敗毒散見寒濕腫門羌活勝濕湯蒼朮防風羌活黃柏澤瀉白茯苓陳皮甘草寒濕加生薑濕熱加黃連五苓散六一散二方俱見風瀉門內傷泄瀉積熱泄瀉積熱泄瀉之症發熱口渴肚腹皮熱時或疼痛小便赤澀瀉下黃沫肛門重滯時結時瀉此積熱泄瀉之症也積熱泄瀉之因膏粱厚味酒濕辛辣香燥之物時積於中積濕成熱熱蒸於胃下傳大腸積熱之瀉成矣積熱泄瀉之脈脈必沉數沉則為積數則為熱右脈沉數積熱在氣左脈沉數積熱在血積熱內伏脈乃促結積熱泄瀉之治若右脈數大宜以黃連枳殼湯加六一散清其腸胃兼腹痛欲便而不得便者大黃枳殼湯或加玄明粉此通因通用之法也如元氣虛而積熱又甚應清者黃連枳殼湯加人參應下者大黃枳殼湯加人參若左關脈數龍膽瀉肝湯右關脈數清胃湯黃連枳殼湯黃連枳殼厚朴陳皮甘草木通煎八分沖調六一散三錢大黃枳殼湯大黃枳殼厚朴陳皮甘草木通調服六一散三錢龍膽瀉肝湯黃連山梔黃芩柴胡青皮龍膽草木通甘草丹皮生地當歸白芍藥清胃湯升麻黃連山梔甘草積寒泄瀉積寒泄瀉之症腹中綿綿作痛小便不赤口唇不幹瀉下清白鴨溏之色此積寒泄瀉之症也積寒泄瀉之因或食冷物以傷腸胃則下流大腸或形寒飲冷以傷肺氣則下遺大腸陽明太陰受寒皆成寒積之瀉積寒泄瀉之脈沉細而遲或沉而弦或沉而結右關沉遲腸胃積寒右寸沉遲寒飲傷肺積寒泄瀉之治寒積內滯者草蔻丸腸胃虛冷宜理中湯甚者補中湯肺受寒冷宜養肺湯草蔻丸見胃痛理中湯人參白朮炮薑炙甘草補中湯人參白朮炮薑炙甘草丁香養肺湯即生脈散加黃耆當歸紫菀甘草痰積泄瀉痰積瀉之症或瀉或止或多或少或下白膠如蛋白腹中漉漉有聲或如雷鳴或兩肋攻刺作痛此痰積泄瀉也痰積瀉之因飲食過當或食後即臥或肥甘縱口或臨食粗咽磨化漸難遂成痰積下溜大腸則成泄瀉之症矣痰積瀉之脈或見弦滑弦主寒飲滑主痰結弦滑而數痰兼積熱痰積瀉之治二陳平胃散脈滑實者導痰湯有下症者加大黃玄明粉通因通用又有痰積在肺肺移於大腸清肺經之痰則大腸之瀉自止用節齋化痰丸二陳平胃散即平胃散加半夏茯苓導痰湯半夏南星橘紅枳殼甘草赤茯苓海石生薑應下者或加大黃或玄明粉節齋化痰丸本治痰嗽之方家祕用治痰瀉海石一兩青黛五錢橘紅一兩桔梗一兩連翹一兩栝蔞霜一兩芒硝五錢黃芩一兩香附一兩天門冬一兩痰凝上焦加半夏通因通用入芒硝食積泄瀉食積瀉之症腹痛即瀉瀉後即減少頃復痛瀉腹皮扛起或成塊成條瀉下臭如敗卵此食積泄瀉之症也食積瀉之因飲食自倍膏粱縱口損傷脾胃不能消化則成食積泄瀉之症食積瀉之脈右脈沉滑或見沉數或見沉弦沉數熱積沉弦寒積食積瀉之治宜消痰者保和丸枳朮丸熱積脈數宜清者梔連平胃散宜下者大小承氣湯寒積脈遲宜溫者紅丸子寒積脈實宜下者煮黃丸保和丸山楂神麯半夏茯苓連翹萊蔔子陳皮枳朮丸枳殼白朮梔連平胃散即平胃散加梔連承氣湯見前傷寒紅丸子陳皮乾薑胡椒荊三稜莪朮煮黃丸雄黃巴霜脾虛泄瀉脾虛瀉之症身弱怯冷面色痿黃手足皆冷四肢倦怠不思飲食時時瀉薄此脾虛瀉也脾虛瀉之因脾氣素虛或大病後過服寒冷或飲食不節勞傷脾胃皆成脾虛泄瀉之症脾虛瀉之脈脈多微弱或遲而緩或遲而澀和緩易治弦急為逆脾虛瀉之治宜理中湯四君子湯參朮膏參苓白朮散腎陽虛八味丸補水之火以生助脾元理中湯見前寒積門四君子湯見前脾虛咳嗽門參朮膏人參白朮參苓白朮散人參白朮扁豆蓮肉薏仁白茯苓山藥桔梗乾葛八味丸生地丹皮萸肉澤瀉山藥白茯苓肉桂附子附五更泄瀉按五更泄瀉多屬腎虛然亦有酒積寒積食積肝火之不同病機既多變化用藥尤貴圓通茲復明列五條以備臨症之用云腎虛五更泄瀉腎虛瀉之症每至五更即連次而瀉或當臍作痛痛連腰背腹冷膝冷此腎虛泄瀉之症也腎虛瀉之因真陽不足腎經虛寒火不能生土腎主閉藏腎虛則封閉之令不行腎主五更至此時則發瀉也腎虛瀉之脈或兩尺浮大虛陽外浮按之細小腎氣不足右關弦大脾氣不足右尺虛軟真火不足腎虛瀉之治尺脈細小火不生土者腎氣丸尺中皆軟脾腎俱虛者五味子丸八味腎氣丸生地丹皮澤瀉山藥萸肉白茯苓肉桂附子五味子丸人參白朮山藥五味子補骨脂肉果益智仁酒積五更泄瀉酒積瀉之症每至五更腹中作痛痛而後利利下黃沫小便赤色或如米泔此酒積泄瀉之症也酒積瀉之因其人浩飲失度或飲冷酒傷其腸胃濕熱之氣蒸釀於中積溫成熱火生寅卯則五更發泄矣酒積瀉之脈多見洪數或見弦數酒積若甚脈見促結右脈洪數酒熱傷胃左脈洪數酒熱入膽酒積瀉之治平胃四苓散加乾葛黃柏腹痛家祕川連枳殼湯平胃四苓散蒼朮厚朴陳皮甘草白朮白茯苓澤瀉豬苓乾葛黃柏胸次不寬加砂仁白豆蔻家祕川連枳殼湯治濕熱瀉利黃連枳殼木通厚朴甘草口乾加乾葛腹痛應下者加大黃玄明粉寒積五更泄瀉寒積瀉之症每至五更則綿綿而痛時欲大便便而滑利糞色淡白而不黃此寒積泄瀉之症也寒積瀉之因或形寒飲冷傷其太陰脾肺畏寒結成寒積寒積中州至天明每多發瀉寒積瀉之脈六脈皆遲遲而不弦中氣虛寒遲而弦緊沉積痼冷遲而弦滑寒積內結寒積瀉之治中氣虛弱不能多食脈遲和軟理中湯寒傷太陰腹冷如冰通白四逆湯寒積實滯凝結作患煮黃丸下之理中湯見前食積嘔吐門通白四逆湯炙甘草熟附子乾薑蔥白煮黃丸見前食積五更泄瀉食積瀉之症每至五更則腹中作痛腹皮扛起痛而欲利利後稍減俗名並肚瀉此食積泄瀉之症也食積瀉之因飲食自倍勞動脾元損傷胃氣脾胃交傷則水穀不化而食積泄瀉之症作矣食積瀉之脈右關沉滑乃是食積若見沉數此為熱積若見沉緊乃是寒積食積瀉之治加減保和丸熱積應下者承氣湯寒積應下者煮黃丸加減保和丸麥芽楂肉枳實蒼朮厚朴萊蔔子陳皮脾虛加白朮熱積加川連寒積加炮薑氣滯加木香承氣湯枳實厚朴大黃煮黃丸見前肝火五更泄瀉肝火瀉之症脅肋常痛痛連小腹夜多不寐每至五更小腹左角一泛急欲登廁火性急速一瀉即止此肝火泄瀉之症也肝火瀉之因或惱怒傷肝肝氣怫逆或積熱在內肝膽不寧肝主施泄木旺寅卯至五更生旺之時則肝火發泄而瀉作矣肝火瀉之脈左關洪大肝火之診左脈弦長亦主肝實弦為木象數則為熱右脈弦數木火乘土肝火瀉之治龍膽瀉肝湯左金丸柴胡梔連湯木火乘脾梔連戊己湯加味逍遙散去當歸丹皮龍膽瀉肝湯柴胡黃芩山梔知母麥冬黃連人參膽草甘草大黃左金丸黃連吳茱萸二味同研柴胡梔連湯柴胡黃芩陳皮甘草川連山梔梔連戊己湯治肝火入太陰泄瀉加味逍遙散去當歸丹皮附録食瀉脾氣久虛不受飲食者食畢即腸鳴腹急盡下所食之物方快不食則無事經年纍月此録食瀉之症宜快脾丸主之五味丸亦主之此症湯藥下咽即時下泄與直腸之症相似但直腸之症急症暴症録食之瀉久病緩病故直腸條內則曰難治録食瀉仍立方治然皆是改常之症也按食入即瀉有寒熱虛實之別脾胃積熱火性急速則食入即瀉河間云食入即瀉腸胃填滿無容物之地故也梔連平胃散酒入即瀉腸胃熱甚復得酒性之熱則尋竅下瀉也川連枳殼湯加木通乾葛此濕熱之瀉也快脾丸五味丸主之夫脾胃虛寒而泄瀉人人知之脾胃實熱而瀉有不知者大凡著書立説不能盡舉有虛寒一條即有實熱一條故著積熱食積之脾實熱瀉隨著脾虛脾寒之不足瀉則虛實並著學者可以類推矣附諸賢論準繩云用收澀以治滑須分熱滑寒滑寒滑可以收斂熱滑未宜收也如瀉已愈至明年此月日復發者有積根於中如痢症休息痢相等看然亦分熱積寒積治之熱積寒下寒積溫下真元不足佐以補元之藥脾虛不運大安丸以助脾趙以德云泄瀉寒脫而虛殆似絶者急灸氣海飲人參膏而愈治腎虛不能司禁閉者腎氣丸峻補其腎痰積在肺肺氣下降大腸不禁者清上焦之痰則肺氣清而大腸之瀉自愈治思慮傷脾脾氣鬱結不能升舉陷入下焦而泄瀉者開其鬱結升舉清陽之氣東垣云凡瀉而水穀不化謂之飧泄乃清氣不升古人皆以升浮之味升舉胃氣脾胃清和則水穀消而濕自化不比治濕利小便在下者引而竭之之例故曰胃中濕勝而成泄瀉宜助甲膽以風勝之人但知脾病惡濕利濕則瀉自止不知久瀉傳虛脾胃之清氣下陷者反用升舉清陽之氣鼓舞脾胃之妙也內經云小便不利無問標本先利小便又云諸泄利小便不利先分利之又云治濕不利小便非其治也此正在下者引而竭之之法但可治濕氣侵入初病暴病者若漫用之則降而又降脾胃失陽和之令而陰陽愈不能分泄矣戴氏曰瀉水腹不痛者濕也若瀉勢緩慢瀉次勻下完穀不化脾虛也瀉水腹痛瀉次不均痛一陳瀉一陳火也或多或少腸鳴漉漉者痰也腹皮成條扛起痛而欲利利後稍減者食積也又按之張三錫曰泄瀉之症濕火痰虛暑積風冷八者之殊必以滲濕燥脾為主而隨症加減濕則利之火則清之寒則溫之虛則補之痰則豁之暑則祛之瀉則消之風則散之此其大法也八症既明三虛宜講三虛者脾虛腎虛肝虛也脾主制水飲食傷脾則不能運化水穀而成泄瀉腎主閉藏色欲傷腎則失封閉之權而成瀉肝主施泄惱怒傷肝則木能剋土而彰施泄之令三者皆令泄瀉然肝腎二經不恆見惟脾家泄瀉者為多夫人飲食偶傷便令泄瀉又嘗論泄瀉瘧痢同乎一源皆由暑月傷脾初傷便作泄瀉為輕停滯既久而作瘧作痢者重而瘧與痢又有分別飲食傷脾成痰充塞胸膈則為瘧飲食成積膠乎腸胃則為痢故曰無痰不成瘧無積不成痢夫泄瀉瘧痢之由不一而足此只論飲食傷脾而成泄瀉瘧痢耳節齋曰瀉本屬濕多因飲食不節損傷脾胃而作須看時令寒熱燥濕患病新久虛實而治大法滲濕補脾消導分利若久病脾虛下陷宜以風藥升提腸胃虛滑又當補澀霍亂論秦子曰霍亂之症心腹絞痛上吐下瀉躁亂煩悶甚者轉筋以經絡而論主於陽明腸胃若但吐利而無腹痛煩亂之類乃吐利非霍亂也今列外感者六內傷者四其有外感內傷兼見者則於治法中詳之外感霍亂濕氣霍亂濕氣霍亂之症既非飲食所傷無七情惱怒但因時令濕淫之氣一旦揮霍撩亂吐瀉水飲此外感歲土濕鬱之症內經云太陰所至土鬱之發民病霍亂嘔吐注下即此症也濕氣霍亂之因濕土司政從氣太過脾胃主土惡濕喜燥今以濕土之氣太過中州受傷遂成此症濕氣霍亂之脈或見沉伏或見促止或見代結或見濡軟濕氣霍亂之治仲景用五苓散今推廣平胃散正氣散加青藿香若應汗者防風勝濕湯五苓散治不吐下瀉白朮豬苓澤瀉肉桂白茯苓平胃散見濕瀉門治胃家作嘔不換金正氣散治表邪發熱蒼朮厚朴陳皮甘草木香鮮藿香防風勝濕湯防風荊芥蒼朮白芷羌活川芎風氣霍亂風氣霍亂之症無飲食內傷七情惱怒但因時令風淫頭痛身熱上吐下瀉心腹絞痛甚則轉筋此風木太過之症內經云歲不及風乃大行民病霍亂飧泄即此症也風氣霍亂之因歲土不及風木太過來克中土則風淫木賊水穀不化而霍亂餐泄作矣風氣霍亂之脈浮緊風寒浮數風熱浮濡風濕左關脈浮風木之邪右關脈浮土受木賊風氣霍亂之治風寒敗毒散風熱家祕神術湯風濕海藏神術湯風木之邪柴胡防風湯內兼食滯者荊防平胃散防風敗毒散荊芥防風羌活獨活川芎枳殼陳皮葛根甘草家祕神術湯蒼朮防風石膏三味同煎海藏神術湯蒼朮防風柴胡防風湯柴胡防風羌活荊芥防風湯治表裡兩兼之症荊芥防風蒼朮厚朴陳皮甘草熱氣霍亂熱氣霍亂之症時值濕熱心腹絞痛上吐下瀉煩悶擾亂昏不知人此熱淫所勝之霍亂也熱氣霍亂之因暑熱行令歲土混濁揮霍撩亂即內經所云歲土不及時有熱至則霍亂吐瀉也熱氣霍亂之脈少見洪數或見沉數或見促止或見躁疾熱氣霍亂之治清暑益元散家祕甘露飲黃連香薷飲煎熱沖益元散服內兼停滯梔連平胃散清暑益元散香薷鮮藿香煎湯調六一散家祕甘露飲人參薄荷葛根滑石澤瀉鮮藿香甘草白茯苓麥門冬水煎冷飲黃連香薷飲見中熱梔連平胃散見口眼喎斜厄逆寒氣霍亂寒氣霍亂之症時值暴寒惡寒身痛腹痛吐利唇青爪青此寒氣霍亂即仲景三陰經寒霍亂症也寒氣霍亂之因陽氣素虛中氣不足偶值時令寒邪直中三陰則陰寒霍亂之症作矣寒氣霍亂之脈脈多沉遲或見沉伏或見沉緊寒重陽竭六脈不至寒氣霍亂之治太陰霍亂理中溫補中湯少陰厥陰霍亂四逆湯內有停滯者治中湯理中湯見前加陳皮青皮名治中湯補中湯白朮人參乾薑茯苓陳皮甘草薑附四君子湯乾薑附子人參白朮茯苓炙甘草四逆湯甘草乾薑附子楨按張戴人曰霍亂之症皆風濕暍三氣之邪脾土被風木所克鬱則熱乃發火炎上故嘔吐嘔吐者暍也濕土下注故注泄者濕也風急甚則轉筋轉筋者風也此三條即發內經土鬱之發則霍亂下注風乃大行則霍亂飧泄有熱至則霍亂吐下之三條也明理論敘仲景用理中湯四逆湯治傷寒霍亂此正論寒邪直中三陰經陰症霍亂也內傷霍亂痰飲霍亂痰飲霍亂之症先胸前懊憹不舒心脅下悶痛時時欲嘔兀兀欲吐或時腹如雷鳴或時怔忡驚悸忽爾嘔瀉胸腹大痛此痰飲霍亂也痰飲霍亂之因脾氣素虛水飲不節起居不謹鬱結成痰聚於中脘阻其升降之路嘔利交作遂成痰飲霍亂之症痰飲霍亂之脈脈多滑大沉滑痰飲滑數痰熱或見沉弦或見伏結痰飲霍亂之治嘔多者屬上焦二陳湯平胃散加鮮藿香葉瀉多者屬下焦導痰湯外冒三氣者兼風濕熱三氣治之二陳湯見中暑瀉平胃散見濕瀉導痰湯見痰積瀉食氣霍亂食氣霍亂之症胸前飽悶脹痛噯氣吐瀉交作嘔出食物瀉下酸餿此食氣霍亂之症食氣霍亂之因飲食過飽損傷中氣不能運化膏粱厚味腸胃凝泣清氣不升濁氣不降又值風暑濕暍之邪外襲則揮霍撩亂此症患者獨多食氣霍亂之脈或見滑大或見沉實填塞太倉脈反沉伏食氣霍亂之治在上因而越之當用鹽湯探吐之在中者枳朴平胃散消之在下者因而竭之枳朴大黃湯下之挾六氣觸發原隨六氣散表寒用溫散熱用涼散風則祛風濕則利濕暑用清暑溫散敗毒散清散沖和湯枳朴平胃散枳實厚朴蒼朮陳皮甘草枳朴大黃湯見痰飲門羌獨敗毒散見痧脹腹痛羌活沖和湯見寒邪瀉外感霍亂轉筋轉筋之症霍亂後腿筋收引甚則轉折攣縮遍身疼痛難忍俗名抽筋瀉此乃外感轉筋症也轉筋之因陽明主束骨而利關節潤養宗筋今因外感風寒暑濕暍熱之氣一時暴吐暴下宗筋失養外感之邪又束其故熱無從發泄則筋轉而抽痛矣轉筋之脈脈多微澀或代而散或隱而伏不可凶斷轉筋之治宜祛風濕清暑暍風勝者平胃散加荊芥防風木瓜秦艽濕勝者平胃散加秦艽木瓜暍氣勝者清暑湯轉筋主陽明倍用木瓜秦艽轉筋雖主乎火若外有風寒所束或無汗脈伏忌用木瓜秦艽酸收之味又忌寒涼抑渴必用羌獨敗毒散發表平胃散見腹痛清暑益氣湯見咳嗽羌獨敗毒散見痧脹腹痛內傷霍亂轉筋轉筋之症四肢牽引筋急抽搐痛不甚痛見於霍亂之後較之外感轉筋則緩而不暴者也轉筋之因吐瀉太多津液暴亡不能榮養筋脈則筋急而搐矣轉筋之脈多見細數或見空大或見雙弦轉筋之治補肝散加木瓜秦艽活血散加木瓜秦艽內傷轉筋主肝經者多故宜養血生津舒筋活血人參竹瀝湯最妙兼治痰霍亂轉筋外冒三氣兼用風濕熱治之補肝散川芎陳皮生薑防風當歸身白芍藥羌活木瓜秦艽活血散當歸白芍熟地川芎蒼朮黃柏秦艽木瓜人參竹瀝湯見中風門外感霍亂煩渴外感煩渴之症霍亂吐瀉後心下煩悶渴而引飲唇口乾燥熱能消水此陽火內傷之症也外感煩渴之因夏秋之交暑熱傷人吐下交作上下分消則煩渴作矣外感煩渴之脈脈多沉滑或見沉數或見躁疾外感煩渴之治知母石膏湯或葛根清胃湯人參白虎湯或兼清肺飲止渴湯知母石膏湯知母石膏麥冬甘草粳米竹瀝加燈心虛人加人參渴甚加天花粉葛根清胃湯黃連葛根升麻甘草生地山梔丹皮渴甚加石膏人參知母花粉人參白虎湯人參石膏知母麥冬甘草水煎沖梨汁半杯溫服止渴湯人參麥冬茯苓桔梗花粉葛根澤瀉甘草內傷霍亂煩渴內傷煩渴之症吐瀉後心煩而渴渴不引飲不能消水干在口而唇舌不幹此因傷亡津液之症也內傷煩渴之因大吐瀉後重亡津液陰亡神躁意亂煩心則有內傷煩渴之症矣內傷煩渴之脈沉細而軟或見躁疾或沉細而數或浮大而空內傷煩渴之治脈若細軟人參生脈散人參竹瀝湯脈細而數六味地黃丸脈浮大而空獨參湯人參生脈散人參麥冬北五味人參竹瀝湯人參湯沖竹瀝服六味地黃丸見前附乾霍亂即絞腸痧乾霍亂之症身熱煩悶胸腹絞痛手足逆冷升降不通不吐不瀉名乾霍亂症也乾霍亂之因積溫成熟積熱成燥又感時行燥熱之氣外蒸內釀燥甚於中不得流利則上不得吐下不得瀉而成乾霍亂之症也乾霍亂之脈脈多沉伏或見洪數或見滑大或見沉數乾霍亂之治上焦痛多用冷鹽湯以探吐中焦痛多急刺委中穴少商穴並刺十指出血煎藿香湯調益元散以滑順大腸若脈沉伏再用氣藥疏通經絡藿香湯調六一散溫服附諸賢霍亂論劉河間云吐下霍亂三焦為水穀轉化之道路熱氣甚則傳化失常而為吐瀉霍亂火性急速火性躁動故也世俗止謂停食者特一端耳轉筋者亦是肝木自甚肝熱爍燥於筋故筋急而攣痛實非寒主收引之謂此發火熱霍亂一門也巢氏云霍亂者由陰陽清濁二氣相干亂於腸胃之間因遇飲食太過忽然心腹絞痛挾外邪者身發寒熱頭痛身疼無外邪者但見心腹絞痛吐瀉而已又有飲酒食肉厚味稠黏又或生冷不禁露庭當風入於三焦傳於脾胃皆成霍亂此發飲食霍亂一門也張戴人曰風濕暍三氣合而為邪脾土得風則熱乃發發則火炎上故嘔吐者暍也脾土得濕則下注故注泄者濕也風急甚則轉筋故轉筋者風也此申明內經運氣之風濕熱三條也王海藏云風濕熱外至生冷食內加內外合病乃成霍亂總括外感內傷霍亂致病之由也附諸賢轉筋論陳無擇云轉筋者以陽明養宗筋屬大腸今因感六淫之邪內傷飲食油膩暴吐下津液頓亡宗筋失養必致攣縮甚則囊縮甲青而難治也劉宗厚云冷熱不調陰陽相搏風寒乘之而為攣縮急痛也河間云轉筋皆屬於火內有鬱火外束風寒丹溪又謂屬血熱血中有熱外被風寒皆能霍亂轉筋也準繩云霍亂之症多由伏暑而作病之將作必先腹中㽱痛吐瀉之後若見轉筋者此陽明經內有積熱外有風寒必須發散表邪故曰轉筋者風也手足厥冷者表邪內伏也身熱煩渴多汗者暑也四肢重骨節煩痛者濕也故霍亂轉筋有汗脈出者方可清熱若無汗脈伏四肢厥冷必主升散發表秦子曰霍亂之症多有轉筋多有四肢厥冷若厥冷無脈而兼見轉筋者悉屬陽火抑遏並非陰寒之症蓋厥冷而不轉筋則有陰寒陽火之分若厥冷而神志清爽手足不能動移乃是陰厥若神志昏沉手足雖冷仍能揚動悉是陽厥故夏秋霍亂四肢厥冷本是暑熱內伏然雖是暑熱既經內伏不用寒涼若以寒涼抑遏則手足何由得溫六脈何由得出理宜升散表邪疏通經絡則手足得暖六脈得出凡此皆是表有風寒一經吐瀉表邪乘虛內陷外見假寒則手足厥冷外邪不得作汗此熱深厥亦深也誤認脈伏為陰厥遽投熱藥死不旋踵即知其熱厥誤用寒涼則外邪愈伏到底亦死故余締思升陽散火則邪汗自來表邪自解而愈更有手足溫六脈出又現紫癍而愈者再按夏秋外感疫痢內伏暑熱外被風寒雨濕束其肌表惡寒身痛下痢純血或下血水或下黑色胸前滿悶嘔吐不食誤用芩連大黃則在表之疫邪內陷不死不休余亦用升陽散火湯敗毒散有汗大出而愈者有發紫斑而愈者若汗不出則病不愈而斑不化矣此又以發汗為化斑者也夫痢疾中夾帶外感人人知矣夾帶發斑人所不知也霍亂中夾帶表邪人知之者霍亂中夾帶發斑人所不知也夫發斑而忌苦寒人知之矣化斑而忌寒涼人所不知也總之有表症無汗脈浮或脈伏發表即是發斑斑出而不化熱不解表症尚在者散表即是化斑有汗無表症脈沉數清裡即是發斑斑出後表解而裡熱清熱即是化斑腹痛論秦子曰痛在胃之下臍之四旁毛際之上名曰腹痛若痛在脅肋曰脅痛痛在臍上則曰胃痛而非腹痛今列外感者五內傷者十外感腹痛風氣腹痛風氣腹痛之症風冷著腹即患腹痛或發寒熱腹中攻注或腹中作響大便作瀉此風氣腹痛之症也風氣腹痛之因偶值衣被太薄外又風氣所傷風與寒常相因風氣入於腸胃傳於太陰則腹痛作矣風氣腹痛之脈浮緩不數乃是風冷或見沉緩風邪內伏左關浮弦風入肝膽右關浮緩風傷腸胃風氣腹痛之治脈浮緩者祛風脈沉弦者和里寒熱脈浮防風湯腹中作響大便作瀉平胃五苓散加防風脈遲者建中湯加防風左脈浮柴胡湯右脈浮乾葛湯防風湯防風葛根柴胡桂枝甘草白芍藥平胃五苓散見痢疾門建中湯桂枝飴糖甘草生薑白芍藥胸前飽悶加砂仁木香以行甘甜之滯有寒加炮薑柴胡湯見前乾葛湯見前寒氣腹痛寒氣腹痛之症面黃唇白手足多冷惡寒不熱二便清利腹中綿綿作痛此寒氣腹痛之症也寒氣腹痛之因腹主太陰其人陽氣不足又冒外寒內經云寒氣入經卒然而痛此寒氣之能令入腹痛也寒氣腹痛之脈脈多沉伏或見微弱或見弦緊或見遲弦寒氣腹痛之治左關弦緊者宜散寒桂枝芍藥湯右關遲弦金匱建中湯六脈沉伏四肢冷四逆湯六脈微弱中氣虛寒理中湯桂枝芍藥湯桂枝陳皮甘草生薑白芍藥金匱建中湯桂枝生薑芍藥甘草飴糖大棗廣皮砂仁四逆湯甘草乾薑附子理中湯見前暑濕腹痛暑濕腹痛之症熱令當權忽爾腹中作痛腸中作響痛瀉交作此暑濕霍亂之類也暑濕腹痛之因夏令暑濕之邪與腸胃水穀互相混亂暑熱不得發越食氣不得運化而諸腹作痛之症成矣暑濕腹痛之脈傷暑脈虛腹痛脈大虛大弦數暑熱之痛滑大而數暑食所傷痛極郁遏脈反沉伏暑濕腹痛之治脈洪大者黃連香薷散脈弦數者清熱勝濕湯痛一陳瀉一陳平胃散煎湯調六一散寒熱脈伏或寒熱脈浮大皆宜發表敗毒散大便結厚朴三物湯腹痛嘔吐藿香正氣散黃連香薷散川黃連香薷白扁豆厚朴嘔吐加藿香胸前飽悶加枳殼小便不利加六一散木通湯大便結加大黃惡寒身熱加羌活防風清熱勝濕湯黃柏黃連澤瀉蒼朮厚朴白茯苓陳皮甘草平胃散厚朴陳皮甘草熟蒼朮六一散滑石甘草敗毒散羌活獨活川芎荊芥防風前胡柴胡桔梗陳皮甘草厚朴三物湯厚朴枳實大黃藿香正氣散厚朴陳皮蒼朮甘草半夏藿香燥火腹痛燥火腹痛之症滿腹刺痛攻注脅肋口渴身熱煩躁不寐小便黃赤不吐不瀉此燥火腹痛之症也燥火腹痛之因或令值燥熱或燥金司政燥氣傷人腸胃乾涸不得流利不通則痛此燥火腹痛也燥火腹痛之脈多見躁疾躁則為燥疾則為熱躁疾兼見則為燥熱燥火腹痛之治脈數應下者芍藥黃連湯攻刺脅肋者柴胡清肝飲目黃便赤痛連小腹龍膽瀉肝湯口乾脈數者葛根石膏湯小便赤澀木通湯調益元散大便結四順飲合本事涼膈散芍藥黃連湯當歸川連大黃甘草赤芍藥失氣者倍大黃柴胡清肝飲治肝膽有熱柴胡青皮枳殼山梔木通鉤藤蘇梗黃芩知母甘草龍膽瀉肝湯黃芩山梔知母天冬麥冬龍膽草黃連柴胡人參甘草葛根石膏湯乾葛石膏知母粳米木通湯見前益元散即六一散四順飲當歸大黃白芍藥懷生地本事涼膈散芍藥連翹薄荷大黃桔梗山梔仁葛根痧脹腹痛痧脹腹痛之症忽爾胸腹脹痛手足厥冷指甲帶青痛不可忍不吐不瀉或吐或瀉按之痛甚俗名絞腸痧此即痧脹腹痛之症也痧脹腹痛之因或沿海之地或山嵐之間或風木之邪燥金之勝一切不正之氣襲人腸胃則為痧毒而腹痛作矣痧脹腹痛之脈脈多數大或多促結痛極而結脈反停歇痧脹腹痛之治十指青冷刺指出血欲吐不吐鹽湯探吐攻刺脅肋則刺期門或刮兩臂臑刮出紅痧若腹痛兩足轉筋抽搐刺三里穴若小腹悶痛刺委中出血浙人名曰放痧惡寒發熱脈浮大者敗毒散羌獨敗毒散羌活獨活柴胡前胡桔梗防風荊芥廣皮甘草川芎楨按以上五條皆外感腹痛故另列於前內傷腹痛熱積腹痛熱積腹痛之症身熱腹熱煩躁不寐時作時止痛則汗出或痛而作聲或痛而一泛即欲下痢一利即止此熱積腹痛之症也熱積腹痛之因或膏粱酒熱曰積於中或心肝火動煎熬於內或多食過飽停積發熱凡此皆熱積腹痛之症也熱積腹痛之脈右關滑數腸胃積熱左關弦急肝膽有火熱積內伏脈反沉伏按之良久應指劈劈熱積腹痛之治膏粱厚味者枳殼川連湯痛而欲痢痢後稍減片時復痛承氣湯選用酒熱成積者梔連平胃散加枳葛食積發熱者保和丸加枳連右關洪數者清胃湯左關洪數者龍膽瀉肝湯枳殼川連湯枳殼川黃連胸前滿悶加砂仁末小便不利加木通滑石大便結加大黃玄明粉承氣湯大黃枳殼厚朴芒硝梔連平胃散厚朴陳皮甘草山梔葛根熟蒼朮川連枳殼小便赤加木通滑石大便結加大黃芒硝胸滿悶加砂仁白蔻仁目黃疸色加柴胡膽草保和丸山楂神麯半夏白茯苓萊蔔子陳皮連翹積熱重加川連胸滿悶加枳殼厚朴清胃湯升麻山梔甘草丹皮川黃連龍膽瀉肝湯柴胡黃芩山梔知母天冬麥冬膽草人參甘草川黃連寒積腹痛寒積腹痛之症綿綿而痛無增減得熱稍止得寒更甚身無熱小便清利痛則下痢此寒積腹痛之症也寒積腹痛之因真陽不足身受寒邪口傷生冷胃陽不能腐熟消化則寒積凝滯不得宣行而腹痛矣寒積腹痛之脈脈多沉遲或見沉緊或見沉弦或見沉澀寒冷太甚脈至沉伏寒積腹痛之治脈沉遲理中湯脈沉緊者豆蔻丸脈沉弦者建中湯脈沉澀者宜宣通中氣治中湯理中湯人參白朮炮薑炙甘草豆蔻丸青皮半夏麥芽神麯草豆蔻吳茱萸甘草益智仁建中湯見前風腹痛治中湯即理中湯加青皮木香食積腹痛食積腹痛之症胸腹脹滿痛不欲食噯氣作酸痛而欲利利後稍減或一條扛起手按則痛此食積腹痛之症也食積腹痛之因飲食不節或飢飽傷損或飽時強食或氣食相凝或臨臥多食皆成腹痛之症也食積腹痛之脈右關滑大或見沉實遲緩主寒實數主熱食填太倉脈乃促結食下腸胃脈必數實食積腹痛之治胸脹腹痛不能飲食枳殼化滯湯一條扛起痛而欲利承氣湯選用食在上脘宜消不宜下保和丸枳朮丸熱積應下三承氣湯寒積應下煮黃丸枳殼化滯湯枳殼厚朴神麯陳皮麥芽萊蔔子砂仁承氣湯保和丸以上二方