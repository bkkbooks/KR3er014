body:
  text: 卷一中風總論秦子曰中風之症卒然仆倒昏不知人若痰涎暫升少頃即醒此中之輕者卒然倒僕昏不知人痰涎壅盛口噤失音良久不醒漸漸沉重此中之重者有外感有內傷外感者真中風也內傷者類中風也外感中風症中風之症卒然倒僕身熱口噤志亂神昏四肢俱廢良久不省內經名曰風痱東垣所謂中藏之重症也若倉卒仆倒少頃即醒身熱痰涎或見左癱右瘓半身不遂內經名曰偏枯東垣所謂中腑之稍輕者外無六經寒熱內無便溺阻隔無痰無喘言語分明惟見皮膚不仁或麻或木口眼喎斜東垣所謂中血脈之最輕者以上乃外感真中風之症也中風之因或坐臥當風風入五內或衣單被薄卒遇暴風或披星戴月風露襲人外邪乘虛入於諸經而中風之症作矣中風之脈左關浮弦病在足厥陰少陽左寸浮弦病在手少陰少陽左尺浮大病在足少陰太陽右寸浮洪病在手太陰陽明右關浮大病在足太陰陽明右尺浮大病在三焦及命門中風之治初起宜祛風滌邪有表者小續命湯羌活愈風湯汗之有里者三化湯下之表裡俱見者大秦艽湯防風通聖散和之痰涎壅盛者竹瀝二陳湯合膽星湯牛黃清心丸積熱神昏海藏清心丸小續命湯通治中風六經表症後具河間六經加減四時加減之法麻黃人參黃芩白芍藥甘草防風杏仁川芎防己春加防風夏倍加石膏秋加知母冬加桂枝身痛加羌活秦艽河間云凡中風不審六經加減雖治之不能去其邪內經云開則淅然寒闔則熱而悶知暴中風邪宜以小續命湯隨症隨經治之中風無汗惡寒脈浮緊風中太陽經營也以續命湯加後三味各一倍名麻黃續命湯麻黃防風杏仁宜針太陽少明出崑崙陽蹺穴血中風有汗惡風脈浮緩風中太陽經衛也以續命湯加後三味各一倍名桂枝續命湯桂枝白芍藥杏仁宜針風府中風無汗身熱不惡寒脈洪長風中陽明經症也以續命湯加後三味各一倍名曰石膏續命湯石膏知母甘草中風無汗身熱不惡風脈緩長風中陽明表症也以續命湯加後三味各一倍名乾葛續命湯葛根桂枝黃芩宜刺厲兌瀉陽明之實清火也針陷谷雲陽明之邪散表也中風無汗身涼風中太陰經也以續命湯加後三味各一倍名附子續命湯熟附子乾薑甘草宜刺隱白以去太陰之賊中風有汗無熱以續命湯加後三味各一倍名桂附續命湯桂枝熟附子甘草宜針太溪以去少陰之邪中風六經混淆指節攣痛麻木不仁系手少陽厥陰羌活連翹續命湯小續命羌活連翹宜刺厥陰之井大敦以通其經灸少陽之經絶骨以引其熱又云古之小續命混淆無六經之別今各分經治又立針刺之法中風外無六經形症內無便溺阻隔惟舌強難以言語手足不能運動知血弱不能養筋宜養血舒筋大秦艽湯主之又云中風外有六經形症先以加減小續命諸方隨症隨經治之內有便溺阻隔復以三化湯下之楨按以上諸症乃西北真中風症故立祛風散邪之法以下內傷條內有不因外風而因於調養失宜例如河間之論火丹溪之論痰而實系類中風之症以其相類故同列之然各有分別不可混治羌活愈風湯治表裡已解服此為善後條理羌活防風防己川芎獨活蔓荊子麻黃細辛秦艽柴胡前胡甘菊花黃耆枳殼當歸芍藥蒼朮黃芩生地半夏白芷知母甘草地骨皮厚朴三化湯外無六經表症內有便溺阻隔以此方利之厚朴大黃枳實羌活虛人加人參痰多加膽星半夏大秦艽湯治外無六經表症內無便溺阻隔惟手足言語不便者秦艽石膏甘草川芎當歸白芍藥羌活獨活防風黃芩白朮白茯苓生地白芷細辛熟地天寒加生薑心下痞加枳實川黃連夏秋加石膏知母冬加桂枝防風通聖散治表裡未除以此方和解麻黃石膏桔梗黃芩山梔荊芥滑石白朮廣皮甘草川芎當歸身防風大黃芒硝連翹薄荷白芍藥竹瀝二陳湯治中脘痰滯熟半夏白茯苓廣皮甘草竹瀝寒加生薑熱加山梔黃連膽星湯治痰涎壅盛陳膽星廣橘紅蘇子鉤藤甘草菖蒲裡熱甚加山梔黃連肝膽熱加青黛海石牛黃清心丸治痰迷心竅真牛黃犀角羚羊角辰砂陳膽星天竺黃麝香薄荷雄黃防風冰片海藏清心丸治積熱迷心黃柏二兩黃連麥冬各一兩龍腦一錢煉蜜為丸內傷中風論秦子曰以其不因外感故曰內傷以其症類中風症故亦曰中風古人名類中風即此症也內傷中風症中風之症平居無故倏爾仆倒隨即蘇醒一年半載又復舉發三四發作其病漸重或犯半身不遂口眼喎斜甚則痰涎壅閉便溺不通至手撒口開遺尿不語乃為不治此內傷中風之症也中風之因或本元素弱勞役過度五志厥陽之火煎熬真陰陰虛則熱熱則風生風火相搏痰涎自聚不由外邪其病自發或膏粱積久濕熱之氣上熏成痰迷其心竅亦能倒僕而成內傷之症中風之脈空大氣虛微細血弱沉數沉實膏粱積熱中風之治初起脈細神清宜活血安神加減茯神湯古人云治風先治血血行風自滅此指內傷中風虛者而言也若脈數沉實昏冒不省先宜清火為急安神丸痰涎壅盛當化痰理氣滌痰湯膏粱積熱者清胃湯俟諸症平安然後養血安神氣虛者四君子湯血虛者四物湯氣血皆虛加味歸脾湯加減茯神湯白茯神當歸遠志麥冬知母羚羊角犀角心火旺加黃連肺火旺加山梔肝火旺加丹皮山梔尺脈數加黃柏元氣虛加人參安神丸治痰迷心竅麥冬白茯神山藥辰砂甘草馬牙硝寒水石痰多加膽星甚則加牛黃心火加黃連肺火加黃芩肝火加山梔腎火加黃柏虛人加人參滌痰湯治痰涎壅盛南星半夏枳實石菖蒲竹茹橘紅甘草白茯神痰不化加竹瀝生薑熱甚加黃連胸滿悶加枳殼大便閉結加大黃虛人加人參清胃湯治胃中濕熱川黃連升麻山梔甘草四君子湯治氣虛不足人參白朮白茯苓炙甘草血虛合四物恐凝滯不用四物竟加當歸一味四物湯治血虛當歸白芍藥川芎懷熟地氣虛合四君子恐燥加黃耆即合當歸補血湯歸脾湯諸症平安此方調理白朮白茯神遠志棗仁當歸黃耆廣皮白芍藥甘草丹皮山梔人參家祕加升麻柴胡即合補中益氣湯以升舉中氣六淫之邪皆能中人非止得風邪也故準繩書立卒中七條以感而輕者名傷感而重者名中若忽然中倒遍身發熱世名中風方書充棟惟河間立四時加減續命湯諸方以治中風外有六經表症開示化方用藥之妙悟立愈風湯通聖散以和解有表有里之症又立三化湯以治內有便溺阻格土太過之裡實症又立十全大補等以治土不及之虛中則散邪和解清裡補虛四法全備東垣復發卒中昏倒偏廢手足舌強語塞之類中風而立理氣開鬱疏通經絡以治氣中丹溪又補痰涎壅閉痰火攻衝而立竹瀝薑汁半夏南星等豁痰散結以治痰中此皆發明卒中之症不獨外中於風有因氣鬱痰迷內傷壅閉致病者家祕於是分外感內傷各立一條又發內傷卒中氣鬱痰迷手足偏廢多因膏粱積熱酒濕成癱所致既詳各條治法又立總論於卷首大凡著書垂後每症之下必要詳明經系何經病因何氣使後學有實據可憑臨症庶不數數更方朝攻暮補貪圖僥幸以致誤人外感半身不遂半身不遂之症身發寒熱暴僕卒倒醒後或左或右偏廢不用或痛或木或熱或冷二便赤澀此外感半身不遂之症也半身不遂之因起居不慎衛氣不固風邪入於經絡邪踞不散氣血阻絶則半身為之廢矣半身不遂之脈或病左左手無脈病右右手無脈或病左左脈反大病右右脈反大半身不遂之治脈洪大者宜祛邪滌熱大秦艽湯外邪抑遏脈伏不出者加減續命湯散其表邪痰火壅閉經絡脈伏不出者三化湯導痰湯清其壅滯則脈出而手足自如大秦艽湯加減續命湯三化湯以上三方見前中風導痰湯南星半夏枳實甘草橘紅內傷半身不遂半身不遂之症或一手一指先見麻木一年半載漸漸不能舉動此病起於緩者或痰火內作忽爾僵仆少頃即蘇半身不能舉動此病因於火而急者二者皆無表邪形象故曰內傷半身不遂也半身不遂之因或氣凝血滯脈痹不行或胃熱生痰流入經隧踞絶道路氣血不得往還或浩飲所傷酒濕成癱則半身不遂之症作矣半身不遂之脈沉澀血痹沉滑結痰沉數酒濕脈虛氣虧脈細血少半身不遂之治血痹者活血湯結痰者二陳湯加竹瀝生薑酒濕成癱者戒酒服散濕熱之藥葛花平胃散或加梔連或梔連二陳湯若氣虛補氣血少補血活血湯當歸赤芍藥紅花丹皮川芎澤瀉鬱金木通秦艽二陳湯見痰飲葛花平胃散葛花蒼朮厚朴廣皮甘草有熱加山梔黃連梔連二陳湯即二陳湯加梔連外感四肢不舉四肢不舉之症身發寒熱內熱口渴二便赤澀手足俱廢或痛或麻此外感四肢不舉也四肢不舉之因內氣不足起居不慎衛外之陽已虧外邪襲之則手足廢而不用四肢不舉矣四肢不舉之脈浮數風熱浮緊寒傷浮緩風傷浮滑痰涎初按不見邪伏之診久按反疾熱結使然四肢不舉之治脈浮數者防風通聖散秦艽湯脈浮緊者麻黃續命湯浮緩者桂枝續命湯脈弦滑者膽星湯左脈浮大羌防柴胡湯初按脈沉伏有表邪者續命湯散邪久按滑疾宜宣通壅滯三化湯下之防風通聖散大秦艽湯麻黃續命湯三化湯桂枝續命湯膽星湯以上六方見前羌防柴胡湯柴胡黃芩廣皮甘草羌活防風內傷四肢不舉四肢不舉之症忽爾倒僕手足偏枯外無六經表症惟內熱便閉尿赤此土太過症也若漸至四肢無力不偏枯神清氣爽二便清利此土不及症也四肢不舉之似因膏粱積熱土困中央手足本於陽明胃經土太過則隧道壅塞四肢不舉手足又稟氣於脾土不及則脾氣虧損四肢亦不舉四肢不舉之脈右關實大或見沉數土太過也虛大細緩或見沉遲土不及也四肢不舉之治右脈滑實土太過枳實丸消導之右脈沉數大便結者三化湯痰注四肢者導痰湯酒濕成癱熱在上者乾葛清胃湯六脈虛緩土不及者六君子湯尺脈沉遲真火不足者八味丸溫補天真枳實丸陳枳實厚朴檳榔木香小便不通加黃連木通三化湯見外感中風導痰湯見半身不遂乾葛清胃湯即清胃湯加乾葛六君子湯即四君子湯加陳皮半夏八味丸即六味地黃丸加肉桂附子按半身不遂與四肢不舉大有分別四肢不舉者有虛有實半身不遂悉作實邪夫一人之身豈有半邊虛而半邊不虛者乎此症當與口眼喎斜同看非外感六淫之邪即內傷痰火死血今前二條雖有氣虛血虛之説然不過戒後人不可峻攻其邪非教人用補藥也若外感致病發熱惡寒此風寒也當用羌獨敗毒散辛散表邪若發熱多汗口渴此風熱也當用加減防風湯若口角流涎胸前嘔惡此內傷痰火也宜導痰湯加乾葛多衝竹瀝胃家無滯者加梔連有滯者閣家祕保和散大便結者指迷丸加玄明粉若死血凝結夜間作痛者活血湯加桃仁血中伏火睡中盜汗者兼用當歸大黃湯若四肢不舉方書以二便阻澀為諸竅壅滯四肢或冷或麻木全然不能舉動者土太過實症也用三化湯等削平土厚若二便滑利諸竅通滑手足但覺乏力別無痛苦麻木原能略略舉動者此上不及虛症也當補氣血夫四肢不舉有氣血諸經之別今獨言土者以手足為陽明胃土所主四肢稟命於脾胃舉土而言則可類推外感口眼喎斜口眼喎斜之症頭痛目疼身發寒熱目筋縮短軟戾拘急此外感口眼喎斜之症也口眼喎斜之因當風露臥胃冷沖寒肝主筋脈風中肝木則眼目拘縮陽明主肌肉風中肌表則口欠唇歪口眼喎斜之脈左關弦緊風中肝膽右關弦長風中陽明浮數滑大邪傷於氣沉弦細數邪傷於血口眼喎斜之治風中肝膽羌防四物湯風中陽明防風乾葛湯左喎用羌防四物湯內服外熏右喎防風葛根湯內服外熏因於寒外用艾火灸之右喎灸右左喎灸左羌防四物湯治風中於左邪入厥陰口眼喎斜之症羌活防風當歸生地川芎白芍藥身痛加秦艽鉤藤柴胡防風乾葛湯治風中於右邪入陽明口眼喎斜之症防風荊芥乾葛升麻廣皮甘草白芷身痛加秦艽鉤藤內傷口眼喎斜口眼喎斜之症外無六經形症忽爾眼欠口喎此內傷口眼喎斜之症也口眼喎斜之因金燥木枯則肝血不足筋急牽引燥金太過則子合母虛陽明之脈亦必短縮膏粱酒濕濕熱不攘則脾火不運筋脈軟短肌肉不仁口眼喎斜之症作矣口眼喎斜之脈左關弦數肝膽有邪右關洪長腸胃有熱左脈微澀肝血不足右脈微細氣虛之別口眼喎斜之治左關弦數者當歸鉤藤湯右關脈弦數者梔連平胃散加乾葛木瓜秦艽膏粱積熱者乾葛清胃湯肝血不足補肝散脾氣虛者四君子湯當歸鉤藤湯當歸鉤藤秦艽丹皮防風青皮黃芩柴胡甘草梔連平胃散山梔川黃連熟蒼朮厚朴廣皮甘草葛根木瓜秦艽乾葛清胃湯升麻川黃連山梔丹皮生地甘草乾葛四君子湯見前內傷中風補肝散歸身白芍藥川芎生地羌活防風陽明之脈夾口環唇入目絡鼻故口眼喎斜陽明主多此係實邪之症即同半身不遂但當去其病邪用不得溫補堵塞前條雖有血虛氣虛而立補方亦不過預防其本元耳以內有痰涎積熱每多口眼喎斜故凡流涎口角而喎斜口眼者悉以胃熱主治而用清胃湯防風乾葛湯舌音不清喎斜者皆主心胃有熱而用轉舌膏大便硬為大腸燥火而用四順飲即或瀉或結亦是大腸濕熱用川連枳殼湯小便赤澀不利為小腸燥火即或數數欲小便者亦為小腸濕火用導赤各半湯二便皆澀八正散大凡治病當察何經主病何經兼見上觀唇口眼鼻則知上焦虛實寒熱下觀二便通澀即知下焦之虛實寒熱此下手之真訣也外感口噤不語口噤不語之症面色多赤身體壯熱牙關緊閉昏冒不知口乾唇焦二便赤澀此外感不語之症也口噤不語之因內有積熱外中風邪經絡不通發熱自盛熱極生痰上熏心肺神識昏迷則不語之症作矣口噤不語之脈右脈滑數腸胃有熱左關浮大表邪未解右脈滑實痰凝氣滯左脈浮緊寒邪閉結左脈沉數心肝有熱口噤不語之治表未解者防風通聖散減白朮表解裡熱者清心丸涼膈散轉舌膏宜下者三化湯下之有痰滌痰湯寒邪閉結者溫中散心肝有熱龍膽瀉肝湯若初起痰食凝結上焦先用吐法極妙防風通聖散見前清心丸治熱痰迷心竅黃連麥冬黃芩龍腦薄荷膽星涼膈散治熱壅口噤山梔連翹薄荷黃芩甘草大黃桔梗芒硝轉舌膏治舌音不清語言不出連翹石菖蒲山梔黃芩桔梗防風犀角玄明粉甘草柿霜酒大黃三化湯見前滌痰湯治痰迷心竅南星半夏枳實石菖蒲竹茹橘紅甘草白茯神溫中散厚朴廣皮半夏甘草炮薑龍膽瀉肝湯見舌音不清內傷口噤不語口噤不語之症或發熱或不發熱喉中痰聲語言不出手足或冷或熱大便或祕或溏此內傷不語之症也口噤不語之因或一時感氣填塞胸臆或食氣不化痰飲膠凝或形寒飲冷抑遏心胸阻其心竅或惱怒傷肝木火刑金肺聲不出內傷口噤之症作矣口噤不語之脈右關沉滑氣食相凝或見滑數內有熱結左關弦大肝膽有邪左寸鉤洪心經有熱脈見遲弦苦寒抑遏口噤不語之治右脈沉滑導氣枳殼散右關滑數梔連二陳湯左關弦數龍膽瀉肝湯左寸鉤洪導赤各半湯若寒抑遏大順飲此症實邪者多不足者少宜用導痰消滯湯膽星湯開豁痰涎利其諸竅枳殼散治胸前熱結枳殼桔梗黃芩梔連二陳湯即二陳湯加梔連龍膽瀉肝湯見舌音不清條導赤各半湯黃芩黃連犀角麥冬滑石山梔知母人參燈心白茯神大順飲治口噤不語脈沉而遲草豆蔻炮薑熟附子廣皮白茯苓炙甘草熟半夏導痰消滯湯南星半夏枳實橘紅厚朴石菖蒲竹瀝生薑膽星湯陳膽星廣橘紅蘇子石菖蒲嫩鉤藤按不語之症皆是邪結上焦初起服導痰消滯湯片時用探吐法最好外感痰壅痰壅之症身熱神昏聲如齁睡喘急不寧語言不便此外感痰壅之症也痰壅之因肺胃有熱外束風邪熱無從泄則為喘為齁而痰涎壅盛矣痰壅之脈脈多浮大浮緊風寒浮數風熱沉滑頑痰洪滑痰熱寸口脈大肺壅氣結痰壅之治風寒者加減桂枝湯風熱者加減防風湯痰熱者梔連二陳湯頑痰者導痰湯肺壅痰喘加減瀉白散加減防風湯防風荊芥桔梗甘草薄荷天花粉半夏連翹山梔黃芩栝蔞仁加減桂枝湯桂枝麻黃杏仁半夏生薑甘草梔連二陳湯陳皮半夏白茯苓甘草山梔川黃連導痰湯南星半夏橘紅甘草枳殼石菖蒲加減瀉白散痰結上焦先用吐法桑白皮地骨皮甘草風加防風荊芥寒加麻黃桂枝內傷痰壅痰壅之症身無寒熱痰結心胸上氣喘逆喉中有聲此內傷痰壅之症也痰壅之因或膏粱嗜酒內熱生痰或飲食過飽停留作患或憂思鬱結五志火動或脾氣虛損不能運化則內傷痰壅之症作矣痰壅之脈脈多滑大滑數積熱沉實食凝沉滑抑遏洪數火多緩大脾怯痰壅之治脈洪數者梔連二陳湯沉滑者導痰湯脈沉實有下症者三化湯滾痰丸痰結中脘二陳湯加石菖蒲肝膽有痰膽星湯肺家有痰瀉白散加蘇子栝蔞仁脾虛不能運化六君子湯膽星湯見中風梔連二陳湯見胸痛加味瀉白散見胸痛導痰湯見半身不遂三化湯見中風滾痰丸見痰積腹痛六君子湯人參白朮茯苓甘草半夏廣皮痰有虛實若脾胃虛不能運化水穀而成者為虛痰腸胃濕熱蒸釀水穀而成者為實痰痰壅之症以其壅閉經絡迷塞中焦而命名則痰壅當為實症然脾胃虛不能運化者間而亦有但實痰壅閉者易治不過消之散之而已虛而停滯者補之不服逐之愈虛故也然實痰壅塞亦有各條分別如發熱神昏六脈浮數痰涎壅結氣急喘鳴當外解表邪無汗者加減羌活湯導痰消滯湯有汗者加減防風合滌痰湯若外無發熱神氣不昏六脈沉滑者則用導痰消滯湯調家祕保和散若大便不通者當以導痰消滯湯加玄明粉下之若見咳嗽喘逆此肺氣受病當用節齋化痰丸三子養親湯合瀉白枳桔湯等若肺有表邪當用羌活瀉白散防風瀉白散外感舌音不清舌音不清之症身熱口燥面色多紅二便赤澀神智昏沉語言不便此外感舌音不清也舌音不清之因心經熱甚則舌縱而語塞風中厥陰則舌卷而難言陽明邪盛則舌根強硬或風寒外束頑痰壅於胞絡則心竅不開此外感舌音不清之因也舌音不清之脈脈多洪數心經熱者左寸洪數肝膽熱者左關弦數風中厥陰左關弦緊陽明熱盛右脈洪數舌音不清之治心熱者導赤各半湯肝熱者龍膽瀉肝湯小柴胡湯肝中風寒補肝散陽明胃熱乾葛清胃湯大便祕結有下症者四順飲導赤各半湯見遺尿條龍膽瀉肝湯龍膽草知母川連人參麥冬天門冬山梔黃芩甘草柴胡補肝散見口眼喎斜乾葛清胃湯見口眼喎斜四順飲當歸大黃白芍藥枳殼內傷舌音不清舌音不清之症二便不赤氣爽神清但覺舌不能轉此腎虛舌音不清之虛症也神識昏沉語言不利便閉口渴此積熱舌音不清之實症也舌音不清之因蓋腎脈挾舌本腎經水虧不能上循喉嚨則失潤而喑或因刺足少陰脈重虛出血而喑或因刺足太陰舌下中脈出血不止而喑此虛症之因也或脾胃熱則舌根硬而音不清或心肝熱甚則舌卷而音不清此實證之因也舌音不清之脈兩尺細數腎水枯涸刺血陰虧左脈空虛脾胃積熱右關洪滑心肝有火左脈見數舌音不清之治腎虛三才丹刺血重虛當歸補血湯脾胃積熱轉舌膏心經有火導赤各半湯肝經有火龍膽瀉肝湯三才封髓丹天門冬熟地黃人參當歸補血湯黃耆當歸轉舌膏見口噤不語導赤各半湯見內傷不語龍膽瀉肝湯見前口角流涎而舌音不清胃熱也清胃湯梔連平胃散口渴引飲而舌音不清乾葛石膏湯咳逆喘息而舌音不清肺熱也梔連瀉白散加枳桔或涼膈散清燥湯肺遺熱於大腸大便閉結而舌音不清枳桔四順飲上焦有痰火舌根或硬或麻者梔連二陳湯上有痰火下見大便阻滯者指迷丸多衝竹瀝以順大腸心遺熱於小腸小便赤澀而舌音不清者導赤各半湯大凡舌音不清皆繫上焦之熱故轉舌膏為通治之方外感遺尿遺尿之症身體發熱神志不清小便自出而不覺便色黃赤此外感遺尿之症也遺尿之因外受表邪內有積熱熱極神昏則遺尿不禁矣遺尿之脈若見浮大外有表邪若見沉數里有熱結左脈弦數外感邪熱右脈滑實痰飲食積遺尿之治外有表邪羌活防風湯脈數里熱者導赤各半湯脈實滑數食填太倉者枳實消滯湯痰凝中脘者二陳湯加石菖蒲或導痰湯便閉裡實有下症者三化湯羌活防風湯羌活防風柴胡葛根荊芥木通導赤各半湯見前不語枳實消滯湯枳實厚朴神麯廣皮萊蔔子麥芽二陳菖蒲湯半夏廣皮白茯苓甘草石菖蒲三化湯見前中風導痰湯見前痰壅三化湯見前中風導痰湯見前痰壅內傷遺尿遺尿之症神氣清爽時時遺失似無關欄語言輕微飲食漸少大便滑泄此內傷遺尿之症也遺尿之因腎元不足真陽不能自固腎主閉藏腎虛則開闔失職真陰不足肝火內擾肝主疏泄火動則溺不停蓄而遺尿之症作矣遺尿之脈脈見散大中氣虛寒六脈濡軟氣血不足尺脈浮大真火外越尺脈沉數真陰內竭遺尿之治脈散大者中氣不足補中益氣湯尺脈浮大者八味腎氣丸兩尺沉數者三才湯加門冬五味黃柏知母補中益氣湯人參白朮黃耆甘草當歸廣皮升麻柴胡八味丸治腎火衰敗真陽外越即六味地黃丸加肉桂附子三才湯天門冬地黃人參家祕加麥門冬五味以治遺精不禁加黃柏知母治脈數精虛傷寒總論秦子曰余著傷寒大白書內立二十七總論七十二症治並詳解仲景原文匯聚於各症之下詳且悉矣今著大方雜症又何必多贅但仲景傷寒論中中寒傷寒同卷立名雖已注明直中陰經者為陰症傳入陰經者為陽症後人不知往往於陰經之陽症混以陰症名之誤投熱劑都致不救余今以直中陰經之寒症名曰中寒另立一條寒傷陽經之熱症名曰傷寒亦另立一條使展卷瞭然而無陰陽誤治之弊矣傷寒之症頭痛身疼腰脊強直惡寒發熱此太陽經表症也目痛鼻乾不眠眼眶痛或口乾或嘔吐此陽明經表症也寒熱往來口苦脅痛耳聾而嘔此少陽經半表半裡症也以上皆三陽經表症也若陽經熱邪不解傳入於裡惡寒身痛未除又加小便不利此太陽經里症也若惡寒身痛頭疼悉除脈沉數不浮皮膚不熱口渴唇焦引飲消水小便赤大便結潮熱譫語手足多汗此陽明之裡症也若口乾咽燥渴而消水或自利純清水心下硬痛脹滿不大便此陽邪傳入少陰里症也若手足自溫或發身黃或腹滿實痛者此陽邪傳入太陰里症也煩滿囊縮下利譫語腹中痛失氣或厥而有熱此陽邪傳入厥陰里症也以上皆三陽經之熱邪傳入陰經而為里症者經雖屬陰症則陽症若初起兩經見症或三經皆病名曰合病若是一經先病未罷而又見一經者名曰並病凡此皆傷寒症也傷寒之因其人腠理空疏偶值時令之寒入於肌表鬱而發熱此冬月傷寒致病之因也若熱令之人內有積熱又因非時之暴寒外束皮毛亦令人頭疼身痛惡寒發熱此即三時之寒熱病也傷寒之脈浮大為表沉數為里左關浮緊寒傷太陽右關洪長病在陽明左關弦數病在少陽沉數實大陽明裡症沉數細疾三陰裡熱傷寒之治頭疼腰痛脈浮緊無汗惡寒太陽經寒傷營也仲景冬月麻黃湯家祕用羌活敗毒散有汗惡風脈浮緩太陽經風傷衛也仲景冬月用桂枝湯家祕用沖和湯若惡寒身痛發熱又加小便不利此熱結膀胱乃太陽經里症也仲景冬月用五苓散家祕用羌活木通湯目痛鼻乾不眠脈弦長陽明經表症也宜汗之冬葛根湯余月蔥白葛根湯口渴消水晝夜皆熱六脈洪數而長陽明經半表半裡症也宜清之乾葛石膏湯口燥舌苔黃脈沉數而長陽明之腑里症也未見腹痛便結等下症者涼膈散清之若下症悉具者三承氣湯選用若寒熱未除口苦耳聾或嘔吐胸滿尚在少陽經未入里也小柴胡湯若陽經不解傳入三陰乃是陰經之陽症口燥咽乾而渴腹不脹便不結宜清裡熱若腹脹不大便或自利純清水心下硬痛此熱傳於少陰也有下症者大小承氣湯選用夫陽邪傳入少陰直至口燥咽乾內水將竭不得不急下之以存津液也若手足自溫發熱身黃腹滿大實痛者此熱邪傳於太陰也仲景不設承氣湯下法而立桂枝大黃湯下之以太陰脾經為純陰之臟且太陽之邪傳入太陰故用桂枝太陽之藥協大黃之功即散太陽之表邪復清太陰之裡熱煩滿囊縮脈數而厥先熱後厥此熱深厥亦深熱邪入於厥陰經也仲景不用大下蓋先見發熱後乃發厥手足既已厥冷不合大下之法故立小承氣湯以示輕下之意待其手足自溫然後再議清熱之藥庶為緩轉得宜按傷寒里症有四經一曰陽明一曰少陰一曰太陰一曰厥陰在陽明者陽經之熱病也在三陰者乃陰經之熱病也故三陰之下藥稍輕於陽明也若熱邪雖已內傳然未有下症即熱在陰經但可清之未可下也如手少陰熱極神昏不語如醉如癡不用承氣止用導赤各半湯瀉心等湯是以下法必要確見腹脹痛大便結時下矢氣欲便而不得便手見自汗時出皮膚不熱面無赤色舌上有黃黑干胎方可用下若見一些頭疼身痛惡寒發熱手足未見自汗濈濈即為表邪未盡不可下也總令腹脹便結不得不下亦止用大柴胡湯不可用承氣即用小承氣亦加柴胡乾葛羌活仍治三陽各經見症之表藥庶裡熱得清而表邪有升散之藥不致內陷此用下法而不礙表邪似下法實和解之法也此章傷寒別明陰症陽症兩條故略注大綱條目若細細治法另注傷寒大白書中麻黃湯麻黃桂枝杏仁甘草陶氏加川芎防風羌活桂枝湯桂枝白芍藥麻黃甘草陶氏以葛根易去麻黃按以上二方仲景治西北方冬令傷寒之方南方三時不宜用者羌活敗毒散此方治無汗發熱代麻黃湯者羌活獨活柴胡前胡防風荊芥甘草川芎口乾渴去川芎易乾葛兼清陽明羌活沖和湯羌活黃芩防風蒼朮川芎生地細辛白芷甘草唇乾口渴去川芎細辛以乾葛易白芷胸前飽悶去生地加枳殼家祕沖和湯此方治自汗發熱代桂枝湯羌活黃芩防風生地白芷白芍藥甘草寒熱加柴胡眼眶目痛口渴加葛根去白芷小便赤加木通渴而有痰加天花粉渴而消水加石膏吐嘔加半夏痞滿加枳連以上三方其敗毒散治太陽經純是表邪之症也其沖和湯治太陽經表有邪里有熱用此和解者也其家祕沖和湯治太陽經汗出熱不減之方也羌活木通湯羌活木通二味同煎乾葛湯乾葛桂枝麻黃白芍藥甘草陶氏以升麻易麻黃里有熱加石膏時寒時熱加柴胡惡寒身痛加羌活頭痛加川芎前方去麻桂加荊芥蔥白名蔥白乾葛湯乾葛石膏湯乾葛知母石膏甘草心煩躁加麥冬竹葉嘔而多痰加半夏煩渴痰多加花粉小便澀加木通燈心小柴胡湯柴胡黃芩廣皮半夏甘草人參胸熱痞滿去人參加川連枳殼渴去半夏加花粉涼膈散山梔黃芩川連天花粉連翹薄荷桔梗甘草大承氣湯大黃芒硝枳實厚朴去芒硝即小承氣湯調胃承氣湯大黃芒硝甘草家祕加廣皮桂枝大黃湯桂枝大黃白芍藥甘草導赤各半湯見中風外感風寒從毛竅而入必要從毛竅而出故傷寒發熱症首重發表解肌太陽篇曰初起病時發汗不徹則轉屬陽明而病不解但坐以汗出不徹之故再當發汗則愈以身表發熱未有不出汗而能涼者若汗雖出而仍干到底出汗不徹而熱不退必得時時有汗邪熱方解若不分方宜概以北方麻黃桂枝湯治南方溫熱之症則犯火閉無汗而熱愈甚又有表邪煩熱失用解表誤用寒涼則胃陽抑遏不能敷布作汗又有外冒表邪內有痰飲食滯誤用寒涼凝結胃陽豈能作汗外解夫發汗以治發熱人人知之然發之不效以其未知發汗之真訣在何處前書未有發明後人憒憒到老誰知傷寒論首條用麻黃湯治無汗發熱氣逆喘滿獨加杏仁以理肺氣默示肺氣壅遏則皮毛閉郁不能作汗此開發肺主皮毛潤肺氣為發汗之真訣又以桂枝湯治有汗之發熱方下注明服藥後食稀粥以助藥力此默示發熱之症必胃氣空松方能敷布作汗若汗出而邪不散以桂枝湯解肌散邪助以稀粥則胃陽敷布汗出而邪亦散可見有汗之症胃無凝滯可食稀粥無汗之症胃家必有壅滯凝結決不食稀粥此開發胃主肌肉疏利胃氣升發胃陽為發汗之真訣然此暗度金針非精思不覺者至於頭汗條中則明言但頭有汗遍身無汗皆系水飲瘀熱凝結中焦胃陽不能通達隔絶周身升降之道路故遍身不得出汗治以宣發胃氣疏通經絡余今化立敗毒散中加枳桔桑皮宣通肺氣治風寒壅肺喘逆發熱無汗之症此從麻黃杏仁理肺發汗中化出治法又常以敗毒散中加枳朴半夏廣皮疏散胃滯宣揚胃氣以治痰涎食滯凝塞中焦腹滿發熱無汗之症此從頭汗條中及太陽表症心下有水飲用小青龍湯化出辛散水飲宣發胃陽敷布作汗之真訣一名理肺發表湯一名平胃發表湯中寒病秦子曰中寒之症身不發熱手足厥冷二便清利即仲景直中陰經之真陰症也若惡寒發熱則傷寒陽症而非中寒症矣故仲景以惡寒發熱者名曰傷寒曰陽症以惡寒不發熱者名曰中寒曰陰症今余以直中陰經之陰症立其名曰中寒以寒傷三陽之陽症名曰傷寒則陽症不混於陰症條內中寒之症惡寒身蜷遍身疼痛或自下利口有冷涎面如刀刮手足厥冷無熱神清唇不焦口不渴二便清白此中寒之症也中寒之因其人真陽素虛陰寒內盛胃中之陽不能捍衛於外脾中之陽不能腐熟於中腎中之陽不能封閉關門一得外寒則直中三陰而為中寒之症矣中寒之脈脈多沉微或微而遲或極似絶或伏而沉或空而浮或緊而弦中寒之治寒中少陰二三日應微汗者麻黃附子甘草湯又少陰身痛手足寒脈沉者附子湯若下利脈微白通湯若利不止厥逆無脈乾嘔而煩者白通湯加豬膽汁以止煩又少陰下利有水氣或咳或嘔真武湯又太陰自利不渴其人臟有寒也用四逆湯以溫之若厥陰下利四肢疼厥逆惡寒四逆湯又厥陰下利清穀汗出而厥通脈四逆湯麻黃附子甘草湯麻黃附子甘草附子湯熟附子白朮白茯苓人參白芍藥白通湯蔥白乾薑熟附子白通豬膽湯蔥白乾薑熟附子豬膽汁人尿真武湯白茯苓白芍藥生薑白朮熟附子四逆湯乾薑熟附子炙甘草通脈四逆湯乾薑熟附子炙甘草蔥白蔥白加於四逆湯中則陽氣和血脈通若腹痛加白芍藥合戊己湯以和中減去蔥白恐其助陽散氣也中熱中暑總論秦子曰熱與寒相反也冬有寒夏有熱仲景於冬則有直中陰經之寒症有寒傷三陽之熱症總其名曰傷寒論其夏秋寒熱病則無垂訓也潔古東垣雖有動而得之之中熱靜而得之之中暑然其治法似乎未純夫中熱中暑均是熱症但得之有動靜之分則治之不無差別蓋動而得者行役氣擾外引時令之熱直中陽經並無寒邪外束即俗云熱病也靜而得者里有熱邪伏於身中又因納涼太過束其內熱不得外越鬱而發熱此即俗云寒熱病也古人因其均是熱病以動而得明其無表邪故曰中熱以靜而得明其有表邪故曰中暑後人不解其義概用寒涼不知治熱病原有兩條分別無表邪者不必用發表即可寒涼若有表邪者先散外束之寒邪後用寒涼可也此症與仲景冬月傷寒相似但冬月傷寒內無暑熱故初起無口燥舌乾內熱之象直待日久寒鬱成熱然後口燥咽乾今夏秋寒熱病內有暑熱外冒風寒初起即見外寒裡熱之症故不同冬月傷寒治法妄用辛溫但宜辛涼散表以治之今有重視表症者誤用仲景麻桂發表礙其暑熱重視暑熱者誤用寒涼清裡抑遏表邪良以不明夏秋之熱病不同冬月傷寒治法耳中熱病即無表邪之熱病中熱之症發熱昏沉悶亂口噤煩躁大渴神識不清遺尿便赤外無表症此即古名動而得之為中熱症也中熱之因時值夏令天之熱氣下降地之熱氣上升人在氣交之中日中勞役擾動其陽熱邪直中陽經則有中熱之症矣中熱之脈脈息洪數六經皆熱或見洪長陽明之熱或見沉數時有結熱身熱脈數中熱之別中熱之治忽然倒僕悶絶不知切勿置極熱極冷之處宜以鮮藿香煎湯調六一散微溫灌服得汗乃佳若治之太熱恐增其熱治之太冷則遏其熱直待手足自汗熱邪外出人事少知然後以黃連香薷飲三黃石膏湯治之渴者人參白虎湯加乾葛若肺家多熱桔梗湯心臟有熱導赤各半湯心肺俱熱神志不清涼膈散濕熱甚蒼朮白虎湯燥熱甚竹葉石膏湯黃連香薷飲通治暑熱黃連香薷白扁豆厚朴加鮮藿香同煎身痛加羌活轉筋攣縮加木瓜小便赤澀加六一散嘔加廣皮渴加乾葛花粉三黃石膏湯治無表邪多汗口渴裡熱甚者黃連黃柏黃芩石膏山梔玄參知母甘草人參白虎湯治陽明經裡熱之症人參石膏知母粳米甘草葛根桔梗湯治肺素有熱煩熱喘咳口燥咽乾薄荷桔梗黃芩山梔連翹甘草竹葉導赤各半湯利去小腸之熱則心火自退故曰導赤瀉去心火則小腸自利故曰瀉心湯黃連生地木通犀角山梔黃芩麥冬燈心甘草涼膈散治上焦熱甚表解裡熱宜清未宜下之症黃芩山梔桔梗連翹天花粉黃連薄荷蒼朮白虎湯治陽明濕熱蒼朮石膏知母甘草竹葉石膏湯治陽明燥熱石膏知母麥冬甘草竹葉人參中熱即暴發熱病之重者以其昏沉卒倒故曰中熱以其無惡寒表熱之表症故不曰寒熱病溫病熱令之溫熱病但熱不惡寒而無卒倒昏沉之候按中熱與熱病同純陽之症而熱病可用寒涼直折若中熱恐痰飲食滯迷塞中焦昏沉不省胃陽抑遏手足反冷故凡治神昏之症反不得用寒涼重在胃陽凝結填塞痰迷者多耳治中熱昏沉宜先用疏利中焦待其胃氣宣通胃陽敷布手足溫熱有汗方可用以上諸方以清上焦之熱如熱結下焦大便閉結有下症者用三化湯承氣湯若大小便俱閉者八正散大凡去邪去病止尋三條出路身熱上焦熱尋毛竅發汗而出下焦熱在小腸膀胱當從小便而出熱在大腸當從大便而出此三者人人知之不曾認得的耳寒熱病論秦子曰寒熱病即古靜而得之為中暑病也以暴寒而傷有熱之人則惡寒發熱乃非時之傷寒因在夏熱之令先伏暑熱在內故不得為傷寒矣今更其名曰寒熱病夫寒熱者以寒傷熱而命其名也傷寒與寒熱病時異而治殊故余注明症治則傷寒與寒熱兩無差誤矣總之同一暑熱病以無表邪者為中熱病以有表邪者為寒熱病同一有表邪病以熱令里有暑熱者為寒熱病照後條治法以冬月里無暑熱惟外感風寒在表發熱者名傷寒仍照傷寒治法寒熱病即有表邪之熱病寒熱病之症頭疼身痛惡寒發熱去衣則凜凜著衣則煩躁口渴懊憹足冷耳聾譫語喘嘔或手足無汗或兩足獨冷即靜而得之為中暑症也寒熱病之因痰飲之熱積於中時令之熱感於內或因納涼太過或因居處太靜身無汗出熱氣無從發泄又被早晚陰寒束其肌表則惡寒身痛身熱足冷之症作矣寒熱病之脈脈見浮緊太陽表邪若見洪大陽明有邪或見弦數少陽有邪寒熱病之治頭疼身痛惡寒發熱無汗羌活敗毒散汗之有汗者羌活沖和湯和之脈伏煩躁者升陽散火湯發之待足暖有汗脈出不伏然後清其裡熱肺素有熱者桔梗湯心熱甚導赤各半湯心肺俱熱涼膈散若足冷耳聾寒熱而嘔有癍者升麻乾葛湯加柴胡無癍者小柴胡湯若手足汗少兩足不溫邪熱未曾發越亦用升陽散火湯熱令人手足應溫今反見足冷乃是表邪未散即上身熱極上身多汗尚是表邪煩熱猶宜散表羌活敗毒散羌活獨活柴胡前胡枳殼川芎廣皮人參甘草羌活沖和湯羌活防風蒼朮川芎細辛白芷生地黃芩甘草升陽散火湯升麻乾葛羌活獨活人參白芍藥柴胡防風甘草小柴胡湯見前傷寒桔梗湯導赤各半湯涼膈散以上三方見中熱無惡寒身痛表症但見內熱煩渴多汗唇焦消水六脈沉數即為無表邪之中熱症若初起發熱惡寒頭痛身痛六脈浮數則為有表邪之寒熱症當從三陽經主治然一見惡寒即重太陽以外感惟怕表邪不散耳小柴胡湯單主少陽一經之寒熱者若太陽少陽寒熱仲景則有桂枝柴胡湯家祕化立羌活柴胡湯太陽陽明寒熱仲景則用桂枝葛根湯家祕化立羌活幹葛湯三陽寒熱今補立羌柴葛根湯大凡寒熱之病必要先散表邪即裡熱已甚必不得已但可雙解表裡不可純用寒涼以礙惡寒之表症發熱總論秦子曰人若發熱則為有病發熱不已即蹈危機夫人未有不病而發熱者未有發熱不休而不死者凡病而不發熱雖病未重若病而發熱雖輕不可忽也故余於發熱症既詳著傷寒大白中又復著於大方雜症門今立外感二條內傷二條其餘門路雖多可以比例而推也外感發熱風寒溫熱風寒發熱風寒發熱之症頭痛身痛無汗惡寒發熱拘緊此表邪發熱也手足多汗口渴惡熱此里邪發熱也風寒發熱之因或時令當寒或非時暴寒或早晚受寒體虛不謹則感冒而發熱矣風寒發熱之脈脈見浮緊寒邪傷營脈見浮緩風邪傷衛左脈浮數病在太陽左脈弦數病在少陽右脈浮數病在陽明六脈沉數里有結熱風寒發熱之治寒邪傷營無汗惡寒羌活湯風邪傷衛有汗惡風防風湯脈弦而數病在少陽柴胡湯傷寒者加羌活獨活傷風者加防風右脈洪數病在陽明葛根湯寒邪加羌活脈沉裡熱宜清裡羌活湯羌活獨活柴胡防風防風湯防風荊芥葛根柴胡湯柴胡防風荊芥乾葛湯見傷寒溫熱發熱溫熱發熱之症身熱多汗不惡寒反惡熱口渴唇焦神氣昏沉煩悶躁擾此溫熱之症也溫熱發熱之因或時令大熱熱淫所勝或應寒反溫應涼反熱溫熱之邪襲人肌表傳入經絡則溫熱發熱之症作矣溫熱發熱之脈脈多洪數浮數表熱沉數里熱左脈若數太陽少陽右脈若數陽明腸胃溫熱發熱之治熱在太陽羌活沖和湯熱在少陽小柴胡湯熱在陽明乾葛石膏湯沉數里熱大便結者涼膈散下症急者三黃丸下之羌活沖和湯小柴胡湯乾葛石膏湯涼膈散以上四方見傷寒三黃丸見痢疾內傷發熱氣分血分氣分發熱氣分發熱之症夜則安靜晝則煩熱唇焦口渴飲水多汗此氣分發熱之症也氣分發熱之因或膏粱積熱蘊於腸胃之中或熱病後餘熱未除早食葷腥穀氣此內傷實熱之因也若本元不足氣怯神離夜涼日熱此內傷虛熱之因也氣分發熱之脈左寸脈數心氣之熱左關脈數肝膽之熱右寸脈數大腸肺熱右關脈數腸胃氣熱氣分發熱之治左脈洪數肝膽氣分發熱羌活柴胡湯地骨皮散右脈洪數腸胃氣熱乾葛石膏湯桔梗湯羌活柴胡湯羌活柴胡黃芩廣皮甘草地骨皮散地骨皮柴胡黃芩廣皮甘草乾葛石膏湯見傷寒桔梗湯見中熱血分發熱血分發熱之症晝則安靜夜則發熱唇焦口乾反不飲水睡中盜汗此血分發熱之症也血分發熱之因或熱病後熱伏血中或陰血素虧血虛火旺二者皆成血分發熱也血分發熱之脈左寸脈數心經血熱左關脈數肝膽血熱右寸脈數大腸肺熱右關脈數脾胃血熱血分發熱之治心經血熱實熱導赤各半湯虛熱天王補心丹肝經血熱實熱梔連四物湯虛熱歸芍柴胡湯右脈洪數肺胃大腸血熱實熱清胃湯虛熱犀角地黃湯楨按夜間發熱若無先寒後熱等症方可以血熱治之若先寒後熱每夜如此乃是太陽經似瘧之表邪症當以太陽經羌活湯表藥治之導赤各半湯見不語天王補心丹見衄血梔連四物湯即四物湯加山梔黃連歸芍柴胡湯當歸三錢白芍藥三錢柴胡三錢黃芩五錢廣皮二錢甘草五錢清胃湯見齒痛犀角地黃湯見咳血羌活湯見傷寒氣實柴胡湯治氣實發熱柴胡黃芩廣皮甘草知母石膏地骨皮天花粉氣虛柴胡湯治氣虛發熱柴胡黃芩廣皮甘草人參黃耆地骨皮金石斛血實柴胡湯治血實發熱柴胡黃芩廣皮甘草當歸白芍藥丹皮大黃血虛柴胡湯治血虛發熱柴胡黃芩廣皮甘草人參黃耆當歸白芍藥以上四方家祕治內傷發熱之正法血虛發熱方中加參耆氣有生血之功氣虛發熱方中不加補血之藥血無益氣之理也頭痛論秦子曰頭痛頭風同一症也頭風者頭痛症中之症方書以痛之久者為頭風暴起者為頭痛其詞蓋以頭痛為外感頭風為內傷愚意雖有新久之別而外感內傷之分不在此也頭痛頭風同歸於痛而已因於風者名頭風可也傷寒門頭痛皆是三陽經表症今在雜症門雖分外感內傷然三陽三陰皆有頭痛外感頭痛頭痛之症初起不因內傷忽爾頭額作痛沿門多病大小傳染此外感歲運之氣所謂天行症也若起居不謹睡臥當風沖寒冒雪不因傳染而病頭痛此外感六淫之邪所謂人自感冒症也若惡寒發熱頭項巔腦髮際作痛太陽症也咳噦煩心痞滿額前作痛陽明症也時寒時熱鬢邊作痛少陽症也心疼煩悶頭痛痛連胲骨少陰症也乾嘔吐涎沫痛在巔頂厥陰症也若頭旋發熱有汗者風痛也惡寒發熱無汗者寒痛也夏令頭痛發熱汗多口渴者暑痛也頭重而痛天陰則發濕痛也口乾唇裂煩躁便閉燥痛也暴厥昏倒煩熱不臥火邪痛也頭痛之因少陽之政風勝乃搖候乃大溫病頭痛又云陽明之復咳噦煩心病在膈中頭乃痛太陽之勝熱反上行頭項腦戶中痛太陽之復心痛痞滿頭痛太陰之政腰脊頭頂痛又云太陰在泉濕淫所勝病沖頭痛目似脫項似拔此皆歲運之加臨人在氣交中潛受其氣搏於經絡之中則成天行頭痛之症矣若不因天行司政之氣自覺起居不慎坐臥當風風寒暑濕入於經絡則成自感六淫之頭痛也頭痛之脈脈必浮大浮緩傷風浮緊傷寒虛數者暑洪數者熱寸大易愈尺實難脫頭痛之治宜詳天行自感屬何經所主若在太陽經者選奇方在陽明經清震湯在少陽經清空膏在少陰經獨活細辛湯在太陰經蒼朮除濕湯在厥陰經頭痛吐涎沫者吳茱萸湯主之因於風者加風藥因於寒者加熱藥因於暑濕者加涼燥之藥因於燥熱者加清潤之藥運氣加臨須詳運氣用藥又少陽頭痛耳前後脈湧有熱刺出其血故余家祕治頭痛不按經穴隨其所痛之處而刺之則不必出血而痛即減此宗內經繆刺之法也選奇方防風羌活黃芩甘草因於風倍加荊芥防風有寒去黃芩加川芎細辛有暑加石膏香薷有濕加蒼朮白芷有燥加知母石膏有火加黃連山梔清震湯升麻蒼朮乾葛甘草鮮荷葉有風加防風荊芥有寒加川芎細辛有暑加黃連石膏有濕加白芷有燥加知母石膏火旺加山梔黃連石膏散石膏川芎白芷葛根為細末清空膏柴胡黃芩黃連甘草川芎羌活防風有風加荊芥倍防風有寒去黃芩黃連加生薑細辛有暑加石膏黃連有濕加蒼朮白芷有燥加知母石膏火旺加山梔黃連獨活細辛湯獨活細辛川芎秦艽生地羌活防風甘草有風加荊芥倍防風有寒加麻黃桂枝有暑加黃芩石膏有濕加蒼朮白芷有燥加石膏竹葉火旺加知母黃柏蒼朮除濕湯蒼朮白朮厚朴白茯苓陳皮甘草半夏曲有風加防風有寒加生薑有暑加黃芩有濕加川芎白芷有燥加知母石膏吳茱萸湯吳茱萸人參大棗生薑內傷頭痛頭痛之症或在半邊或在兩邊或痛二三日或痛七八日甚則數日之外痛止仍如平人偶一觸犯則痛立至如氣怯神衰遇勞即痛痛連魚尾此氣虛痛也五心煩熱時常牽引刺痛此血虛痛也口渴唇焦二便赤澀此積熱痛也噁心嘔吐此痰飲痛也惱怒即發痛引脅下此肝火攻衝痛也以上皆內傷之症也頭痛之因或元氣虛寒遇勞即發或血分不足陰火攻衝或積熱不得外泄或積痰留飲或食滯中焦或七情惱怒肝膽火鬱皆能上衝頭痛而成內傷頭痛之症也頭痛之脈空大乏神的是氣虛若見細澀方是血虧或見洪數膏粱積熱或見滑大痰飲內結兩寸洪大上焦有火左關弦數肝膽鬱結頭痛之治若氣虛者家祕和中湯血虧者家祕芎歸湯膏粱積熱者梔連平胃散酒濕上衝葛根解酲湯積痰留飲者半夏天麻湯導痰湯食積作痛者平胃保和湯肝膽有火者清空膏柴胡清肝飲瀉青湯家祕和中湯人參當歸黃耆白朮廣皮甘草升麻柴胡川芎細辛家祕芎歸湯當歸川芎生地連翹細辛蔓荊子梔連平胃散蒼朮厚朴廣皮甘草山梔黃連葛根解酲湯葛根葛花砂仁木香陳皮白茯苓豬苓澤瀉人參神麯白朮白豆蔻青皮川黃連天麻二陳湯半夏白茯苓廣皮甘草天麻導痰湯南星枳殼半夏白茯苓廣皮甘草平胃保和湯蒼朮厚朴廣皮甘草萊蔔子山楂麥芽神麯連翹清空湯柴胡黃連黃芩甘草川芎羌活防風柴胡清肝飲柴胡白芍藥山梔黃芩丹皮當歸青皮鉤藤甘草瀉青湯家祕清肝膽風熱當歸龍膽草川芎山梔羌活防風黃芩附大頭症秦子曰大頭症古書未載近代獨多頭面紅腫其大如斗若腫在兩頤頭上不腫名曰發頤非大頭症也大頭症有外感無內傷大頭見症大頭痛之症身發寒熱頭面胕腫赤色焮紅壅害言語此三陽經濕熱為患若大小傳染沿門相似此天行濕毒症若無傳染獨一人自病此起居不慎偶觸濕熱之氣人自感冒內經所謂濕上甚為熱正此症也大頭痛之因太陰司天濕淫所勝少陽司天火淫所勝陽明之勝上行頭目濕勝則腫熱勝則痛濕熱上甚則頭面胕腫大頭之症作矣大頭痛之脈必見浮洪濕勝則浮熱勝則數浮數宜汗沉數宜清浮大易愈沉伏難醫大頭痛之治宜羌活敗毒散以散天氣之邪次用普濟消毒飲加酒煮大黃以清散熱毒胕腫紅赤外用砭刺出血以去在表壅滯大抵時行之症先宜發汗要知出血亦發汗之意也羌獨敗毒散羌活獨活柴胡前胡桔梗枳殼川芎濕勝腫大加蒼朮白芷口乾脈大加葛根升麻兼散陽明普濟消毒飲升麻柴胡陳皮甘草人參黃連黃芩桔梗玄參連翹馬勃大力子殭蠶板藍根大便閉加酒浸大黃口渴加石膏天花粉頭痛雖有氣血虛者然到底痛無補法以但虛無邪必不作痛即氣虛頭痛必是虛而冒寒然後作痛血虛頭痛必是血虛有火然後攻衝而痛凡治病必先治其痛如氣虛冒風寒荊防芎蘇飲內服外熏痛愈以四君子湯補氣血虛有火知柏四物湯痛止服當歸補血湯然頭痛第一要詳審胃家無滯者可用上二法若胸次欠適即為痰飲凝滯又要平胃化滯以頭痛皆因胸前凝滯而起胸前凝滯則胃陽不能上布易於感邪故平胃保和散治頭痛要著無論內傷頭痛即外感之痛亦用之以外感表邪必要宣通胃陽方能作汗外解故疏散胃滯為發汗散邪妙訣夫發汗散邪人人知之欲散外邪先散胃滯使胃陽敷布作汗人所不知也齒痛外感內傷外感齒痛外感齒痛之症身發寒熱痛連頭目甚則攻注牙齦腫痛作膿此外感齒痛之症也外感齒痛之因齒痛屬陽明少陽二經者多胃家有熱膽經有火外被風寒所束二經之熱不能發越則鬱而攻注作痛矣外感齒痛之脈右關浮數陽明風熱右關沉數腸胃積熱左關浮緊少陽風寒左關沉實肝膽之火外感齒痛之治陽明風熱者葛根防風湯陽明積熱者外刺合谷穴內服葛根清胃湯少陽風寒者柴胡防風湯少陽風熱者柴胡清肝飲肝膽積熱者龍膽瀉肝湯頭痛惡寒太陽風寒外束羌活湯齒痛屬陽明少陽者多或有太陽症故立後條乾葛防風湯乾葛防風石膏甘草乾葛清胃湯升麻甘草生地丹皮山梔乾葛川黃連右上盤牙痛加枳殼石膏右下盤牙痛加石膏桑白皮上正門牙痛加川黃連下正門牙痛加知母黃柏上二虎牙痛加葛根石膏下二虎牙痛加白芍藥左上盤牙痛加柴胡黃芩左下盤牙痛加白芍藥黃芩柴胡防風湯柴胡防風羌活川芎青皮甘草柴胡清肝飲柴胡白芍山梔黃芩當歸丹皮青皮甘草鉤藤龍膽瀉肝湯龍膽草柴胡黃芩川黃連山梔知母麥門冬甘草元氣虛加人參血虛加當歸白芍藥大便結加大黃氣結加青皮羌活湯羌活防風川芎白芷蒼朮甘草內傷齒痛內傷齒痛之症或齒豁或動而長或浮癢燥黑時常作痛此內傷之症也若右上盤痛屬胃與大腸右下盤痛屬肺胃二經左上盤痛屬膽經左下盤痛屬肝經上正門痛屬心經下正門痛屬腎經上左右二虎牙痛屬胃經下左右二虎牙痛屬脾經內傷齒痛之因齒豁而浮者腎衰齒動而長者胃熱癢為血熱痛為火爍黑則是蟲蝕此內傷齒痛之因也內傷齒痛之脈尺脈虛大腎水有虧若見洪數陰火旺動左關弦急肝膽之火左關洪滑痰火內爍內傷齒痛之治腎虛陰火者涼八味玄武膠為丸或知柏天地煎左關弦急龍膽瀉肝湯右關洪滑化痰湯應下者三黃丸大凡牙痛症寒者少熱者多故內傷門都用涼劑若勞倦而胃虛齒浮者又當用補中益氣湯不可拘痛無補法也涼八味丸即六味丸加黃柏知母共為細末玄武膠為丸知柏天地煎黃柏知母天門冬生地黃同煎三四次沖玄武膠收膏龍膽瀉肝湯見前化痰湯貝母枳實黃芩黃連花粉桔梗元參升麻甘草家祕三黃丸黃芩黃連大黃甘草廣皮補中益氣湯人參黃耆當歸白朮廣皮升麻柴胡甘草齒痛雖有各經虛實不同然陽明積熱者多故清胃湯治齒痛總司然尚有分別若膏粱食氣已化惟存積熱所謂熱而無滯可用清胃湯苦寒直折若積熱雖重厚味尚未化盡所謂熱而有滯若以苦寒直折則滯氣凝遏而熱愈甚倒如鬱火症用苦寒則火愈郁服升陽散火湯則愈東垣以清胃湯加砂仁香附更名清胃散散者散也家祕加白豆蔻黑山楂末同是此意以腸胃積熱大抵酒肉食滯蒸釀而成故化散胃滯積熱自清余以平胃保和散治口瘡齒痛及疳火疳積俱獲奇效此深得清積熱根本故瘡癬齒痛之人不能淡薄滋味必纏綿難愈也胸痛論秦子曰胸與膈肺之分野膈痛胸痛兩症也但胸痛止在中間膈痛則連兩腋故歧骨之上作痛乃為胸痛若痛在胸之下即名胃痛若胸中滿塞而不痛又名胸痞若胸中滿塞水穀全不能下又名胸痹皆非胸痛也或痛久不散每夜寒熱按之愈痛視之有形此又是內癰之症而非胸痛矣外感胸痛外感胸痛之症初起表邪未散下早悶痛此傷寒門結胸症也胸痛脹滿咳嗽氣逆不能仰臥此六淫之邪傷於肺經方書所謂肺脹胸痛也若胸痛寒熱咳吐腥穢又是肺癰之症外感胸痛之因傷寒表邪未散下之太早內陷胸中蓋胸主半表半裡外邪內陷與水飲互相盤結則成結胸之症若六淫之邪傷肺肺熱焦滿怫鬱不宣胸亦為之作痛蓋胸為心肺之室也外感胸痛之脈沉緊而徑下後作痛結胸之症脈來浮大胸痛身熱支結之別寸口浮大風熱肺逆寸口脈實脈癰之疾外感胸痛之治傷寒誤下已成結胸者宜大小陷胸湯出入加減若未成結胸者宜枳殼湯治之若肺癰風熱者加味瀉白散肺氣壅寒枳桔二母湯肺癰作痛桔梗湯栝蔞湯大陷胸湯大黃芒硝甘遂小陷胸湯黃連半夏栝蔞加味瀉白散治風熱傷肺桑白皮地骨皮甘草防風荊芥熱甚加石膏知母枳桔二母湯清理肺氣兼消痰水枳殼知母川貝母栝蔞仁蘇子桔梗桔梗湯治肺癰肺瘻川貝母薏苡仁桑白皮地骨皮葶藶子枳殼桔梗杏仁甘草栝蔞湯通治肺胃之癰栝蔞仁一個去皮炒黑研甘草同煎服內傷胸痛內傷胸痛之症不因外感胸中隱隱作痛其痛緩其來漸久久不愈飲食漸少此內傷胸痛也若見咳嗽寒熱吐痰腥穢則是肺癰之症而非胸痛也內傷胸痛之因七情六欲動其心火刑及肺金或怫鬱氣逆傷其肺道則痰凝氣結或過飲辛熱傷其上焦則血積於內而悶閉胸痛矣內傷胸痛之脈滑大主痰洪數主火左寸洪數心火刑金左關弦數肝膽有熱右寸沉結氣滯上焦寸脈芤澀上部蓄血內傷胸痛之治痰氣不清栝蔞仁湯加青黛海石兼火者梔連二陳湯心火乘金瀉心湯救肺清肺飲煩惱鬱結者加味柴胡散氣滯上焦者四七湯血積上焦者紅花當歸湯加桃仁牡丹皮有熱加炒山梔鬱金栝蔞仁湯見前梔連二陳湯山梔黃連熟半夏白茯苓廣皮甘草瀉心湯川黃連甘草清肺飲地骨皮桑白皮桔梗知母黃芩玄參薄荷甘草熱甚加石膏加味柴胡湯柴胡黃芩廣皮甘草山梔四七湯半夏厚朴茯苓紫蘇加薑棗紅花當歸湯紅花當歸紅曲赤芍藥牡丹皮青皮桃仁鬱金楂肉澤蘭葉黑山梔胸痛上焦氣分病當理肺氣要分肺管胃管若胃氣有傷胃脘氣逆亦多胸痛其中分別若飲食自如而見氣逆咳喘作痛病不在胃而在於肺當和肺氣若無喘咳氣逆而見飲食阻滯病不在肺而在於胃當調胃氣若二經皆病當審其何經先起如先見喘咳氣逆滿作痛後見妨礙飲食者此肺病遺禍於胃也當治其肺兼治其胃若先見飲食妨礙後見喘咳氣逆此胃病遺禍於肺也當平其胃兼治其肺此從方廣腫脹門辨脾肺相傳法中化出辨肺胃二經之胸痛又有語言即痛飲食不痛者病在於肺飲食即痛語言不痛者病在於胃此從辨喉痛症中化出辨肺胃之胸痛也脅痛論秦子曰脅痛者左右兩肋痛也脅之下盡處名季脅若痛在脅之上名腋痛痛在季脅之後名腰痛二者皆非脅痛也夫腋痛者肺症也腰痛者腎與膀胱症也凡脅痛多火皆肝膽症也上脅痛屬肝下脅痛屬膽或有肺氣怫鬱金邪乘木亦令脅痛名肺脅痛最利害金乘木為賊邪故重外感脅痛運氣感冒運氣脅痛運氣脅痛之症病起於倉卒暴發寒熱脅肋刺痛沿門相似或在一邊或在兩邊痛之不已脹及遍身甚則指甲紫黑則死此天行歲運勝復之氣加臨所謂天災流行之疫症俗名刺肋傷寒又名痧脹是也運氣脅痛之因少陽司政相火用事少陰司政君火用事陽明司政燥火用事其年勝復之氣太過則相火甚於本位而肝膽自病君火太過則子病纍母肝膽亦病燥火用事金病剋木肝膽亦病三火熾甚木火通明肝膽之氣怫鬱則兩脅暴痛之症作矣運氣脅痛之脈多見弦數浮數居表沉數主裡脈減痛緩則生沉伏厥冷則死運氣脅痛之治宜疏散為先若少陽司政柴胡湯加減主之少陰司政獨活敗毒散對瀉心湯陽明司政乾葛石膏湯主之凡脅痛外用針刺委中三里二穴出血若痛甚指甲黑者即刺十指尖出血為妙越地所謂放痧是也若咳嗽痰聲無論左右即為肺邪脅痛宜瀉青各半湯並刺少商穴柴胡湯柴胡黃芩廣皮甘草青皮山梔枳殼木通加蘇梗獨活敗毒散獨活木通柴胡黃芩桔梗枳殼甘草鉤藤廣皮加蘇梗瀉心湯黃連甘草燈心乾葛石膏湯乾葛柴胡黃芩石膏枳殼廣皮甘草木通加蘇梗瀉青各半湯龍膽草黃芩山梔桑白皮地骨皮甘草加青黛一錢沖服感冒脅痛感冒脅痛之症並無時行傳染因自冒風寒先見惡寒發熱脅痛耳聾嘔而口苦此傷寒少陽經脅痛症也若寒熱已除後乃脅痛乾嘔此表解里未和邪熱痰飲之症二者皆非天災流行乃人自感冒之症也感冒脅痛之因起居不慎感冒外邪或初感即中少陽或傳變而入少陽則邪居半表半裡而成脅痛之症也感冒脅痛之脈脈來多弦弦緊宜汗弦細宜和弦數為熱弦促為結感冒脅痛之治風邪在表柴胡羌活湯熱邪在半表半裡小柴胡湯熱邪在裡小柴胡加山梔青皮枳殼表已散裡氣不和作痛審知是燥痰結飲輕則栝蔞仁湯重則十棗湯若肝膽鬱火成痰家祕膽星湯主之柴胡羌活湯柴胡羌活防風枳殼桔梗青皮蘇梗小柴胡湯柴胡黃芩廣皮甘草山梔青皮桔梗枳殼栝蔞湯栝蔞仁枳殼青皮蘇梗桔梗十棗湯芫花甘遂大戟上三味以水先煮肥棗三十枚取棗汁入藥末一錢調服瘦弱人五六分得利即止家祕膽星湯治膽火成痰脅肋作痛陳膽星柴胡黃芩廣皮甘草青黛海石內傷脅痛痰飲鬱火死血肝腎虛內傷脅痛之症並無外感之邪或左或右脅肋作痛或左右皆痛或左右攻衝或時痛時止或常痛不休此內傷脅痛也內傷脅痛之因或痰飲懸飲凝結兩脅或死血停滯脅肋或惱怒鬱結肝火攻衝或腎水不足龍雷之火上衝或腎陽不足虛陽上浮皆成脅肋之痛矣內傷脅痛之脈右關滑數胃家痰實右寸沉弦肺家懸飲兩關芤澀乃是死血左關數大肝膽火沖尺脈沉數腎水不足尺脈浮大虛陽上越內傷脅痛之治痰飲聚於中脘攻注兩脅者導痰湯加竹瀝懸飲凝結咳逆脅痛十棗湯死血作痛紅花桃仁湯惱怒傷肝肝經鬱火者柴胡清肝飲梔連柴胡湯肝血不足肝氣不調家祕補肝湯肝腎真陰不足龍雷之火上衝家祕肝腎丸若肝腎真陽不足無根之火失守上炎八味丸治之導痰湯南星橘紅白茯苓半夏甘草枳殼熱者沖竹瀝一鍾寒者加白芥子十棗湯見前篇紅花桃仁湯大黃枳殼厚朴桃仁紅花赤芍藥當歸尾柴胡清肝飲柴胡黃芩山梔白芍藥青皮枳殼梔連柴胡湯柴胡黃芩廣皮甘草山梔川黃連家祕補肝湯當歸白芍藥生地川芎青皮香附木通蘇梗鉤藤家祕肝腎丸治肝腎真陰不足龍雷之火上炎當滋陰降火天門冬生地當歸白芍藥黃柏知母八味腎氣丸治肝腎真陽不足無根之火失守上炎法當引火歸源即六味地黃丸加肉桂附子楨用前二方皆治龍雷之火夫龍火主腎雷火主肝然當分肝腎之真陰虛真陽虛若真陰虛者真水涸而火自旺即乾之上九亢龍有悔之象宜用家祕肝腎丸斂而降之若真陽虛者真火不足無根之火失守上浮即坤之上六龍戰於野之象宜用金匱八味丸以攝伏之一陰一陽寒熱天壤堂兒問曰臨症何以分別余曰真陰虛則火旺原症脈象俱是火候如便閉喘咳骨蒸六脈沉數皆真陰虛也若真陽虛則火虛原症脈象俱是虛候如大便泄小便清六脈空大皆真陽虛也胃脘痛論秦子曰胃脘痛在胸之下臍之上兩肋中間但心胞絡痛同在心下臍上極難分別大抵痛而能飲食者心胞絡痛也痛而不能飲食者胃脘痛也二經之痛俗名心頭痛此症內傷者多外感者間或有之今列外感二條內傷七條即古名九種心疼也外感胃脘痛風寒暑熱外感胃脘痛之症向無此症偶值時令暴寒心下悶痛惡寒厥冷二便清利口吐冷沫此寒邪入胃凝結痰飲食積卒然暴痛之症也若時令暴熱心下忽絞痛手足雖冷頭額多汗身雖惡寒口燥舌乾大便雖瀉溺色黃赤此濕熱所傷之症也外感胃脘痛之因其人中氣向寒偶觸時令之寒則寒凝胃口而痛若內有積熱外遇濕熱兩熱蒸釀則熱壅胃口亦成胃痛之症外感胃脘痛之脈或見浮緊寒邪在表或見沉弦寒邪入里或見浮數表有熱邪或見沉數里有熱結外感胃脘痛之治宜分寒熱二條寒痛者先用五積散兼散外寒後用溫胃湯以溫內寒熱痛者先用神術平胃散以清外熱後用清中湯以清裡熱言寒則風亦在焉言熱則暑濕燥火皆在焉五積散白茯苓陳皮半夏甘草川芎白芷枳殼厚朴蒼朮麻黃乾薑肉桂桔梗溫胃湯厚朴砂仁甘草陳皮乾薑白豆蔻黃耆人參薑黃益智仁神術平胃散蒼朮防風甘草石膏知母厚朴廣皮清中湯黃連山梔草豆蔻半夏陳皮白茯苓甘草內傷胃脘痛內傷胃脘痛之症不因外感六淫偶或傷於飲食填塞太倉胸前悶痛此食積症也痛極應背背心一片如冰噁心嘔吐吐出涎痰稍緩此痰飲症也時作時止口渴唇燥痛則多汗此積熱症也二便清利手足逆冷口吐涎沫得寒飲則甚此積冷症也遇氣即發或攻注作痛或凝結作脹此氣滯症也日輕夜重或唧唧作聲得寒則痛得熱暫緩此死血痛也嘔吐清水面上白斑唇紅能食時或吐蛔此蟲積症也故云內傷之痛有七內傷胃脘痛之因飲食不節傷其胃口太陰升降之令凝結壅閉則食積之痛作矣脾胃素弱日飲水穀不能消受停積中脘則成痰飲而痛七情六欲之火時動於中膏粱炙爆之熱日積於內熱久成燥積熱之痛作矣胃陽不足冷飲內傷陰寒凝結陰積冷之痛作矣怒則氣上思則氣結憂思日積氣不宜行則氣滯而成痛血分素熱又喜辛辣之物以傷其陰血則停積於中而成死血之痛濕土主生生之令飲食不謹濕熱內生則蟲積而成痛矣內傷胃脘痛之脈沉實有食沉滑多痰數大為熱遲緩主寒氣滯脈沉死血澀結乍大乍小蟲積使然內傷胃脘痛之治宜平胃散出入主治若食積痛用三稜丸治之痰飲痛者二陳湯導痰湯痛甚滾痰丸積熱作痛者梔連清胃湯有下症神芎丸積冷作痛者豆蔻丸氣滯而痛者蘇子降氣湯死血作痛紅花桃仁湯有下症桃仁承氣湯蟲積痛用萬應丸治之平胃散蒼朮厚朴陳皮甘草三稜丸京三稜枳殼厚朴廣皮甘草二陳湯導痰湯二方見痰症清胃湯見齒痛神芎湯大黃黃芩黑牽牛滑石薄荷川芎豆蔻丸草豆蔻吳茱萸益智仁青皮薑黃麥芽神麯半夏甘草蘇子降氣湯紫蘇子半夏前胡厚朴甘草陳皮沉香當歸紅花桃仁湯紅花桃仁當歸尾赤芍藥澤蘭葉楂肉丹皮山梔桃仁承氣湯桃仁大黃甘草桂枝芒硝枳殼歸尾萬應丸麥芽神麯雷丸陳皮甘草京三稜莪朮檳榔蕪荑鶴蝨使君子家祕保和散蒼朮厚朴半夏廣皮枳殼鮮麥芽楂肉香附檳榔乾葛萊蔔子共為細末多衝蘿蔔汁竹瀝拌濕曬乾研細末白湯調服家祕消堅散三稜莪朮檳榔枳實香附海石治上部癖積加蒼朮厚朴治下部癖積加青皮枳殼梔連二陳湯加竹茹乾葛治嘔吐作痛滾痰丸治痰癖作痛胃痛要分別常痛不常痛二條又要細詳若何痛重若何痛緩若飲食即痛時常氣噯此傷飲食也用家祕保和散若痛而嘔惡吐出痰涎稍減此痰飲痛也平胃導痰湯胃脘有塊常痛不休癖積痛也家祕消堅散時作時止痛而汗出者火也熱而無滯者清火為急清胃湯熱而有滯者消滯為先梔連保和散遇夜痛甚逢冷即痛按之有形或飲食入胃從半邊而下此瘀血痛也先用三稜丸後用桃仁承氣湯痛而能食得食痛減常下蟲積者平胃散加使君子胃中有形按之痛極每夜發熱者此胃癰痛也栝蔞四聖散凡見痛症須防發毒無論胸脅腰背皆要按其痛處若按之愈痛每夜發熱要防內癰腋痛論秦子曰腋痛者在兩脅之上奶旁外側痛連缺盆肺經症也若在腋之下原是脅痛而非腋痛方書以右腋為肺左腋為肝愚無左右之分若見氣粗喘咳者即痛連左腋亦名肺病即見肝家形症只作金邪乘木治肺不治肝以腋下為肺之部分不比脅肋主乎肝膽此余宗錢仲陽肺臟治病之獨訣外感腋痛外感腋痛之症惡寒發熱喘急嗽痰腋下作痛痛引缺盆此風寒傷肺症也若口渴面赤吐痰乾涸小便短赤此燥熱傷肺症也外感腋痛之因風寒壅於肺經腋為肺脈所注之俞故腋為之痛燥熱刑金肺氣焦滿攻注腋下亦令人痛是以風寒暑濕燥皆有腋痛之候也外感腋痛之脈右寸浮緊風寒傷肺或見浮洪風熱之診或見躁疾燥火刑金外感腋痛之治傷寒者麻黃杏子湯風邪傷肺加味瀉白散燥火傷肺金之氣者知石瀉白散燥火傷肺金之血者青金瀉白散麻黃杏子湯麻黃杏子米仁桑白皮桔梗甘草加味瀉白散桑白皮地骨皮桔梗杏仁防風黃芩栝蔞仁知母薄荷枳殼橘紅甘草口渴加石膏花粉竹葉清肺飲山梔黃芩薄荷甘草桔梗連翹加竹葉七片同煎口渴加石膏大便祕加大黃知石瀉白散家祕治火邪傷肺之氣桑白皮地骨皮甘草知母石膏胃火上衝加葛根肝火旺加柴胡黃芩青金瀉白散家祕治火邪傷肺之血桑白皮地骨皮甘草黃芩山梔肝火刑金加白芍藥胃火旺加乾葛石膏內傷腋痛內傷腋痛之症無外感之邪但兩腋下作痛或見咳嗽氣逆此內傷腋痛之症也內傷腋痛之因或惱怒怫鬱肝火刑金或膏粱積熱熏蒸肺氣或房勞不謹腎火上衝皆成內傷腋痛之症內傷腋痛之脈寸口脈大肺氣有傷右關洪數膏粱積熱脈沉而結肺氣膹郁寸數尺疾腎火刑金內傷腋痛之治若惱怒傷肝木火刑金加味瀉白散膏粱積熱土中之火刑金加味清胃湯倍川連枳殼房勞不謹水中之火刑金家祕天地煎合黃芩瀉白散二母湯加味瀉白散桑白皮地骨皮甘草黃芩柴胡鉤藤蘇梗桔梗山梔加味清胃湯升麻川連甘草葛根石膏桑白皮枳殼地骨皮家祕天地煎天冬地黃黃柏知母川貝母甘草麥冬桑白皮地骨皮水煎三四次沖玄武膠收黃芩瀉白散即瀉白散加黃芩二母湯即貝母知母二味同煎肩背痛論秦子曰內經云西風生於秋病在肺腧在肩背則肩背之痛乃肺之分野且手陽明大腸之脈循臂上廉上肩出髃骨之前廉上出柱骨下入缺盆絡肺其支別者從缺盆上頸貫頰又云手太陽小腸之脈出肩解繞肩胛交肩上入缺盆其支別者從缺盆循頸上頰按此論之則肩背肺俞之痛乃肺與大小腸為患矣故肺病則缺盆中痛肩背痛大腸病則耳後肩臑肘臂皆痛小腸病則肩臑肘臂腫痛故凡背部肺腧作痛要分別右左二腧外感內傷有餘不足若右肺腧缺盆痛此肺與大腸之症若左肺腧缺盆痛乃是肺與小腸症也以左右而分大腸小腸至肺腧則左右皆屬肺也然太陽膀胱之脈亦在於背但膀胱太陽之病滿背皆痛不比肺痛止在肺腧缺盆也外感肩背痛外感肩背痛之症背痛肩痛發熱不惡寒反惡熱煩躁不寧便閉便赤口渴唇焦此火邪傷肺之症也若背痛肩痛頭痛發熱內雖煩躁外反惡寒此風寒傷肺之症也外感肩背痛之因內經云歲火太過民病肩背熱痛又云少陰司天熱淫所勝民病肩背缺盆痛此火邪傷肺也又有肺素有熱風寒外束皮毛肺熱不得泄越而肩背肺俞作痛此寒邪傷肺也外感肩背痛之脈右寸洪數肺經熱壅火邪所傷脈浮而緊表有寒邪風寒外束外感肩背痛之治若火邪傷肺當用家祕瀉白湯清燥清肺飲肺素有熱風寒束於肌表者羌防瀉白散家祕瀉白湯桑白皮地骨皮粉甘草黃芩石膏黃連清肺飲桔梗黃芩山梔連翹天花粉玄參薄荷甘草羌防瀉白散即瀉白散加羌活防風內傷肩背痛內傷肩背痛之症氣怯神離精神不足痛勢不急仍能睡臥此肺氣不足之症也若喘急氣逆不得睡臥此肺壅作痛之症也若勞傷脫力遇勞即痛此傷損之症也口渴唇焦二便赤澀煩躁不寧此積熱作痛之症也內傷肩背痛之因元氣素虧又復傷損則肺氣不足而作痛肺熱葉焦復有觸發則肺氣怫鬱而作痛勞碌舉重損傷筋膜則肺竅有損而作痛膏粱酒客腸胃積熱上熏肺金則土中之火刑金而肩背痛缺盆肺俞每每作痛此皆內傷肩背痛也內傷肩背痛之脈右脈浮大按之無根肺氣不足寸口脈盛按之數實氣壅肺實六脈弦大按之促結傷損之診右關沉數腸胃積熱左關弦數肝膽之火內傷肩背痛之治氣怯神清脈大而虛四君子湯補中益氣湯喘急氣逆不得安臥六脈躁盛重則葶藶瀉肺湯輕則家祕瀉白散久痛不愈氣血有傷者四物湯八珍湯加秦艽續斷鉤藤羌活膏粱積熱口燥唇焦六脈沉數者家祕瀉白散木火刑金左關脈數者瀉白各半湯四君子湯治氣虛作痛人參白朮茯苓甘草補中益氣湯治氣血兩虛肩背作痛人參白朮黃耆當歸陳皮甘草升麻柴胡葶藶瀉肺湯治痰飲壅塞肺竅肩背缺盆牽引作痛葶藶子大棗肉家祕瀉白散治實火刑金肺熱喘咳唇焦便赤桑白皮地骨皮甘草黃芩石膏川黃連家祕加葛根清胃火加白芍藥清脾火加柴胡清肝膽之火加辰砂清心火加黃柏清腎火加枳殼清大腸之火加木通清小腸之火四物湯治血虛肩背作痛熟地黃白芍藥當歸川芎家祕加秦艽續斷鉤藤羌活治諸凡身痛八珍湯治氣血兩虧肩背作痛即四君子四物湯家祕加秦艽續斷鉤藤羌活瀉白各半湯桑白皮地骨皮甘草膽草山梔黃芩加青黛沖服腰痛總論秦子曰內經論腰痛諸條不一其曰太陽所至為腰痛少陽腰痛如針刺陽明腰痛不可顧此數者乃論外感腰痛也其曰用力舉重入房過度轉搖不能腎將憊矣此論內傷腰痛也今立外感三條以該六氣內傷五條以該七情外感腰痛風濕風濕腰痛風濕腰痛之症發熱惡風自汗身重腰背重痛不能轉側此風濕腰痛之症也風濕腰痛之因或雨濕之年風濕襲入肌表則時行腰痛此因歲氣而致病者或衝風冒雨風濕感人或以水為事水舍皮膚一人獨病此人自感冒而致病者也風濕腰痛之脈脈多浮澀左尺浮澀太陽風濕左尺細澀少陰風濕左關浮澀少陽風濕左關細澀厥陰風濕右關浮澀陽明風濕右關細澀太陰風濕風濕痛之治內經云腰痛引項脊尻背太陽經也宜羌獨敗毒散加白芷蒼朮腰痛引脊內廉少陰經痛也宜獨活秦艽湯腰痛如錐刺皮中少陽經痛也宜柴胡獨活湯腰痛如張弓弦厥陰痛也宜柴胡芍藥湯腰痛不可顧如有見善悲者陽明經痛也白芷獨活湯腰以下如橫木居其中太陰經痛也蒼獨腎著湯羌獨敗毒散羌活獨活防風荊芥川芎柴胡前胡甘草蒼朮白芷獨活秦艽湯獨活秦艽防風川芎蒼朮柴胡獨活湯柴胡獨活防風川芎蒼朮青皮甘草芍藥柴胡湯白芍藥獨活防風川芎蒼朮青皮鉤藤白芷獨活湯白芷獨活防風蒼朮秦艽乾葛蒼獨腎著湯白朮白茯苓乾葛蒼朮獨活防風寒濕腰痛寒濕腰痛之症頭痛身痛無汗拘緊腰痛不能轉側此寒濕腰痛之症也寒濕腰痛之因或寒濕之年陰寒司令民病身重腰痛此因歲氣而成病者或沖寒冒雨陰寒雨濕之邪致痛此人自感冒而成病者寒濕腰痛之脈脈多沉緊左尺沉緊太陽寒濕左尺細緊少陰寒濕左關沉緊少陽寒濕左關細緊厥陰寒濕右關沉緊陽明寒濕右關細緊太陰寒濕寒濕腰痛之治太陽寒濕羌活敗毒散加蒼朮少陰寒濕獨活蒼朮湯少陽寒濕柴胡蒼朮湯厥陰寒濕四逆湯加柴胡獨活陽明寒濕蒼朮白芷湯太陰寒濕濟生朮附湯滲濕湯未效用五苓散分利小便羌活敗毒散羌活獨活前胡川芎防風荊芥甘草蒼朮寒令加桂枝生薑獨活蒼朮湯獨活蒼朮防風細辛川芎甘草寒甚加薑桂柴胡蒼朮湯柴胡蒼朮川芎防風廣皮甘草獨活寒甚加生薑四逆湯乾薑熟附子炙甘草柴胡獨活蒼朮白芷湯蒼朮白芷防風乾葛升麻乾薑甘草獨活濟生朮附湯白朮熟附子杜仲乾薑滲濕湯白朮乾薑白茯苓橘紅蒼朮丁香甘草寒甚加桂枝五苓散白茯苓豬苓澤瀉白朮肉桂氣滯者去白朮濕熱腰痛濕熱腰痛之症內熱煩熱自汗口渴二便赤澀痠痛沉重此濕熱腰痛之症也濕熱腰痛之因或濕火之年濕熱行令人病腰痛長幼皆發此因歲氣而成病者或形役陽亢外冒濕熱之邪此人自感冒而成病者濕熱腰痛之脈脈多沉數左尺沉數太陽濕熱左尺細數少陰濕熱左關沉數少陽濕熱左關細數厥陰濕熱右關沉數少陽濕熱右關細數太陰濕熱濕熱腰痛之治左尺沉數者羌獨沖和湯左尺細數者獨活二妙丸左關沉數者柴獨蒼朮湯左關細數者柴胡芍藥湯右關沉數者芷葛二妙丸右關細數者防獨神術湯羌獨沖和湯羌活黃芩川芎白芷防風細辛蒼朮廣皮甘草獨活熱甚加黃柏獨活二妙丸獨