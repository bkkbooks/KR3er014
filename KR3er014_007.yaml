body:
  text: 跋豫始於攸寧堂中與秦先生周旋見其簡易古朴坦然帖適而議論斬斬不務為影響迎合既悚然重之進而探其底蘊則浩乎若秋水之時至決川灌河而四達也渙乎若春冰之釋溶溶然淅淅然而還於澤也進而試其功效則所以治某某者如此而愈矣所以治某某者如彼而又愈矣遂愛焉而樂與交豫室抱沉疴二載幾疑難起秦先生為豫處方投之立效第輟則旋作今服藥已數斤許矣疾亦去八九矣先生固見之真豫亦自謂信之專也秦先生故業儒其洋洋灑灑之機間流露於口頰而是編也研精殫思條分縷析絶不欲炫其文采秦子曰醫雖活人事乎終小道耳烏用震而驚之耶是編也使初習其事者視之瞭然若指諸掌即冥心高契者玩軒岐之妙言而未歸實地雖口以為笙蹄心未嘗不於此收魚兔也吾知利於物而己奚緣飾為昔許學士抱技通神或勸之立言笑而應曰若謂書真有用耶受櫝而還珠者比比也吾悉其奇以告人未獲吾益且加損焉故曰托諸空言不如見諸實事俯仰之間皆陳迹也達哉學士之論乎五方風氣不齊古今運氣大別朱張劉李四家之言善用之亦各極其勝專泥之則不能無偏者皆以為大中至正百世無弊之道而不知有隨時之義在其中也是編也就證而審因就因而審脈就脈而審治各求其故無成見之設原不過補綴前人若謂立言則吾豈敢先生為豫言豫默然而受其教退而思之其真進乎技不矜乎名者耶故既為之於前復為之述於後誠重之也誠愛之也康熙四十七年戊子蕤賓朔日年家眷晚弟顧冒朝佩聲氏拜題
